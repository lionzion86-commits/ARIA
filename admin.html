<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what lets the bottom tab bar sit under the
     iPhone home indicator instead of above it; the safe-area insets
     below do the actual spacing. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1F44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aria™ · Ops</title>
<link rel="icon" href="/aria-icon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- ============================================================
     THE OPS DASHBOARD. INTERNAL. NOT CUSTOMER-FACING.

     WHY IT IS ITS OWN FILE AND NOT A VIEW IN index.html
     index.html is 710 KB and every shopper downloads it. Putting an ops
     tool inside it would make every customer pay for a page only two
     people can open, and would put the ops markup one CSS mistake away
     from the storefront. It also means this page can be phone-shaped
     without arguing with the storefront's layout.

     NO TAILWIND, NO CDN, NO BUILD. The storefront pulls Tailwind from a
     CDN; this page does not, for three reasons: an ops tool must load on
     bad mobile data in Lima, it must not break because a CDN is having a
     day, and there is nothing here that plain CSS does not do. Every
     byte of this file is this file.

     WHERE THE DATA COMES FROM
     The original endpoint: /.netlify/functions/admin-dashboard, with ?view=.
     Ops v1 adds: admin-pipeline (?view=pipeline), admin-batches
     (?view=batches|claims), admin-tax (?view=tax), and POST
     admin-orders-update (the express flag). Every one of them is gated
     on a real session cookie whose email is on ADMIN_EMAILS.
     This page's gate is a COURTESY — it shows a sign-in prompt instead
     of an error — and is never the security boundary. The server refuses
     regardless of what this page believes.
     ============================================================ -->
<style>
  :root {
    --navy: #0A1F44;
    --navy-2: #0D2A5C;
    --blue: #2F5FEE;
    --sky: #EAF0FF;
    --gold: #F4C463;
    --bg: #F7F8FA;
    --card: #FFFFFF;
    --line: #E4E7EC;
    --ink: #10172A;
    --ink-2: #5B6478;
    --ink-3: #8A93A6;
    --ok: #0E7A4D;
    --ok-bg: #E6F4EC;
    --warn: #8A6B1F;
    --warn-bg: #FDF3E3;
    --bad: #B3261E;
    --bad-bg: #FCECEA;
    --tabbar: 62px;
  }
  /* Dark mode because this gets read in bed and in a warehouse. Tokens
     only — no component knows which mode it is in. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1017; --card: #151B24; --line: #262E3A;
      --ink: #EDF0F5; --ink-2: #A3ACBD; --ink-3: #78829A;
      --sky: #17233D; --ok-bg: #11291E; --warn-bg: #2A2313; --bad-bg: #2C1614;
      --ok: #5FD19A; --warn: #E0BE6A; --bad: #F2867C;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    /* Room for the fixed tab bar plus the home indicator. */
    padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 12px);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  /* 16px minimum on anything typeable: iOS Safari zooms the whole page
     when a focused field is smaller, and a zoomed ops tool is unusable. */
  input, select, textarea { font-size: 16px; }
  button { cursor: pointer; touch-action: manipulation; }
  a { color: var(--blue); }

  /* ---- chrome ---- */
  header {
    position: sticky; top: 0; z-index: 30;
    background: var(--navy);
    color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 1px 0 rgba(255,255,255,.08);
  }
  .brand { font-weight: 800; letter-spacing: -.02em; font-size: 16px; }
  .brand span { color: var(--gold); }
  .who { margin-left: auto; font-size: 11.5px; color: #AFBBD6; text-align: right; line-height: 1.3; max-width: 46%; overflow-wrap: anywhere; }
  .refresh {
    background: rgba(255,255,255,.12); border: 0; color: #fff;
    width: 44px; height: 44px; border-radius: 999px; font-size: 17px;
    display: grid; place-items: center; flex: 0 0 auto;
  }
  .refresh[aria-busy="true"] { opacity: .5; }

  main { padding: 14px 16px 0; max-width: 760px; margin: 0 auto; }

  /* `display: grid` beats the UA stylesheet's `[hidden] { display: none }`,
     so the `hidden` attribute on <nav> did nothing and the tab bar sat
     under the sign-in gate and the loading state — offering tabs to
     somebody the server had just refused. The attribute selector adds
     specificity over the bare `nav.tabs` below, so this wins wherever it
     sits in the file. */
  nav.tabs[hidden] { display: none; }
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.tabs button {
    background: none; border: 0; padding: 9px 2px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10.5px; font-weight: 700; color: var(--ink-3);
    min-height: 44px; /* thumb target */
  }
  nav.tabs button .ico { font-size: 19px; line-height: 1; }
  nav.tabs button[aria-selected="true"] { color: var(--blue); }
  nav.tabs button .badge {
    position: absolute; transform: translate(16px, -6px);
    background: var(--bad); color: #fff; font-size: 9.5px; font-weight: 800;
    min-width: 16px; height: 16px; border-radius: 999px; padding: 0 4px;
    display: grid; place-items: center;
  }

  /* ---- primitives ---- */
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 13px 14px; margin-bottom: 11px;
  }
  .card.tight { padding: 11px 12px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .row + .row { margin-top: 5px; }
  .k { font-size: 12.5px; color: var(--ink-2); }
  .v { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .v.big { font-size: 19px; letter-spacing: -.02em; }
  .muted { color: var(--ink-3); }
  h2 {
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .07em; color: var(--ink-3); margin: 18px 2px 8px;
  }
  h2:first-child { margin-top: 2px; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
    background: var(--sky); color: var(--blue); white-space: nowrap;
  }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.flat { background: transparent; color: var(--ink-3); border: 1px solid var(--line); }
  .dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; flex: 0 0 auto; }
  /* 44px, not 40: Apple's minimum touch target, and this is a tool
     operated one-handed on a phone while doing something else. */
  .btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 0 15px; height: 44px; font-size: 13.5px; font-weight: 700;
  }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: .45; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .note { font-size: 12px; line-height: 1.45; color: var(--ink-2); }
  .banner {
    border-radius: 12px; padding: 11px 13px; margin-bottom: 11px;
    font-size: 12.5px; line-height: 1.45; font-weight: 600;
  }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .banner.info { background: var(--sky); color: var(--navy); }
  /* overflow-wrap, because the Stripe webhook URL and an order id are
     both longer than a 393px phone and were running past the card edge. */
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
  .hr { height: 1px; background: var(--line); margin: 11px -14px; }
  details > summary {
    list-style: none; cursor: pointer; font-size: 12.5px; font-weight: 700;
    color: var(--blue); padding: 7px 0; min-height: 32px;
  }
  details > summary::-webkit-details-marker { display: none; }
  .items { margin: 0; padding: 0; list-style: none; }
  .items li { display: flex; gap: 8px; justify-content: space-between; font-size: 12.5px; padding: 3px 0; }
  .items li span:first-child { color: var(--ink-2); overflow-wrap: anywhere; }
  .field { display: block; margin-bottom: 9px; }
  .field > span { display: block; font-size: 11.5px; font-weight: 800; color: var(--ink-2); margin-bottom: 4px; }
  .field input {
    width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px;
    padding: 0 11px; background: var(--card);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .head { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .title { font-weight: 800; font-size: 14px; letter-spacing: -.01em; }
  .sub { font-size: 11.5px; color: var(--ink-3); }
  .spin { text-align: center; padding: 30px 0; color: var(--ink-3); font-size: 13px; }

  /* ---- ops v1: pipeline, batches, claims, tax, express ------------------
     Same tokens, same rules as everything above: 16px typeables, 44px
     targets, pills for state, details/summary for anything expandable.
     Nothing here knows about dark mode — the tokens do that. */
  .field select {
    width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px;
    padding: 0 11px; background: var(--card);
  }
  /* Segmented filter: three options is the most that fits a 393px phone
     as buttons; four or more would become a select. */
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1 1 0; min-height: 44px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); font-size: 12px; font-weight: 800; color: var(--ink-2);
    padding: 6px 4px;
  }
  .seg button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  @media (prefers-color-scheme: dark) {
    .seg button.on { background: var(--blue); border-color: var(--blue); }
  }
  .check {
    display: flex; align-items: center; gap: 10px; min-height: 44px;
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .check input { width: 22px; height: 22px; accent-color: var(--blue); flex: 0 0 auto; }
  /* Stage timeline inside a pipeline card: done stages get the green dot,
     the current stage gets the blue ring, future stages stay gray. */
  .tl { margin: 4px 0 0; padding: 0; list-style: none; }
  .tl li {
    display: flex; align-items: baseline; gap: 10px;
    padding: 7px 0; border-top: 1px dashed var(--line); font-size: 12.5px;
  }
  .tl li:first-child { border-top: 0; }
  .tl .tdot {
    width: 9px; height: 9px; border-radius: 999px; background: var(--line);
    flex: 0 0 auto; transform: translateY(1px);
  }
  .tl li.done .tdot { background: var(--ok); }
  .tl li.now .tdot { background: var(--blue); box-shadow: 0 0 0 3px var(--sky); }
  .tl .tlab { font-weight: 700; }
  .tl li.now .tlab { color: var(--blue); }
  .tl .tat { margin-left: auto; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* The "Más" menu: big rows, one thumb-tap each, label plus a plain-
     Spanish one-liner so nobody has to guess what "Lotes" means. */
  .mitem {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 14px; margin-bottom: 10px; font-size: 14.5px; font-weight: 800;
    min-height: 60px;
  }
  .mitem .ico { font-size: 22px; line-height: 1; }
  .mitem .sub2 { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: 2px; }
  .mitem .chev { margin-left: auto; color: var(--ink-3); font-size: 20px; font-weight: 400; }

  /* Wider screens get two columns; the layout is still phone-first and
     this is the only thing that changes. */
  @media (min-width: 720px) {
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 11px; align-items: start; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">ARIA <span>OPS</span></div>
  <div class="who" id="who"></div>
  <button class="refresh" id="refreshBtn" onclick="refresh()" aria-label="Actualizar">&#x21bb;</button>
</header>

<main id="main">
  <div class="spin" id="boot">Cargando…</div>
</main>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="orders"   aria-selected="true"  onclick="go('orders')"><span class="ico">&#128230;</span>Pedidos</button>
  <button data-tab="payments" aria-selected="false" onclick="go('payments')"><span class="ico">&#128179;</span>Pagos</button>
  <button data-tab="pipeline" aria-selected="false" onclick="go('pipeline')"><span class="ico">&#128260;</span>Tubería</button>
  <button data-tab="couriers" aria-selected="false" onclick="go('couriers')"><span class="ico">&#128666;</span>Envíos</button>
  <button data-tab="more"     aria-selected="false" onclick="go('more')"><span class="ico">&#9776;</span>Más</button>
</nav>

<script>
/* ============================================================
   No framework, no bundler. Render is `innerHTML` from data, which is
   why esc() below is not optional: customer names, addresses and ops
   notes are all attacker-or-typo-supplied text.
   ============================================================ */
const API = "/.netlify/functions/admin-dashboard";

const state = {
  tab: "orders", more: "menu",
  summary: null, orders: null, payments: null, couriers: null, ledger: null, offset: 0,
  /* ops v1 */
  pipeline: null, pipelineQ: "", pipelineStage: "", pipelineExpress: "all",
  batches: null, claims: null, tax: null, taxFilter: "unreconciled", expressOrders: null,
};

/* ---- formatting ---------------------------------------------------- */
function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
/* A blank is not a zero — the same rule the ledger is built on. An
   unknown number renders as an em dash, never as S/ 0.00, because
   "nobody has established this" and "it is zero" are different facts
   and only one of them is safe to act on. */
function pen(n) {
  if (n == null || n === "" || !isFinite(Number(n))) return '<span class="muted">—</span>';
  return "S/ " + Number(n).toLocaleString("es-PE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function usd(n) {
  if (n == null || !isFinite(Number(n))) return '<span class="muted">—</span>';
  return "$" + Number(n).toFixed(2);
}
function when(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  // Peru time, because every operator reading this is in Peru and a UTC
  // timestamp on an ops screen gets mentally mis-converted at 7pm.
  return d.toLocaleString("es-PE", {
    timeZone: "America/Lima", day: "2-digit", month: "short",
    hour: "2-digit", minute: "2-digit", hour12: false,
  });
}

const SHIPPING_ES = {
  created: "Pedido registrado", in_transit: "En camino", in_customs: "En aduana",
  out_for_delivery: "En reparto", delivered: "Entregado",
  exception: "Con novedad", cancelled: "Cancelado",
};
const PAYMENT_ES = {
  unpaid: ["Sin pagar", "warn"], paid: ["Pagado", "ok"],
  partially_refunded: ["Reembolso parcial", "warn"], refunded: ["Reembolsado", "bad"],
  disputed: ["En disputa", "bad"], lost_dispute: ["Disputa perdida", "bad"],
  failed: ["Pago fallido", "bad"], canceled: ["Pago cancelado", "flat"],
  succeeded: ["Cobrado", "ok"], unknown: ["Desconocido", "flat"],
};
/* The registry's `role` is English and internal ("primary"/"secondary").
   The ops screen prints plain Spanish: Principal / Secundario. */
const ROLE_ES = { primary: "Principal", secondary: "Secundario" };
const ORDER_ES = {
  pending_payment: ["Esperando pago", "warn"], confirmed: ["Confirmado", "ok"],
  cancelled: ["Cancelado", "flat"],
};
function payPill(status) {
  const [label, tone] = PAYMENT_ES[status] || [status || "—", "flat"];
  return `<span class="pill ${tone}">${esc(label)}</span>`;
}

/* ---- transport ----------------------------------------------------- */
async function api(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`${API}?${qs}`, { credentials: "same-origin" });
  if (res.status === 403) throw Object.assign(new Error("no-autorizado"), { code: 403 });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

/* ---- the gate (a courtesy, never the boundary) --------------------- */
function renderGate() {
  document.getElementById("tabs").hidden = true;
  document.getElementById("main").innerHTML = `
    <div class="card">
      <div class="title" style="margin-bottom:6px">Solo para ops</div>
      <p class="note">
        Este panel necesita una sesión cuyo correo esté en <span class="mono">ADMIN_EMAILS</span>.
        Inicia sesión en la tienda con esa cuenta y vuelve aquí.
      </p>
      <div class="btns" style="margin-top:12px">
        <a class="btn primary" href="/" style="text-decoration:none; display:grid; place-items:center">Ir a iniciar sesión</a>
        <button class="btn" onclick="refresh()">Ya inicié sesión</button>
      </div>
    </div>`;
}

/* ---- summary strip, shown above every tab -------------------------- */
function summaryStrip() {
  const s = state.summary;
  if (!s) return "";
  /* COLLAPSED BY DEFAULT ON A PHONE. Three stacked banners plus the money
     card filled the entire 393x852 screen, so an operator opening the app
     saw only warnings and had to scroll to reach a single order. The count
     stays visible — the point is not to hide that something is wrong, it
     is to not spend the whole first screen saying so. */
  const list = s.alerts || [];
  const worst = list.some((a) => a.level === "warn") ? "warn" : "info";
  const alerts = list.length
    ? `<details class="banner ${worst}" ${list.length <= 1 ? "open" : ""}>
         <summary style="color:inherit; padding:0">
           ${list.length === 1 ? esc(list[0].message) : `${list.length} avisos — toca para ver`}
         </summary>
         ${list.length > 1 ? `<ul class="items" style="margin-top:7px">${
           list.map((a) => `<li><span style="color:inherit">${esc(a.message)}</span></li>`).join("")
         }</ul>` : ""}
       </details>`
    : "";

  const gateway = s.gateway && !s.gateway.webhookConfigured
    ? `<div class="banner bad">
         <strong>Ninguna pasarela conectada.</strong> ${esc(s.gateway.note)}
       </div>`
    : "";

  const blocked = s.couriers && s.couriers.createBlocked
    ? `<div class="banner bad">${esc(s.couriers.createBlocked)}</div>` : "";

  const truncated = s.scan && s.scan.truncated
    ? `<div class="banner warn">Los totales cubren los ${s.scan.scanned} pedidos más recientes de ${s.scan.orders}. El libro mayor exporta el mismo rango.</div>`
    : "";
  const unreadable = s.scan && s.scan.unreadable
    ? `<div class="banner warn">${s.scan.unreadable} registro(s) de pedido no se pudieron leer y quedaron fuera de los totales.</div>`
    : "";

  return `${gateway}${blocked}${alerts}${truncated}${unreadable}
    <div class="card tight">
      <div class="row">
        <span class="k">Facturado</span>
        <span class="v big">${pen(s.money.billedPen)}</span>
      </div>
      <div class="row">
        <span class="k">Cobrado real (pasarela)</span>
        <span class="v">${s.money.capturedPen ? pen(s.money.capturedPen) : '<span class="muted">nada cobrado</span>'}</span>
      </div>
      <div class="row"><span class="k">Flete cobrado</span><span class="v">${pen(s.money.freightPen)}</span></div>
      <div class="row"><span class="k">Impuesto estimado</span><span class="v">${pen(s.money.taxEstimatedPen)}</span></div>
      <div class="row"><span class="k">Impuesto real SUNAT</span><span class="v">${s.money.taxActualPen ? pen(s.money.taxActualPen) : '<span class="muted">sin conciliar</span>'}</span></div>
      <div class="row"><span class="k">Saldo Aria aplicado</span><span class="v">${pen(s.money.walletAppliedPen)}</span></div>
      <div class="hr"></div>
      <div class="row">
        <span class="k">Pedidos</span>
        <span class="v">${s.counts.orders}
          ${s.counts.unpaid ? `<span class="pill warn" style="margin-left:6px">${s.counts.unpaid} sin pagar</span>` : ""}
          ${s.counts.paid ? `<span class="pill ok" style="margin-left:6px">${s.counts.paid} pagados</span>` : ""}
        </span>
      </div>
      <div class="row"><span class="k">Envíos abiertos</span><span class="v">${s.shipments.open} de ${s.shipments.total}</span></div>
    </div>`;
}

/* ---- tab 1: orders ------------------------------------------------- */
function orderCard(o, payment, shipments) {
  const [ostat, otone] = ORDER_ES[o.status] || [o.status || "—", "flat"];
  const cust = o.customer || {};
  const name = cust.name || cust.nombre || "(sin nombre)";
  const items = (o.items || []).map((it) => `
    <li><span>${esc(it.name || it.title || "ítem")}${(it.qty || 1) > 1 ? ` ×${Number(it.qty)}` : ""}</span>
        <span class="v">${usd((Number(it.priceUsd) || 0) * (Number(it.qty) || 1))}</span></li>`).join("");

  const productsUsd = (o.items || []).reduce((s, it) => s + (Number(it.priceUsd) || 0) * (Number(it.qty) || 1), 0);
  const fx = Number(o.fxRateUsed) || null;
  const penOf = (u) => (fx && u != null && isFinite(u) ? u * fx : null);

  const ship = (shipments || []).map((s) => `
    <div class="row">
      <span class="k">${esc(s.provider || "courier")}
        <span class="pill flat" style="margin-left:4px">${esc(SHIPPING_ES[s.status] || s.status || "sin estado")}</span>
      </span>

/* The SUNAT reconciliation form. Recording the real figure and ISSUING
   the saldo are two separate acts on purpose: the first is data entry,
   the second moves money, and the second only happens when somebody
   presses the second button. */
function taxForm(o) {
  return `
  <div class="hr"></div>
  <div class="sub" style="margin-bottom:7px; font-weight:800; color:var(--ink-2)">Conciliar con SUNAT</div>
  <div class="grid2">
    <label class="field"><span>Impuesto real (USD)</span>
      <input type="number" step="0.01" inputmode="decimal" id="tax-usd-${esc(o.orderId)}" value="${o.taxActualUsd != null ? Number(o.taxActualUsd) : ""}"></label>
    <label class="field"><span>Doc. SUNAT</span>
      <input type="text" id="tax-doc-${esc(o.orderId)}" value="${esc(o.sunatDocRef || "")}"></label>
  </div>
  <div class="btns">
    <button class="btn" onclick="saveTax('${esc(o.orderId)}')">Guardar impuesto real</button>
  </div>
  <p class="note" id="tax-msg-${esc(o.orderId)}" style="margin:8px 0 0"></p>`;
}

async function saveTax(orderId) {
  const msg = document.getElementById(`tax-msg-${orderId}`);
  const usdVal = document.getElementById(`tax-usd-${orderId}`).value;
  const doc = document.getElementById(`tax-doc-${orderId}`).value;
  msg.textContent = "Guardando…";
  try {
    const res = await fetch("/.netlify/functions/admin-orders-update", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId, tax: { taxActualUsd: usdVal === "" ? null : Number(usdVal), sunatDocRef: doc } }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Error");
    const owed = data.taxOwed;
    if (owed && owed.creditDuePen > 0) {
      msg.innerHTML = `Guardado. Cobramos <strong>${pen(owed.creditDuePen)}</strong> de más — le corresponde como saldo Aria a ${esc(owed.buyerEmail || "el comprador")}.
        <button class="btn" style="margin-top:8px" onclick="issueCredit('${esc(orderId)}','${esc(owed.buyerEmail || "")}',${owed.creditDuePen})">Emitir ${pen(owed.creditDuePen)} de saldo</button>`;
    } else if (owed && owed.absorbedPen > 0) {
      msg.innerHTML = `Guardado. SUNAT cobró <strong>${pen(owed.absorbedPen)}</strong> más que el estimado: Aria lo absorbe, el cliente no se vuelve a cobrar.`;
    } else {
      msg.textContent = owed ? "Guardado. El estimado coincidió con el real." : "Conciliación borrada.";
    }
  } catch (e) {
    msg.textContent = e.message;
  }
}

async function issueCredit(orderId, email, amountPen) {
  const msg = document.getElementById(`tax-msg-${orderId}`);
  if (!email) { msg.textContent = "Este pedido no tiene una cuenta asociada — el saldo Aria necesita un comprador registrado."; return; }
  msg.textContent = "Emitiendo saldo…";
  try {
    const res = await fetch("/.netlify/functions/admin-wallet-credit", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, amountPen, orderId, reason: `Impuesto real menor al estimado — pedido ${orderId}` }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Error");
    msg.innerHTML = `Saldo emitido. Nuevo saldo de ${esc(email)}: <strong>${pen(data.balancePen)}</strong>.`;
  } catch (e) {
    msg.textContent = e.message;
  }
}

/* ---- ops v1: pipeline, batches, claims, tax, express ------------------
   New endpoints, same contract discipline as the originals: the server
   decides, this page renders. The 11 pipeline stages are NOT hardcoded
   here — the stage filter is built from the stages the endpoint returns,
   so a backend stage rename never leaves a dead option in the dropdown.

   The ?view=couriers contract now includes the Velozzy (primary) and
   Lady A rows; that section is data-driven, so a new courier changes
   nothing here except the registry on the server. */

/* api() above is pinned to admin-dashboard because downloadLedger() and
   the gate lean on its path. These siblings take the function path, with
   the same 403 treatment: the server is the boundary, this page is the
   courtesy. */
async function api2(path, params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`${path}${qs ? "?" + qs : ""}`, { credentials: "same-origin" });
  if (res.status === 403) throw Object.assign(new Error("no-autorizado"), { code: 403 });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

/* Every stage the loaded orders have seen, in first-seen order. The
   contract promises 11; if it ever promises 12 the dropdown follows. */
function pipeStages() {
  const map = new Map();
  for (const o of (state.pipeline && state.pipeline.orders) || []) {
    for (const s of o.stages || []) {
      if (s && s.key && !map.has(s.key)) map.set(s.key, s.label || s.key);
    }
    if (o.currentStage && !map.has(o.currentStage)) {
      map.set(o.currentStage, o.currentStageLabel || o.currentStage);
    }
  }
  return [...map.entries()];
}

function pipeStageOptionsHtml() {
  const cur = state.pipelineStage;
  return `<option value="">Todas las etapas</option>` + pipeStages().map(([k, label]) =>
    `<option value="${esc(k)}"${k === cur ? " selected" : ""}>${esc(label)}</option>`).join("");
}

function refreshPipeStageOptions() {
  const sel = document.getElementById("pipeStage");
  if (sel) sel.innerHTML = pipeStageOptionsHtml();
}

/* The pill tone for the current stage: finished endings go green,
   cancelled/exception go red, everything mid-flight stays the default
   blue. The keys are the contract's, so this is a heuristic with a plain
   fallback, not a registry. */
function stageTone(o) {
  const k = String(o.currentStage || "").toLowerCase();
  if (k.includes("cancel") || k.includes("exception")) return "bad";
  const stages = o.stages || [];
  const i = stages.findIndex((s) => s.key === o.currentStage);
  if (i >= 0 && i === stages.length - 1 && stages[i].at) return "ok";
  return "";
}

function stageTimeline(o) {
  const stages = o.stages || [];
  if (!stages.length) return '<p class="note">Sin etapas registradas.</p>';
  const items = stages.map((s) => {
    const cls = `${s.at ? "done" : ""}${s.key === o.currentStage ? " now" : ""}`.trim();
    return `<li${cls ? ` class="${cls}"` : ""}><span class="tdot"></span>` +
      `<span class="tlab">${esc(s.label || s.key)}</span>` +
      `<span class="tat">${s.at ? when(s.at) : "pendiente"}</span></li>`;
  }).join("");
  return `<ul class="tl">${items}</ul>`;
}

function pipelineCard(o) {
  const fee = o.expressFeeUsd != null ? ` · ${usd(o.expressFeeUsd)}` : "";
  return `
  <div class="card">
    <div class="head">
      <div>
        <div class="title mono">${esc(o.orderId)}</div>
        <div class="sub">${when(o.createdAt)} · ${esc(o.customerName || o.customerEmail || "—")}</div>
      </div>
      <div style="text-align:right; display:flex; flex-direction:column; gap:4px; align-items:flex-end">
        ${o.expressSelected ? `<span class="pill warn">⚡ Ni bien llegue${fee}</span>` : ""}
        ${payPill(o.paymentStatus)}
        <span class="pill ${stageTone(o)}">${esc(o.currentStageLabel || o.currentStage || "—")}</span>
      </div>
    </div>
    <div class="hr"></div>
    <div class="row"><span class="k">Total</span><span class="v big">${pen(o.totalPen)}</span></div>
    <details>
      <summary>Línea de tiempo (${(o.stages || []).length} etapas)</summary>
      ${stageTimeline(o)}
    </details>
  </div>`;
}

function pipeResults() {
  const d = state.pipeline;
  if (!d) return '<div class="spin">Cargando tubería…</div>';
  if (!d.orders.length) {
    return `<div class="card"><div class="title">Sin resultados</div>
      <p class="note" style="margin-top:6px">Ningún pedido coincide con esos filtros.</p></div>`;
  }
  const cards = d.orders.map(pipelineCard).join("");
  const more = d.hasMore
    ? `<button class="btn wide" id="pipeMoreBtn" onclick="loadMorePipeline()">Cargar más (${d.orders.length} de ${d.total})</button>`
    : `<p class="note" style="text-align:center">${d.total} pedido(s) en total.</p>`;
  const bad = d.unreadable
    ? `<div class="banner warn">${d.unreadable} registro(s) de esta página no se pudieron leer.</div>` : "";
  return `${bad}<div class="cols">${cards}</div>${more}`;
}

function renderPipeline() {
  return `<h2>Tubería</h2>
  <div class="card">
    <label class="field"><span>Buscar</span>
      <input id="pipeQ" type="search" placeholder="Pedido, cliente o email…" value="${esc(state.pipelineQ)}" oninput="pipeSearch(this.value)" autocomplete="off"></label>
    <label class="field"><span>Etapa</span>
      <select id="pipeStage" onchange="setPipelineFilter('stage', this.value)">${pipeStageOptionsHtml()}</select></label>
    <div class="field" style="margin-bottom:0"><span>Modo de entrega</span>
      <div class="seg" id="pipeExpress" role="group" aria-label="Filtro express">
        <button data-x="all" class="${state.pipelineExpress === "all" ? "on" : ""}" onclick="setPipelineFilter('express', 'all')">Todos</button>
        <button data-x="express" class="${state.pipelineExpress === "express" ? "on" : ""}" onclick="setPipelineFilter('express', 'express')">⚡ Ni bien llegue</button>
        <button data-x="consolidated" class="${state.pipelineExpress === "consolidated" ? "on" : ""}" onclick="setPipelineFilter('express', 'consolidated')">Todo junto</button>
      </div>
    </div>
  </div>
  <div id="pipeResults">${pipeResults()}</div>`;
}

/* The search box debounces and rewrites ONLY the results node: a full
   paint() on every keystroke would steal focus and make the field
   unusable on a phone. */
let pipeSearchT = null;
function pipeSearch(v) {
  clearTimeout(pipeSearchT);
  pipeSearchT = setTimeout(() => setPipelineFilter("q", v.trim()), 450);
}

async function setPipelineFilter(k, v) {
  if (k === "q") state.pipelineQ = v;
  if (k === "stage") state.pipelineStage = v;
  if (k === "express") {
    state.pipelineExpress = ["all", "express", "consolidated"].includes(v) ? v : "all";
    document.querySelectorAll("#pipeExpress button").forEach((b) =>
      b.classList.toggle("on", b.dataset.x === state.pipelineExpress));
  }
  await reloadPipeline();
}

async function reloadPipeline() {
  const box = document.getElementById("pipeResults");
  if (box) box.innerHTML = '<div class="spin">Cargando tubería…</div>';
  try {
    state.pipeline = await LOADER.pipeline();
    refreshPipeStageOptions();
    if (box) box.innerHTML = pipeResults();
  } catch (e) {
    if (e.code === 403) return renderGate();
    if (box) box.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`;
  }
}

async function loadMorePipeline() {
  const btn = document.getElementById("pipeMoreBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Cargando…"; }
  const next = await api2(PIPELINE_API, {
    view: "pipeline", q: state.pipelineQ, stage: state.pipelineStage,
    express: state.pipelineExpress, limit: 25, offset: state.pipeline.orders.length,
  });
  state.pipeline = { ...next, orders: [...state.pipeline.orders, ...next.orders] };
  document.getElementById("pipeResults").innerHTML = pipeResults();
}

/* ---- tab: más (overflow) ---------------------------------------------
   Five tabs is the ceiling on a phone tab bar, so everything that is not
   a daily-driver view lives here behind one extra tap: Lotes, Reclamos,
   Impuestos, Express and the Libro mayor (same renderer as ever — the old
   tab just moved house). */

function renderMoreMenu() {
  const item = (sub, ico, label, desc) => `
    <button class="mitem" onclick="goMore('${sub}')">
      <span class="ico">${ico}</span>
      <span>${label}<span class="sub2">${desc}</span></span>
      <span class="chev">›</span>
    </button>`;
  return `<h2>Más</h2>` +
    item("batches", "🧳", "Lotes", "Consolidados por courier, peso y mínimo de 1 kg") +
    item("claims", "⏰", "Reclamos", "Ventanas de reclamo por lote") +
    item("tax", "🧾", "Impuestos", "Estimado contra real SUNAT") +
    item("express", "⚡", "Express", "Pedidos «ni bien llegue» y su control") +
    item("ledger", "📄", "Libro", "Libro mayor y descarga CSV");
}

function renderMore() {
  switch (state.more) {
    case "batches": return renderBatches();
    case "claims": return renderClaims();
    case "tax": return renderTax();
    case "express": return renderExpress();
    case "ledger": return renderLedger();
    default: return renderMoreMenu();
  }
}

function moreHead(title) {
  return `<button class="btn" onclick="goMore('menu')" style="margin-bottom:11px">← Más</button><h2>${title}</h2>`;
}

async function goMore(sub) {
  state.more = sub;
  paint();
  window.scrollTo({ top: 0, behavior: "instant" });
  const need = { batches: "batches", claims: "claims", tax: "tax", express: "expressOrders", ledger: "ledger" }[sub];
  if (need && !state[need]) {
    try {
      state[need] = await LOADER[need]();
    } catch (e) {
      if (e.code === 403) return renderGate();
      document.getElementById("main").innerHTML =
        summaryStrip() + `<div class="banner bad">${esc(e.message)}</div>`;
      return;
    }
    paint();
  }
}

/* ---- más → lotes -------------------------------------------------------
   A batch is the unit the courier bills: N customer orders consolidated
   into one shipment. The 1 kg minimum applies to the batch, not to the
   order — that is the counter Danny added — so the card compares the
   batch weight against it, ✓ or ⚠. */
const BATCH_STATUS = {
  consolidating: ["Consolidando", ""], ready: ["Listo", "ok"],
  in_transit: ["En camino", ""], lince: ["En Lince", "warn"],
  delivered: ["Entregado", "ok"], closed: ["Cerrado", "flat"],
};
function batchStatusPill(s) {
  const [label, tone] = BATCH_STATUS[s] || [s || "—", "flat"];
  return `<span class="pill ${tone}">${esc(label)}</span>`;
}

function renderBatches() {
  const d = state.batches;
  const head = moreHead("Lotes");
  if (!d) return head + '<div class="spin">Cargando lotes…</div>';
  if (!(d.batches || []).length) {
    return head + `<div class="card"><div class="title">Sin lotes</div>
      <p class="note" style="margin-top:6px">Todavía no hay ningún lote consolidado.</p></div>`;
  }
  const cards = d.batches.map((b) => {
    const n = b.orderCount != null ? b.orderCount : (b.orderIds || []).length;
    const kg = b.totalWeightKg;
    const min = b.minKg != null ? b.minKg : 1;
    const wsrc = { estimated: "estimado", actual: "real" }[b.weightSource] || b.weightSource;
    const ids = (b.orderIds || []).map((id) =>
      `<li><span class="mono">${esc(id)}</span><span></span></li>`).join("");
    return `
    <div class="card">
      <div class="head">
        <div>
          <div class="title mono">${esc(b.shipmentId)}</div>
          <div class="sub">${esc(b.providerLabel || b.provider || "—")} · ${when(b.createdAt)}</div>
        </div>
        ${batchStatusPill(b.status)}
      </div>
      <div class="hr"></div>
      <div class="row"><span class="k">Pedidos</span><span class="v">${n}</span></div>
      <div class="row"><span class="k">Peso total</span>
        <span class="v">${kg != null && isFinite(Number(kg)) ? Number(kg).toFixed(2) + " kg" : '<span class="muted">—</span>'}
          <span class="pill ${b.meetsMinimum ? "ok" : "warn"}" style="margin-left:6px">${b.meetsMinimum ? "✓" : "⚠"} mín ${min} kg</span>
        </span></div>
      ${wsrc ? `<div class="row"><span class="k">Origen del peso</span><span class="v" style="font-weight:500">${esc(wsrc)}</span></div>` : ""}
      ${b.linceAvailableAt ? `<div class="row"><span class="k">Disponible en Lince</span><span class="v">${when(b.linceAvailableAt)}</span></div>` : ""}
      ${ids ? `<details><summary>Ver ${n} pedido(s)</summary><ul class="items">${ids}</ul></details>` : ""}
    </div>`;
  }).join("");
  return `${head}<div class="cols">${cards}</div>
    <p class="note" style="text-align:center">${d.total != null ? d.total : d.batches.length} lote(s) en total.</p>`;
}

/* ---- más → reclamos -----------------------------------------------------
   The claim window is the one ops deadline that cannot be recovered: a
   lot whose window expired without a claim filed is money left on the
   table. Green past 3 days, amber 0–3, red expired, gray when the backend
   has no deadline for the lot. */
function claimChip(c) {
  const days = c.daysRemaining;
  if (c.state === "expired") {
    const ago = days != null && isFinite(Number(days)) ? `hace ${Math.abs(Math.round(Number(days)))} d` : "";
    return `<span class="pill bad">Venció${ago ? " " + ago : ""}</span>`;
  }
  if (c.state === "warning") return `<span class="pill warn">Quedan ${days} d</span>`;
  if (c.state === "ok") return `<span class="pill ok">Quedan ${days} d</span>`;
  return `<span class="pill flat">Sin fecha</span>`;
}

function renderClaims() {
  const d = state.claims;
  const head = moreHead("Reclamos");
  if (!d) return head + '<div class="spin">Cargando reclamos…</div>';
  if (!(d.claims || []).length) {
    return head + `<div class="card"><div class="title">Sin reclamos pendientes</div>
      <p class="note" style="margin-top:6px">Ningún lote está dentro de una ventana de reclamo.</p></div>`;
  }
  const cards = d.claims.map((c) => {
    const n = c.orderCount != null ? c.orderCount : (c.orderIds || []).length;
    const ids = (c.orderIds || []).map((id) =>
      `<li><span class="mono">${esc(id)}</span><span></span></li>`).join("");
    return `
    <div class="card">
      <div class="head">
        <div>
          <div class="title mono">${esc(c.shipmentId)}</div>
          <div class="sub">${esc(c.providerLabel || "—")} · ${n} pedido(s)</div>
        </div>
        ${claimChip(c)}
      </div>
      <div class="hr"></div>
      <div class="row"><span class="k">Disponible en Lince</span><span class="v">${when(c.linceAvailableAt)}</span></div>
      <div class="row"><span class="k">Vence</span><span class="v">${when(c.deadlineAt)}</span></div>
      ${ids ? `<details><summary>Ver pedidos</summary><ul class="items">${ids}</ul></details>` : ""}
    </div>`;
  }).join("");
  return `${head}<div class="cols">${cards}</div>`;
}

/* ---- más → impuestos -----------------------------------------------------
   Same "blank is not zero" rule as the ledger: an unreconciled row shows
   «sin conciliar», never S/ 0.00, because a zero would read as settled.
   The totals header renders whichever totals the endpoint returns. */
const TAX_STATE = {
  reconciled: ["Conciliado", "ok"], unreconciled: ["Pendiente", "warn"],
  credit_due: ["Saldo por emitir", "warn"], absorbed: ["Absorbido", "flat"],
};
const TAX_TOTALS = [
  ["estimatedPen", "Estimado total"], ["actualPen", "Real SUNAT total"],
  ["differencePen", "Diferencia total"], ["creditDuePen", "Saldo a favor del cliente"],
  ["absorbedPen", "Absorbido por Aria"],
];

function taxTotalsCard(t) {
  if (!t) return "";
  const rows = TAX_TOTALS
    .filter(([k]) => t[k] != null)
    .map(([k, label]) => `<div class="row"><span class="k">${label}</span><span class="v">${pen(t[k])}</span></div>`)
    .join("");
  if (!rows) return "";
  return `<div class="card tight"><div class="title" style="margin-bottom:6px">Totales</div>${rows}</div>`;
}

function taxRowCard(r) {
  const [slabel, stone] = TAX_STATE[r.state] || [r.state || "—", "flat"];
  return `
  <div class="card tight">
    <div class="head">
      <div>
        <div class="title mono" style="font-size:12.5px">${esc(r.orderId)}</div>
        <div class="sub">${when(r.createdAt)} · ${esc(r.customerName || "—")}</div>
      </div>
      <span class="pill ${stone}">${esc(slabel)}</span>
    </div>
    <div class="hr"></div>
    <div class="row"><span class="k">Estimado</span><span class="v">${pen(r.taxEstimatedPen)}</span></div>
    <div class="row"><span class="k">Real SUNAT</span><span class="v">${
      r.taxReconciledAt ? pen(r.taxActualPen) : '<span class="muted">sin conciliar</span>'}</span></div>
    ${r.differencePen != null ? `<div class="row"><span class="k">Diferencia</span><span class="v">${pen(r.differencePen)}</span></div>` : ""}
    ${Number(r.creditDuePen) > 0 ? `<div class="row"><span class="k">Saldo a emitir</span><span class="v">${pen(r.creditDuePen)}</span></div>` : ""}
    ${Number(r.absorbedPen) > 0 ? `<div class="row"><span class="k">Absorbido por Aria</span><span class="v">${pen(r.absorbedPen)}</span></div>` : ""}
    ${r.sunatDocRef ? `<div class="row"><span class="k">Doc. SUNAT</span><span class="v mono">${esc(r.sunatDocRef)}</span></div>` : ""}
  </div>`;
}

function renderTax() {
  const d = state.tax;
  const head = moreHead("Impuestos");
  const seg = `<div class="seg" style="margin-bottom:11px" role="group" aria-label="Filtro de impuestos">
      <button class="${state.taxFilter === "unreconciled" ? "on" : ""}" onclick="setTaxFilter('unreconciled')">Pendientes</button>
      <button class="${state.taxFilter === "all" ? "on" : ""}" onclick="setTaxFilter('all')">Todos</button>
    </div>`;
  if (!d) return head + seg + '<div class="spin">Cargando impuestos…</div>';
  if (!(d.rows || []).length) {
    return head + seg + `<div class="card"><div class="title">Sin filas</div>
      <p class="note" style="margin-top:6px">${state.taxFilter === "unreconciled" ? "Todo conciliado. Nada pendiente." : "Todavía no hay filas de impuestos."}</p></div>`;
  }
  return head + seg + taxTotalsCard(d.totals) +
    `<div class="cols">${d.rows.map(taxRowCard).join("")}</div>
     <p class="note" style="text-align:center">${d.total != null ? d.total : d.rows.length} fila(s) en total.</p>`;
}

async function setTaxFilter(f) {
  state.taxFilter = f;
  state.tax = null;
  paint();
  try {
    state.tax = await LOADER.tax();
  } catch (e) {
    if (e.code === 403) return renderGate();
    document.getElementById("main").innerHTML =
      summaryStrip() + `<div class="banner bad">${esc(e.message)}</div>`;
    return;
  }
  paint();
}

/* ---- más → express ---------------------------------------------------------
   The "red sticker": Danny's $8 toggle between «todo junto» (free,
   consolidated, the default) and «⚡ ni bien llegue». Setting it is one
   POST; unsetting is the same POST with selected:false. The per-card
   «Quitar ⚡» button exists because on a phone, retyping the order id to
   undo is the kind of friction that makes ops skip the undo. */
async function setExpress(orderId, selected, feeUsd) {
  const res = await fetch(ORDERS_UPDATE_API, {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ orderId, express: { selected, feeUsd } }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.ok) throw new Error(data.error || "Error");
  return data.express || {};
}

async function saveExpress() {
  const msg = document.getElementById("exp-msg");
  const orderId = document.getElementById("exp-order").value.trim();
  const selected = document.getElementById("exp-toggle").checked;
  const fee = Number(document.getElementById("exp-fee").value);
  if (!orderId) { msg.textContent = "Escribe el id del pedido."; return; }
  msg.textContent = "Guardando…";
  try {
    const ex = await setExpress(orderId, selected, isFinite(fee) ? fee : 8);
    msg.innerHTML = ex.selected
      ? `✓ <strong>${esc(orderId)}</strong> ahora va <strong>⚡ ni bien llegue</strong>${ex.feeUsd != null ? ` (${usd(ex.feeUsd)})` : ""}.`
      : `✓ <strong>${esc(orderId)}</strong> volvió a <strong>todo junto</strong>.`;
    document.getElementById("exp-order").value = "";
    state.expressOrders = await LOADER.expressOrders();
    paint();
  } catch (e) {
    msg.textContent = e.message;
  }
}

async function unsetExpress(orderId) {
  try {
    await setExpress(orderId, false, 8);
    state.expressOrders = await LOADER.expressOrders();
    paint();
  } catch (e) {
    document.getElementById("main").innerHTML =
      summaryStrip() + `<div class="banner bad">${esc(e.message)}</div>`;
  }
}

function renderExpress() {
  const d = state.expressOrders;
  const head = moreHead("Express");
  const control = `
  <div class="card">
    <div class="title" style="margin-bottom:8px">Marcar pedido con ⚡</div>
    <label class="field"><span>Id del pedido</span>
      <input id="exp-order" class="mono" placeholder="p. ej. AR-1024" autocomplete="off" autocapitalize="characters"></label>
    <label class="check"><input type="checkbox" id="exp-toggle" checked>
      <span>⚡ Ni bien llegue <span class="muted">(desmárcalo para quitarlo)</span></span></label>
    <label class="field" style="margin:9px 0 0"><span>Cargo express (USD)</span>
      <input id="exp-fee" type="number" step="0.01" inputmode="decimal" value="8" style="max-width:150px"></label>
    <div class="btns" style="margin-top:11px">
      <button class="btn primary" onclick="saveExpress()">Guardar</button>
    </div>
    <p class="note" id="exp-msg" style="margin:8px 0 0"></p>
  </div>`;
  if (!d) return head + control + '<div class="spin">Cargando pedidos express…</div>';
  const cards = (d.orders || []).map((o) => `
    <div class="card tight">
      <div class="head">
        <div>
          <div class="title mono" style="font-size:12.5px">${esc(o.orderId)}</div>
          <div class="sub">${esc(o.customerName || o.customerEmail || "—")} · ${when(o.createdAt)}</div>
        </div>
        <span class="pill warn">⚡${o.expressFeeUsd != null ? " " + usd(o.expressFeeUsd) : ""}</span>
      </div>
      <div class="row"><span class="k">Total</span><span class="v">${pen(o.totalPen)}</span></div>
      <div class="row"><span class="k">Etapa</span><span class="v" style="font-weight:500">${esc(o.currentStageLabel || o.currentStage || "—")}</span></div>
      <div class="btns" style="margin-top:9px">
        <button class="btn" onclick="unsetExpress('${esc(o.orderId)}')">Quitar ⚡</button>
      </div>
    </div>`).join("");
  return head + control +
    `<h2>Con ⚡ activo · ${d.total != null ? d.total : (d.orders || []).length}</h2>` +
    (cards
      ? `<div class="cols">${cards}</div>`
      : `<div class="card"><div class="title">Ninguno</div><p class="note" style="margin-top:6px">Ningún pedido va «ni bien llegue» ahora mismo.</p></div>`);
}

/* ---- shell --------------------------------------------------------- */
const RENDER = { orders: renderOrders, payments: renderPayments, pipeline: renderPipeline, couriers: renderCouriers, more: renderMore };

function paint() {
  document.getElementById("main").innerHTML = summaryStrip() + RENDER[state.tab]();
  for (const b of document.querySelectorAll("nav.tabs button")) {
    b.setAttribute("aria-selected", String(b.dataset.tab === state.tab));
  }
}

const LOADER = {
  orders: () => api({ view: "orders", limit: 25 }),
  payments: () => api({ view: "payments", limit: 50 }),
  pipeline: () => api2(PIPELINE_API, { view: "pipeline", q: state.pipelineQ, stage: state.pipelineStage, express: state.pipelineExpress, limit: 25 }),
  couriers: () => api({ view: "couriers" }),
  batches: () => api2(BATCHES_API, { view: "batches" }),
  claims: () => api2(BATCHES_API, { view: "claims" }),
  tax: () => api2(TAX_API, { view: "tax", filter: state.taxFilter }),
  expressOrders: () => api2(PIPELINE_API, { view: "pipeline", express: "express", limit: 50 }),
  ledger: () => api({ view: "ledger" }),
};

async function go(tab) {
  state.tab = tab;
  paint();
  window.scrollTo({ top: 0, behavior: "instant" });
  if (!state[tab]) {
    try {
      state[tab] = await LOADER[tab]();
    } catch (e) {
      if (e.code === 403) return renderGate();
      document.getElementById("main").innerHTML =
        summaryStrip() + `<div class="banner bad">${esc(e.message)}</div>`;
      return;
    }
    paint();
  }
}

async function refresh() {
  const btn = document.getElementById("refreshBtn");
  btn.setAttribute("aria-busy", "true");
  // Everything already loaded is reloaded; tabs never opened stay lazy.
  const loaded = Object.keys(LOADER).filter((k) => state[k]);
  try {
    state.summary = await api({ view: "summary" });
    document.getElementById("who").innerHTML =
      `${esc(state.summary.me || "")}<br><span class="muted">${esc(state.summary.today || "")}</span>`;
    document.getElementById("tabs").hidden = false;
    for (const k of loaded) state[k] = await LOADER[k]();
    if (!state[state.tab]) state[state.tab] = await LOADER[state.tab]();
    paint();
  } catch (e) {
    if (e.code === 403) renderGate();
    else document.getElementById("main").innerHTML = `<div class="banner bad">${esc(e.message)}</div>`;
  } finally {
    btn.removeAttribute("aria-busy");
  }
}

refresh();
</script>
</body>
</html>
