<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1F44">
<title>Aria Ops Compradores</title>
<link rel="icon" href="/aria-icon-512.png">
<link rel="stylesheet" href="/assets/agent/agent.css">
<!-- ============================================================
     COMPRADORES, THE ADMIN SIDE (#443, Phase 1). DANNY ONLY.
     Agents never see this page: the server endpoint behind it
     (admin-agents.js) is ADMIN_EMAILS-gated like every admin-* function,
     and this page's gate is a courtesy, never the boundary.

     Morning board (auto-split by store and store account, drag or "Mover
     a"), live per-agent progress and breaks, exception queue with
     REASIGNAR / Retener, per-account daily caps, store-flag inbox,
     invite-only logins, reconciliation. Phase 1 runs on the SAMPLE day
     shared with agente.html through this browser's storage.
     ============================================================ -->
<style>
  main { max-width: 1240px; margin: 0 auto; padding: 16px; }
  .tabsbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
  .tabsbar button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 16px; min-height: 44px; font-weight: 800; white-space: nowrap; color: var(--ink-2); }
  .tabsbar button[aria-selected="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .tabsbar .n { background: var(--bad); color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 12px; margin-left: 6px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 18px; margin: 18px 0 10px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .agent { padding: 16px; }
  .agent .head { display: flex; align-items: center; gap: 10px; }
  .initial { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 999px; background: var(--navy); color: var(--gold); display: grid; place-items: center; font-weight: 900; }
  .big { font-size: 40px; font-weight: 900; letter-spacing: -.03em; line-height: 1; margin: 14px 0 6px; }
  .bar { height: 10px; background: var(--sky); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--gold)); }
  .cols { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: start; }
  .col { padding: 12px; min-height: 120px; }
  .col.over { outline: 3px dashed var(--blue); }
  .col h3 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font-size: 17px; }
  .ord { display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 12px; margin: 6px 0; background: var(--bg); cursor: grab; }
  .ord img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--sky); flex: 0 0 auto; }
  .ord .t { font-weight: 700; font-size: 14px; line-height: 1.25; }
  .ord select { margin-left: auto; min-height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 13px; max-width: 110px; }
  .ord.done { opacity: .6; cursor: default; }
  .sgroup { font-size: 12px; font-weight: 900; letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; margin: 12px 0 2px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); background: var(--bg); }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  .ex { padding: 14px; display: grid; gap: 8px; }
  .ex .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ex select { min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); padding: 0 10px; }
  .fallback { font: 600 13px ui-monospace, Menlo, monospace; background: var(--bg); padding: 6px 8px; border-radius: 8px; overflow-wrap: anywhere; }
  .gate { max-width: 460px; margin: 40px auto; padding: 24px; text-align: center; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 14px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">ARIA <b>·</b> <small>Compradores · Admin</small></div>
  <div class="right"><span id="demoTag" class="demo-tag" hidden>DEMO</span><span id="who"></span></div>
</header>
<main id="app"></main>
<div id="toast" class="toast" role="status"></div>

<script type="module">
import * as C from "/assets/agent/agent-core.js";
import { loadDemoDay, resetDemoDay, saveDay, onDayChange } from "/assets/agent/agent-store.js";

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nowIso = () => new Date().toISOString();
const hhmm = (iso) => iso ? new Date(iso).toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }) : "";
const A = { day: null, tab: "tablero", live: null, logins: null };
const toast = (t) => { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2400); };
const save = () => saveDay(A.day);
const agentName = (id) => (A.day.agents.find((a) => a.id === id) || {}).name || "—";

async function boot() {
  let res = null;
  try { const r = await fetch("/.netlify/functions/admin-agents", { credentials: "same-origin" }); res = { status: r.status, body: await r.json().catch(() => ({})) }; } catch { res = null; }
  const demo = new URLSearchParams(location.search).has("demo");
  if (res && res.status === 200) { A.live = true; A.logins = res.body.logins; $("#who").textContent = "Danny"; }
  else if (!demo) {
    $("#app").innerHTML = `<div class="card gate"><h1>Solo para Danny</h1><p class="muted">Esta página es del administrador. ${res && res.status === 401 ? "Inicia sesión con tu cuenta de admin en la tienda y vuelve." : "Tu cuenta no tiene acceso."}</p>
      <a class="btn big navy" href="?demo=1">Ver con pedidos de muestra</a></div>`;
    return;
  }
  $("#demoTag").hidden = false;
  A.day = loadDemoDay();
  onDayChange((d) => { A.day = d; render(); });
  autoRebalance();
  render();
  setInterval(render, 30000);
}

/* Midday auto-rebalance, once a day, from 13:00 Lima. */
function autoRebalance() {
  const h = Number(new Date().toLocaleString("en-US", { timeZone: "America/Lima", hour: "numeric", hour12: false }));
  if (h >= 13 && !A.day.rebalancedAt) {
    const moves = C.rebalance(A.day);
    A.day.rebalancedAt = nowIso(); save();
    if (moves.length) toast(`Rebalanceo de mediodía: ${moves.length} pedido(s) movidos`);
  }
}

function render() {
  const openEx = A.day.exceptions.filter((e) => e.status === "abierta").length;
  const newFlags = A.day.storeFlags.filter((f) => f.status === "nueva").length;
  const tabs = [["tablero", "Tablero"], ["asignacion", "Asignación"], ["excepciones", "Excepciones", openEx], ["cuentas", "Cuentas y topes"], ["tiendas", "Tiendas", newFlags], ["equipo", "Chat"], ["accesos", "Accesos"], ["conciliacion", "Conciliación"]];
  const body = { tablero, asignacion, excepciones, cuentas, tiendas, equipo, accesos, conciliacion }[A.tab]();
  $("#app").innerHTML = `<nav class="tabsbar" role="tablist">${tabs.map(([k, l, n]) => `<button role="tab" data-tab="${k}" aria-selected="${A.tab === k}">${l}${n ? `<span class="n">${n}</span>` : ""}</button>`).join("")}</nav>${body}`;
  wire();
}

function tablero() {
  const rows = C.boardRows(A.day, nowIso());
  const tot = rows.reduce((s, r) => s + r.done, 0), all = rows.reduce((s, r) => s + r.total, 0);
  const held = A.day.orders.filter((o) => o.status === "retenida").length;
  const open = A.day.exceptions.filter((e) => e.status === "abierta").length;
  return `<h1>Tablero en vivo</h1><p class="muted" style="margin:0 0 12px">${tot} de ${all} compradas hoy · ${open} excepciones abiertas · ${held} retenidos</p>
    <div class="grid">${rows.map((r) => `<div class="card agent">
      <div class="head"><span class="initial">${esc(r.name[0])}</span><div><strong style="font-size:18px">${esc(r.name)}</strong><div class="tiny">${r.clockIn ? "Entrada " + hhmm(r.clockIn) + " · " + Math.floor(r.workedMin / 60) + " h " + String(r.workedMin % 60).padStart(2, "0") : "Aún no marca entrada"}</div></div>
        <span class="pill ${r.onBreak ? "warn" : r.clockIn ? "ok" : ""}" style="margin-left:auto">${r.onBreak ? "En " + esc(r.onBreak) + " desde " + hhmm(r.breakSince) : r.clockIn ? "Comprando" : "Fuera"}</span></div>
      <div class="big">${r.done}<span class="muted" style="font-size:20px"> / ${r.total}</span></div>
      <div class="bar"><i style="width:${r.pct}%"></i></div>
      <div class="tiny" style="margin-top:8px">${r.left} por comprar · ${r.sentToLead} enviados a excepciones</div></div>`).join("")}</div>`;
}

function asignacion() {
  const cols = A.day.agents.map((a) => {
    const mine = A.day.orders.filter((o) => o.assignedTo === a.id && (o.status === "por_comprar" || o.status === "comprada"));
    let last = "";
    const items = mine.map((o) => {
      const acc = (A.day.accounts.find((x) => x.id === o.accountId) || {}).label || "";
      const head = acc !== last ? `<div class="sgroup">${esc(acc)}</div>` : ""; last = acc;
      const done = o.status === "comprada";
      return head + `<div class="ord${done ? " done" : ""}" ${done ? "" : `draggable="true" data-drag="${esc(o.orderId)}"`}>
        <img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer"><div><div class="t">${esc(o.title)}</div><div class="tiny">${esc(o.orderId)} · ${done ? "comprada" : "talla " + esc(o.selectedSize || "-")}</div></div>
        ${done ? "" : `<select data-move="${esc(o.orderId)}" aria-label="Mover a"><option value="">Mover a</option>${A.day.agents.filter((x) => x.id !== a.id).map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>`}</div>`;
    }).join("");
    return `<div class="card col" data-drop="${a.id}"><h3><span class="initial" style="width:32px;height:32px">${esc(a.name[0])}</span>${esc(a.name)} <span class="pill">${mine.length}</span></h3>${items || '<p class="tiny">Sin pedidos</p>'}</div>`;
  }).join("");
  const held = A.day.orders.filter((o) => o.status === "retenida");
  return `<h1>Asignación de la mañana</h1><p class="muted" style="margin:0">Pedidos de ayer, repartidos por igual, agrupados por tienda y por cuenta de tienda. Arrastra un pedido a otra columna o usa «Mover a».</p>
    <div class="toolbar"><button class="btn small navy" id="autoSplit">Repartir automático</button><button class="btn small ghost" id="rebalance">Rebalancear ahora (mediodía)</button><button class="btn small ghost" id="resetDemo">Reiniciar demo</button></div>
    <div class="cols">${cols}</div>
    <h2>Retenidos (${held.length})</h2>
    ${held.length ? `<div class="tablewrap"><table><tr><th>Pedido</th><th>Tienda</th><th>Motivo</th></tr>${held.map((o) => `<tr><td>${esc(o.orderId)}<div class="tiny">${esc(o.title)}</div></td><td>${esc(o.storeLabel)}</td><td><span class="pill warn">${esc(o.heldReason || "")}</span></td></tr>`).join("")}</table></div>` : '<p class="tiny">Ninguno.</p>'}`;
}

function excepciones() {
  const list = [...A.day.exceptions].reverse();
  return `<h1>Excepciones</h1><p class="muted" style="margin:0 0 12px">Lo que los compradores reportan (y los links caídos). Reasigna o retén; ellos siguen con lo suyo.</p>
    ${list.length ? `<div class="grid">${list.map((e) => {
      const o = A.day.orders.find((x) => x.orderId === e.orderId) || {};
      return `<div class="card ex">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill bad">${esc(e.reasonLabel)}</span><span class="pill ${e.status === "abierta" ? "warn" : e.status === "reasignada" ? "ok" : ""}">${esc(e.status)}</span><span class="tiny" style="margin-left:auto">${esc(e.id)} · ${hhmm(e.at)}</span></div>
        <div style="display:flex;gap:10px;align-items:center"><img src="${esc(o.image)}" alt="" style="width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--sky)" referrerpolicy="no-referrer"><div><strong>${esc(o.title)}</strong><div class="tiny">${esc(e.orderId)} · ${esc(e.storeLabel)} · ${e.fromAgent ? "de " + esc(agentName(e.fromAgent)) : "guardia de links"}</div></div></div>
        ${e.note ? `<div class="tiny">${esc(e.note)}</div>` : ""}
        <div><div class="tiny">Búsqueda de respaldo (solo admin):</div><div class="fallback">${esc(o.fallbackSearch || o.title || "")}</div></div>
        ${e.status === "abierta" || e.status === "retenida" ? `<div class="acts"><select data-to="${e.id}" aria-label="Reasignar a">${A.day.agents.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select>
          <button class="btn small primary" data-reassign="${e.id}">REASIGNAR</button>${e.status === "abierta" ? `<button class="btn small ghost" data-hold="${e.id}">Retener</button>` : ""}</div>` : `<div class="tiny">${e.toAgent ? "Reasignado a " + esc(agentName(e.toAgent)) : "Retenido"} · ${hhmm(e.resolvedAt)}</div>`}
      </div>`; }).join("")}</div>` : '<p class="tiny">Sin excepciones.</p>'}`;
}

function cuentas() {
  const rows = C.accountRows(A.day);
  return `<h1>Cuentas de tienda y topes diarios</h1><p class="muted" style="margin:0 0 12px">El sistema no asigna ni deja registrar una compra en una cuenta que llegó a su tope del día.</p>
    <div class="tablewrap"><table><tr><th>Cuenta</th><th>Tienda</th><th>Compradas hoy</th><th>Asignadas</th><th>Tope diario</th><th>Estado</th></tr>
    ${rows.map((a) => `<tr><td><strong>${esc(a.label)}</strong></td><td>${esc(a.store)}</td><td>${a.used}</td><td>${a.planned}</td>
      <td><input type="number" min="0" max="99" value="${a.dailyCap}" data-cap="${a.id}" style="width:72px;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 8px"></td>
      <td>${a.full ? '<span class="pill bad">Tope alcanzado</span>' : '<span class="pill ok">Con cupo</span>'}</td></tr>`).join("")}</table></div>`;
}

function tiendas() {
  const flags = [...A.day.storeFlags].reverse(), notes = [...A.day.storeNotes].reverse();
  return `<h1>Tiendas reportadas</h1>
    ${flags.length ? `<div class="grid">${flags.map((f) => `<div class="card ex"><div style="display:flex;gap:8px;align-items:center"><span class="pill bad">${esc(f.store)}</span><span class="pill ${f.status === "nueva" ? "warn" : "ok"}">${esc(f.status)}</span><span class="tiny" style="margin-left:auto">${hhmm(f.at)}</span></div><div>${esc(f.text || "(sin detalle)")}</div><div class="tiny">de ${esc(agentName(f.by))}</div>${f.status === "nueva" ? `<button class="btn small ghost" data-seen="${f.id}">Marcar vista</button>` : ""}</div>`).join("")}</div>` : '<p class="tiny">Ninguna tienda reportada hoy.</p>'}
    <h2>Notas de tiendas (cómo se portó cada tienda hoy)</h2>
    ${notes.length ? notes.map((n) => `<div class="card" style="padding:12px;margin:8px 0"><strong>${esc(n.store)}</strong> <span class="tiny">${esc(agentName(n.by))} · ${hhmm(n.at)}</span><div>${esc(n.text)}</div></div>`).join("") : '<p class="tiny">Sin notas.</p>'}`;
}

function equipo() {
  return `<h1>Chat del equipo</h1><div class="card" style="padding:12px">${A.day.chat.map((m) => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(m.by === "admin" ? "Danny" : agentName(m.by))}</b> <span class="tiny">${hhmm(m.at)}</span><div>${esc(m.text)}</div></div>`).join("") || '<p class="tiny">Sin mensajes.</p>'}
    <form id="chatForm" style="display:flex;gap:8px;margin-top:10px"><input name="t" maxlength="500" placeholder="Escribe al equipo" style="flex:1;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 12px"><button class="btn small navy">Enviar</button></form></div>`;
}

function accesos() {
  const live = Array.isArray(A.logins);
  const rows = live ? A.logins : A.day.agents.map((a) => ({ email: null, name: a.name, active: a.active !== false, demo: true, id: a.id }));
  return `<h1>Accesos de compradores</h1><p class="muted" style="margin:0 0 12px">Solo por invitación: la cuenta ya existe en la tienda y aquí se le da el rol de comprador. Cada comprador ve solo su lista y su historial. Desactivar corta el acceso en su siguiente pedido al servidor.</p>
    ${live ? `<form id="invite" class="card" style="padding:12px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><input name="email" type="email" required placeholder="correo de la cuenta" style="flex:1;min-width:220px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 12px"><button class="btn small primary">Invitar como comprador</button></form>` : '<p class="tiny">Demo: compradores de muestra. Con tu sesión de admin aquí aparecen las cuentas reales invitadas.</p>'}
    <div class="tablewrap"><table><tr><th>Comprador</th><th>Estado</th><th></th></tr>
    ${rows.map((r) => `<tr><td><strong>${esc(r.name || r.email)}</strong>${r.email ? `<div class="tiny">${esc(r.email)}</div>` : ""}</td><td>${r.active ? '<span class="pill ok">Activo</span>' : '<span class="pill bad">Desactivado</span>'}</td>
      <td><button class="btn small ${r.active ? "bad" : "ok"}" data-active="${esc(r.email || r.id)}" data-val="${r.active ? "0" : "1"}">${r.active ? "Desactivar ya" : "Reactivar"}</button></td></tr>`).join("")}</table></div>`;
}

function conciliacion() {
  const rows = C.reconciliation(A.day);
  return `<h1>Conciliación</h1><p class="muted" style="margin:0 0 12px">Cobro de la tarjeta de un pedido, pedido de la tienda y pedido del cliente, en una fila.</p>
    ${rows.length ? `<div class="tablewrap"><table><tr><th>Pedido cliente</th><th>Tarjeta (tope / cobrado)</th><th>Pedido tienda</th><th>Total reportado</th><th>Precio de la línea</th><th>Estado</th></tr>
    ${rows.map((r) => `<tr><td><strong>${esc(r.orderId)}</strong><div class="tiny">${esc(r.customerName)} · ${esc(agentName(r.agentId))} · ${hhmm(r.boughtAt)}</div></td>
      <td>${r.cardLockedUsd != null ? C.usd(r.cardLockedUsd) : "—"} / ${r.cardCapturedUsd != null ? C.usd(r.cardCapturedUsd) : "—"}</td>
      <td>${esc(r.store)}<div class="tiny">${esc(r.retailerOrderNumber)}</div></td><td>${C.usd(r.chargedTotalUsd)}</td><td>${C.usd(r.lineUsd)}</td>
      <td>${r.ok ? '<span class="pill ok">Cuadra</span>' : r.issues.map((i) => `<span class="pill bad">${esc(i)}</span>`).join(" ")}</td></tr>`).join("")}</table></div>` : '<p class="tiny">Todavía no hay compras hoy.</p>'}`;
}

function wire() {
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { A.tab = b.dataset.tab; render(); });
  document.querySelectorAll("[data-move]").forEach((s) => s.onchange = () => { if (!s.value) return; const r = C.moveOrder(A.day, s.dataset.move, s.value); if (r.ok) { save(); toast("Pedido movido"); render(); } else toast(r.errors[0]); });
  document.querySelectorAll("[data-drag]").forEach((d) => d.ondragstart = (e) => e.dataTransfer.setData("text/plain", d.dataset.drag));
  document.querySelectorAll("[data-drop]").forEach((c) => {
    c.ondragover = (e) => { e.preventDefault(); c.classList.add("over"); };
    c.ondragleave = () => c.classList.remove("over");
    c.ondrop = (e) => { e.preventDefault(); c.classList.remove("over"); const r = C.moveOrder(A.day, e.dataTransfer.getData("text/plain"), c.dataset.drop); if (r.ok) { save(); render(); } };
  });
  const as = $("#autoSplit"); if (as) as.onclick = () => {
    if (A.day.orders.some((o) => o.status !== "por_comprar" && o.status !== "retenida" && o.status !== "excepcion")) { toast("Ya hay compras hoy: usa Rebalancear"); return; }
    const fresh = resetDemoDay(); A.day = fresh; toast("Repartido por igual, por tienda y cuenta"); render();
  };
  const rb = $("#rebalance"); if (rb) rb.onclick = () => { const m = C.rebalance(A.day); save(); toast(m.length ? `${m.length} pedido(s) movidos` : "Nada que mover (o menos de dos compradores con entrada)"); render(); };
  const rd = $("#resetDemo"); if (rd) rd.onclick = () => { A.day = resetDemoDay(); toast("Demo reiniciada"); render(); };
  document.querySelectorAll("[data-reassign]").forEach((b) => b.onclick = () => { const to = $(`[data-to="${b.dataset.reassign}"]`).value; const r = C.reassignException(A.day, b.dataset.reassign, to, nowIso()); if (r.ok) { save(); toast("Reasignado a " + agentName(to)); render(); } else toast(r.errors[0]); });
  document.querySelectorAll("[data-hold]").forEach((b) => b.onclick = () => { const r = C.holdException(A.day, b.dataset.hold, nowIso()); if (r.ok) { save(); render(); } });
  document.querySelectorAll("[data-cap]").forEach((i) => i.onchange = () => { const a = A.day.accounts.find((x) => x.id === i.dataset.cap); a.dailyCap = Math.max(0, Number(i.value) || 0); save(); render(); });
  document.querySelectorAll("[data-seen]").forEach((b) => b.onclick = () => { const f = A.day.storeFlags.find((x) => x.id === b.dataset.seen); f.status = "vista"; save(); render(); });
  const ch = $("#chatForm"); if (ch) ch.onsubmit = (e) => { e.preventDefault(); if (C.postChat(A.day, "admin", e.target.t.value, nowIso())) { save(); render(); } };
  const inv = $("#invite"); if (inv) inv.onsubmit = async (e) => { e.preventDefault(); await post({ email: inv.email.value, agent: true }); };
  document.querySelectorAll("[data-active]").forEach((b) => b.onclick = async () => {
    const val = b.dataset.val === "1";
    if (Array.isArray(A.logins)) await post({ email: b.dataset.active, active: val });
    else { const a = A.day.agents.find((x) => x.id === b.dataset.active); a.active = val; save(); toast(val ? "Reactivado" : "Desactivado"); render(); }
  });
}
async function post(payload) {
  const r = await fetch("/.netlify/functions/admin-agents", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || "No se pudo"); return; }
  const g = await fetch("/.netlify/functions/admin-agents", { credentials: "same-origin" }).then((x) => x.json()).catch(() => null);
  if (g && g.logins) A.logins = g.logins;
  toast("Listo"); render();
}
boot();
</script>
</body>
