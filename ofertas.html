<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ofertas — Aria Shop</title>
<meta name="description" content="Las mayores ofertas de tiendas de Estados Unidos, con entrega en Perú. Precio honesto, sin letra pequeña.">
<!-- The first paint's one file, asked for before the parser reaches the script. -->
<link rel="preload" href="/assets/ofertas/rails.json" as="fetch" crossorigin="anonymous">
<style>
/* Standalone Ofertas page. Zero dependencies: no frameworks, no CDN.
   If this stylesheet failed to load, the page would still render as
   plain readable HTML — never blank.
   CAROUSELS, LIKE THE HOMEPAGE (#443, Danny): the flat grid is gone.
   The page is the homepage's Ofertas section, page-long: the azure
   band, the gold OFERTAS mark, and horizontal rails of the homepage's
   navy deal cards (railCardHTML, dark: 172px wide, white photo square,
   gold discount badge, soles first). */
:root{
  --navy:#0A1F44; --blue:#2F5FEE; --blue-dark:#1E46C4; --sky:#EAF0FF;
  --paper:#FAFAF8; --green:#1C8A4B; --green-bg:#EAF7EF; --line:#E4E6EC;
  --amber:#B8860B; --gold:#F4C463; --red:#D92D20;
  --azure:#2159E8; --azure-deep:#1A4BD2; --tile:#1a2744; --dim:#AFBBD6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--azure-deep);color:var(--navy);-webkit-font-smoothing:antialiased}
/* ---- header ---- */
.site-header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1240px;margin:0 auto;padding:0 12px;height:64px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{text-decoration:none;display:flex;align-items:center;gap:8px}
.wordmark .w1{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-size:20px}
.wordmark .w2{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-size:20px}
.main-nav{display:none;align-items:center;gap:20px;font-size:13.5px}
.main-nav a{color:var(--navy);text-decoration:none;opacity:.75;white-space:nowrap}
.main-nav a:hover{opacity:1}
.main-nav a.active{opacity:1;color:var(--blue);font-weight:800}
@media(min-width:1024px){.main-nav{display:flex}}
.header-meta{font-size:13px;color:#6b7280;white-space:nowrap}
/* ---- page: the homepage's azure band ---- */
.page{background:linear-gradient(160deg,var(--azure) 0%,var(--azure-deep) 55%,var(--azure) 100%);
  color:#fff;padding:0 0 40px;min-height:70vh}
.intro{max-width:1240px;margin:0 auto;padding:18px 20px 6px}
@media(min-width:1024px){.intro{padding:26px 32px 8px}}
h1.page-title{margin:0 0 6px;font-size:clamp(26px,5vw,34px);font-weight:800;letter-spacing:-.02em;
  line-height:1;color:var(--gold);text-transform:uppercase}
.page-sub{margin:0 0 12px;color:#DCE4F7;font-size:14px;max-width:640px;line-height:1.45}
/* The freshness line is green on white: never gold. */
.fresh{display:inline-block;font-size:12px;font-weight:700;color:var(--green);
  background:var(--green-bg);padding:4px 11px;border-radius:999px}
.fresh[hidden]{display:none}
.fresh-row{min-height:26px;margin-bottom:12px}
/* ---- search ---- */
.toolbar{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.toolbar input[type="search"]{flex:1 1 auto;min-width:0;padding:11px 14px;font-size:15px;
  border:1px solid rgba(255,255,255,.35);border-radius:12px;background:#fff;color:var(--navy)}
.count-line{font-size:13px;color:var(--dim);margin:0;min-height:1.4em}
/* ---- rails ---- */
.rail-sec{position:relative;max-width:1240px;margin:0 auto;padding-top:14px}
.hair{position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(244,196,99,.55),transparent)}
.rail-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 20px 10px}
@media(min-width:1024px){.rail-head{padding:0 32px 12px}}
.rail-title{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;color:#fff;
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-meta{font-size:12px;font-weight:600;color:var(--dim);white-space:nowrap;flex-shrink:0}
.rail{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  padding:0 20px 20px;scroll-padding-left:20px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
@media(hover:none){.rail{scroll-snap-type:x proximity}}
@media(min-width:1024px){.rail{gap:16px;padding:0 32px 26px;scroll-padding-left:32px}}
/* ---- the homepage's deal card ---- */
.card{flex:0 0 172px;width:172px;scroll-snap-align:start;background:var(--tile);border-radius:16px;
  overflow:hidden;text-decoration:none;color:#fff;display:flex;flex-direction:column;position:relative;min-width:0}
/* THE CARD HOLDS ITS SHAPE BEFORE ANYTHING ARRIVES (#409): the photo
   box is a square from the first paint -- aspect-ratio, plus the
   padding-top square for Safari releases older than 15 -- and the
   text rows reserve their lines, empty or not. */
.card-img{position:relative;width:100%;aspect-ratio:1/1;background:#fff;overflow:hidden}
@supports not (aspect-ratio:1/1){.card-img{height:0;padding-top:100%}}
.card-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;padding:10px;display:block}
/* Gold is for the sale badge and the OFERTAS mark, as on the homepage. */
.badge{position:absolute;top:8px;left:8px;background:var(--gold);color:var(--navy);
  font-size:13px;font-weight:800;padding:4px 8px;border-radius:999px;z-index:2}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.store-tag{align-self:flex-start;max-width:100%;background:#fff;color:var(--navy);font-size:11px;font-weight:800;
  padding:3px 10px;border-radius:999px;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:20px}
.card-brand{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#fff;
  min-height:13px;line-height:1.3;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{font-size:12.5px;font-weight:700;line-height:1.35;margin:0 0 6px;min-height:34px;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* SOLES FIRST (#416): the price a shopper in Peru pays is the bold
   one, the was-price struck through beside it; dollars are the small
   reference under them. */
.card-prices{margin-top:auto;min-height:40px}
.price-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price{font-size:15px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.price-old{font-size:11.5px;color:var(--dim);text-decoration:line-through;font-variant-numeric:tabular-nums}
.price-usd{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;min-height:15px;margin-top:2px}
/* The rail's last tile: more of the same rail, drawn in place. */
.more-tile{flex:0 0 128px;width:128px;scroll-snap-align:start;border-radius:16px;cursor:pointer;
  background:rgba(255,255,255,.08);border:1px solid rgba(244,196,99,.45);color:#fff;font:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px}
.more-tile b{font-size:13px;font-weight:800}
.more-tile span{font-size:11.5px;color:var(--dim);margin-top:4px}
.more-tile[disabled]{opacity:.7;cursor:default}
/* Placeholder cards: the same boxes, soft bars where the words go. */
.card.sk .card-img{background:linear-gradient(100deg,#e9edf6 40%,#f6f8fc 50%,#e9edf6 60%);
  background-size:200% 100%;animation:sh 1.4s infinite}
.card.sk i{display:block;height:10px;border-radius:5px;background:rgba(255,255,255,.14);margin:3px 0}
.card.sk .card-title i:last-child{width:60%}
.card.sk .card-brand i{width:40%}
.card.sk .price i{height:15px;width:55%;margin-top:6px}
.rail-sec.sk-sec .rail-title i{display:inline-block;width:140px;height:14px;border-radius:7px;background:rgba(255,255,255,.18)}
.more-wrap{text-align:center;margin:8px 0 8px;padding:0 20px}
.more-wrap .btn[disabled]{opacity:.6;cursor:default}
.more-note{display:block;font-size:12.5px;color:var(--dim);margin-top:8px}
/* ---- states ---- */
.state{max-width:640px;margin:16px auto;border:1px dashed rgba(255,255,255,.4);border-radius:16px;
  background:rgba(255,255,255,.06);padding:40px 24px;text-align:center;color:#DCE4F7;font-size:15px}
.state h2{color:#fff;font-size:20px;margin:0 0 8px}
.state p{margin:0 0 18px}
.wrap-pad{padding:0 20px}
.btn{display:inline-block;background:#fff;color:var(--navy);border:0;cursor:pointer;
  font-size:15px;font-weight:800;padding:12px 26px;border-radius:12px}
.btn:hover{background:var(--sky)}
[hidden]{display:none!important}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.card.sk .card-img{animation:none}}
/* ---- footer ---- */
.site-footer{border-top:1px solid var(--line);background:#fff}
.footer-inner{max-width:1240px;margin:0 auto;padding:28px 12px;font-size:13px;color:#6b7280;
  display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.site-footer a{color:var(--blue);text-decoration:none}
</style>

/* ---------- config ---------- */
/* THIN OFERTAS (2026-10-19, #409, the Mountain Test), NOW CAROUSELS
   (#443, Danny: the flat grid is not acceptable -- the same carousel
   experience as the homepage Ofertas section). What the phone asks for:
     - rails.json (~5KB gzipped, scripts/build-ofertas-slices.mjs): the
       lead rail's 20 cards in the homepage rail's own order, the store
       rails in sales-led order, the few cards of the smallest stores;
     - one store's first 48 deals (assets/ofertas/slices/<store>.
       discount.json, ~5KB) only when that store's rail nears the screen;
     - the next 48 of a rail, or of a search, from
       /.netlify/functions/ofertas (netlify/functions/_ofertas-core.js);
     - a photo only when its card is about to be seen (watchPhotos).
   Every URL is same-origin: the page works on a deploy preview too. */
var BASE = '';
var SRC = {
  rails: BASE + '/assets/ofertas/rails.json',
  slice: BASE + '/assets/ofertas/slices/',
  fn:    BASE + '/.netlify/functions/ofertas',
  fx:    BASE + '/.netlify/functions/exchange-rate'
};
var TIMEOUT_MS = 20000;      // per-request timeout: never hang forever
var PAGE_SIZE = 48;          // cards per request, never more
var RAIL_STEP = 20;          // cards a rail draws at a time (the homepage rail's 20)

/* ---------- tiny helpers ---------- */
/* Sized retailer derivatives (2026-10-16) -- the same rules the app
   bundle's sizedImageUrl applies: card slots are small, retailer
   originals are 1600-2000px, and decoding them by the hundred is
   what kills phone tabs. A derivative that fails swaps back to the
   original URL (data-img-orig) before the page's own error handling
   runs, so a card never breaks because of the resize. Hosts with no
   verified resize parameter return the URL unchanged. */
var CARD_IMG_WIDTHS = [360, 560, 800];
var CARD_IMG_SIZES = "(max-width: 640px) 44vw, 200px";
/* The width a URL already declares, when it declares one. Feeds are
   inconsistent about this: the same retailer's catalog can carry the
   bare original for one product and a small pre-sized variant for
   the next. */
function declaredImageWidth(u){
  const m = u.match(/[?&](?:wid|width|imwidth|odnWidth|w)=(\d+)/i)
    || u.match(/\/upload\/[^/]*\bw_(\d+)/)
    || u.match(/_(1000|750|500|250)\.jpg(?:\?|$)/i);
  return m ? parseInt(m[1], 10) : 0;
}

function sizedImageUrl(url, w){
  var u = typeof url === "string" ? url : "";
  if (!u || !/^https?:\/\//i.test(u) || !w) return u;
  /* NEVER UPSCALE. When the URL already declares a width at or
     below the step asked for (Kohl's feeds store wid=180/342, some
     Walmart URLs declare 180), that variant is the
     card image the shopper sees today; asking the CDN for more
     pixels would ADD decoded weight -- the opposite of this job. */
  const declared = declaredImageWidth(u);
  if (declared && w >= declared) return u;
  function setQ(base, key, val){
    var re = new RegExp("([?&]" + key + "=)(\\d+)", "i");
    if (re.test(base)) return base.replace(re, function(m, p){ return p + val; });
    return base + (base.indexOf("?") >= 0 ? "&" : "?") + key + "=" + val;
  }
  var out = null;
  if (/cdn\.shopify\.com/i.test(u)){
    out = setQ(u, "width", w);
  } else if (/res\.cloudinary\.com/i.test(u)){
    if (/\/upload\/[^/]*\bw_\d+/.test(u)) out = u.replace(/(\/upload\/[^/]*)\bw_\d+/, "$1w_" + w);
  } else if (/i5\.walmartimages\.com/i.test(u)){
    out = setQ(u, "odnWidth", w);
    out = /[?&]odnHeight=\d+/i.test(out)
      ? out.replace(/([?&]odnHeight=)(\d+)/i, function(m, p){ return p + w; })
      : out + "&odnHeight=" + w;
    if (!/odnBg=/i.test(out)) out += "&odnBg=FFFFFF";
  } else if (/(target|dks|nb)\.scene7\.com|media\.kohlsimg\.com/i.test(u)){
    /* Scene7 sizing only ever REDUCES a declared width; the bare
       default is already card-sized on these hosts. */
    if (/[?&]wid=\d+/i.test(u)){
      out = setQ(u, "wid", w);
      if (/[?&]hei=\d+/i.test(out)) out = out.replace(/([?&]hei=)(\d+)/i, function(m, p){ return p + w; });
    }
  } else if (/macysassets\.com/i.test(u)){
    if (/[?&]wid=\d+/i.test(u)) out = setQ(u, "wid", w);
  } else if (/sephora\.com/i.test(u)){
    out = setQ(u, "imwidth", w);
  } else if (/content\.gapinc\.com/i.test(u)){
    out = setQ(u, "width", w);
  } else if (/media\.ultainc\.com/i.test(u)){
    out = setQ(u, "w", w);
    if (/[?&]h=\d+/i.test(out)) out = out.replace(/([?&]h=)(\d+)/i, function(m, p){ return p + w; });
  } else if (/static\.bhphoto\.com/i.test(u)){
    if (/\/images\/fb\//i.test(u)){

/* SCRAPED TEXT IS TEXT (2026-10-19, #417 night order 4): titles arrive

function $(id){ return document.getElementById(id); }

function relTime(iso){
  if (!iso) return null;

  if (!Number.isFinite(t)) return null;

  if (mins < 2) return 'hace un momento';
  if (mins < 60) return 'hace ' + mins + ' min';
  var hrs = Math.floor(mins / 60);

/* ---------- fetch with timeout ---------- */
function fetchJson(url){
  return new Promise(function(resolve, reject){
    var ctrl = null, timer = null;
    try { ctrl = new AbortController(); } catch (e) { /* old browser */ }
    if (ctrl) timer = setTimeout(function(){ try { ctrl.abort(); } catch (e2) {} }, TIMEOUT_MS);
    var opts = ctrl ? { signal: ctrl.signal } : {};
    fetch(url, opts).then(function(res){
      if (timer) clearTimeout(timer);
      if (!res.ok) { reject(new Error('HTTP ' + res.status)); return; }
      res.json().then(resolve, reject);
    }, function(err){
      if (timer) clearTimeout(timer);
      reject(err);
    });
    if (!ctrl) setTimeout(function(){ reject(new Error('timeout')); }, TIMEOUT_MS);
  });
}

/* ---------- soles, always (#416) ----------
   The site's own rate: the same endpoint and 24-hour cache key the
   home page, search and checkout use. Asked for alongside the first
   slice, so it costs no extra round trip. Only if both fail does a
   card show dollars, plainly labelled, rather than nothing. */
var FX_CACHE_KEY = 'aria_fx_rate_v1', FX_CACHE_TTL_MS = 24 * 60 * 60 * 1000;

function pageRate(){
  if (fxVenta) return Promise.resolve(fxVenta);
  try {
    var c = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || 'null');
    if (c && typeof c.venta === 'number' && c.venta > 0 && Date.now() - c.fetchedAt < FX_CACHE_TTL_MS){
      fxVenta = c.venta;
      return Promise.resolve(fxVenta);
    }
  } catch (e) { /* private mode: ask the server */ }
  if (fxPromise) return fxPromise;
  fxPromise = fetchJson(SRC.fx).then(function(j){
    var v = Number(j && (j.venta || j.Venta));
    if (Number.isFinite(v) && v > 0){
      fxVenta = v;
      try { localStorage.setItem(FX_CACHE_KEY, JSON.stringify(Object.assign({}, j, { venta: v, fetchedAt: Date.now() }))); } catch (e) {}
    }
    return fxVenta;
  }, function(){ fxPromise = null; return null; });
  return fxPromise;
}
function fmtPen(n){ return 'S/ ' + Number(n).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtUsd(n){ return 'US$ ' + Number(n).toFixed(2); }

/* ---------- off sale (#443) ---------- */
function onSale(store){
  try { return !(window.AriaOffSale && window.AriaOffSale.isOffSaleRetailer(store)); }
  catch (e) { return true; }
}

/* ---------- state ---------- */
var S = {
  q: '',

  rails: [],            // the default view's rails
  lead: {},             // ids in the lead rail: store rails show them last
  generatedAt: null,
  view: 0,              // bumps on every search; late answers are dropped
  search: null          // { page, pages, total, rails: {store: rail} }
};

function fnUrl(store, q, page){
  return SRC.fn + '?store=' + encodeURIComponent(store || '') + '&sort=discount' +
    '&q=' + encodeURIComponent(q || '') + '&page=' + page;
}
function sliceUrl(store){
  return SRC.slice + encodeURIComponent(store || 'all') + '.discount.json';
}
/* Page 1 of a store is a static file; if it is missing the function
   answers the same page. Later pages are always the function. */
function fetchPage(store, page){
  if (page === 1) return fetchJson(sliceUrl(store)).then(null, function(){ return fetchJson(fnUrl(store, '', 1)); });

/* ---------- photos load when their card is about to be seen ----------
   search.html's watchPhotos (#409): native loading="lazy" fetched
   every photo of a carousel at once on a slow link (1.2MB, measured);

var PHOTO_IO = null;

/* ---------- rendering ---------- */
var SK_CARD = '<div class="card sk" aria-hidden="true"><div class="card-img"></div><div class="card-body">' +
  '<div class="card-brand"><i></i></div><div class="card-title"><i></i><i></i></div>' +
  '<div class="card-prices"><div class="price"><i></i></div></div></div></div>';
function skeletons(n){ var h = ''; for (var i = 0; i < n; i++) h += SK_CARD; return h; }

function priceHTML(c){
  var usd = Number(c.usd), was = Number(c.wasUsd);
  if (fxVenta){
    return '<div class="price-row"><span class="price">' + fmtPen(usd * fxVenta) + '</span>' +
      (was > usd ? '<span class="price-old">' + fmtPen(was * fxVenta) + '</span>' : '') + '</div>' +
      '<div class="price-usd">' + fmtUsd(usd) + '</div>';

    '</div>' +
    '<div class="card-body">' +

      '<div class="card-brand">' + (c.brand ? esc(c.brand) : '&nbsp;') + '</div>' +

    '<div class="hair"></div>' +
    '<div class="rail-head"><h2 class="rail-title">' + esc(r.title) + '</h2>' +

/* Swiping to the end of a rail draws more by itself; the tile is also a button. */

/* ---------- the default view: the carousels ---------- */
function railsFromIndex(ix){
  var rails = [];
  var lead = (ix.lead || []).filter(function(c){ return c && onSale(c.store); });
  S.lead = {};
  lead.forEach(function(c){ if (c.id) S.lead[c.id] = 1; });
  if (lead.length){
    var mix = makeRail({ key: 'lead', store: '', title: 'Las mejores ofertas', items: lead, page: 0, pages: 1, paged: true });
    mix.lead = true;
    rails.push(mix);
  }
  (ix.stores || []).forEach(function(s){
    if (!s || !s.key || !onSale(s.key)) return;
    rails.push(makeRail({ key: s.key, store: s.key, title: s.label || storeLabel(s.key), total: s.n,
      meta: num(s.n) + (s.n === 1 ? ' oferta' : ' ofertas') + (s.top ? ' · hasta -' + s.top + '%' : '') }));
  });
  var more = (ix.more || []).filter(function(c){ return c && onSale(c.store); });
  if (more.length) rails.push(makeRail({ key: 'more', store: '', title: 'Más tiendas', items: more, paged: false,
    meta: num(more.length) + (more.length === 1 ? ' oferta' : ' ofertas') }));

    host.innerHTML = '<div class="state"><h2>Estamos actualizando las ofertas</h2>' +
      '<p>Vuelve en unos minutos — las revisamos varias veces al día.</p>' +
      '<button class="btn" id="retryBtn" type="button">Reintentar</button></div>';

  if (!total) total = ix.total || 0;

function renderError(msg, allowRetry){

    '<p>' + esc(msg || 'No pudimos cargar las ofertas.') + '</p>' +

    fetchJson(SRC.rails).then(null, function(){ return fetchJson(sliceUrl('')).then(indexFromSlice); }),
    pageRate()

/* ---------- a search: the same rails, one per store ----------

function searchRail(store){

  if (sr) return sr;

  sr.filled = true;

    if (!c || !c.store || !onSale(c.store)) return;
    var sr = searchRail(c.store);
    sr.buf.push(c);
    touched[c.store] = sr;
  });
  for (var k in touched){ var sr = touched[k]; while (sr.buf.length) drawFromBuf(sr); sr.count = sr.el.querySelectorAll('.card').length;
    var meta = sr.el.querySelector('.rail-meta'), txt = num(sr.count) + (sr.count === 1 ? ' resultado' : ' resultados');
    if (meta) meta.textContent = txt; else sr.el.querySelector('.rail-head').insertAdjacentHTML('beforeend', '<span class="rail-meta">' + txt + '</span>'); }
}
function searchMoreHTML(){
  var s = S.search;
  if (!s || s.page >= s.pages) return '';
  var seen = Math.min(s.page * PAGE_SIZE, s.total);
  return '<div class="more-wrap" id="moreWrap"><button class="btn" id="moreBtn" type="button">Mostrar más</button>' +
    '<span class="more-note" id="moreNote">Viendo ' + num(seen) + ' de ' + num(s.total) + '</span></div>';
}
function placeMore(){
  var old = $('moreWrap');
  if (old) old.parentNode.removeChild(old);
  var host = $('results');
  host.insertAdjacentHTML('beforeend', searchMoreHTML());
  bindMore();
}
function openSearch(){
  var my = ++S.view;
  var content = $('content'), host = $('results');
  if (!S.q){
    host.hidden = true; host.innerHTML = '';
    content.hidden = false;
    S.search = null;
    if (S.index) renderRails(S.index);
    return;
  }
  content.hidden = true;
  host.hidden = false;
  host.innerHTML = '<section class="rail-sec" aria-hidden="true"><div class="hair"></div><div class="rail-head"><h2 class="rail-title">Buscando…</h2></div>' +
    '<div class="rail">' + skeletons(3) + '</div></section>';
  setCount('');
  Promise.all([fetchJson(fnUrl('', S.q, 1)), pageRate()]).then(function(r){
    if (my !== S.view) return;
    var data = r[0] || {};
    S.search = { page: data.page || 1, pages: data.pages || 1, total: data.total || 0, rails: {} };
    if (!S.search.total){
      host.innerHTML = '<div class="state"><h2>Sin resultados</h2><p>Ninguna oferta coincide con tu búsqueda. Prueba con otra palabra.</p></div>';
      setCount('');
      return;
    }
    setCount(num(S.search.total) + (S.search.total === 1 ? ' oferta' : ' ofertas') + ' para «' + S.q + '»');
    host.innerHTML = '<div id="qRails"></div>';
    drawSearch(data.items);
    placeMore();
  }, function(){
    if (my !== S.view) return;
    host.innerHTML = '<div class="state"><h2>Algo salió mal</h2><p>No pudimos buscar en las ofertas. Revisa tu conexión e inténtalo de nuevo.</p>' +
      '<button class="btn" id="retryQ" type="button">Reintentar</button></div>';
    var b = $('retryQ');
    if (b) b.addEventListener('click', openSearch);
  });
}
function bindMore(){
  var b = $('moreBtn');
  if (!b) return;
  b.addEventListener('click', showMore);
  /* The next 48 are asked for while the shopper scrolls toward the
     button (a few KB), so on a 2-second link the tap answers at once. */
  if (typeof IntersectionObserver !== 'function') return;
  var io = new IntersectionObserver(function(entries){
    if (!entries.some(function(e){ return e.isIntersecting; })) return;
    io.disconnect();
    nextPage();
  }, { rootMargin: '900px 0px' });
  io.observe(b);
}
/* One request per next page, shared by the prefetch and the tap. */
var NEXT = null;   // { key, promise }
function nextPage(){
  var key = S.view + ':' + (S.search.page + 1);
  if (NEXT && NEXT.key === key) return NEXT.promise;
  var p = fetchJson(fnUrl('', S.q, S.search.page + 1));
  NEXT = { key: key, promise: p };
  p.then(null, function(){ if (NEXT && NEXT.key === key) NEXT = null; });
  return p;
}
function showMore(){
  var s = S.search, my = S.view, btn = $('moreBtn');
  if (!s || s.loading || s.page >= s.pages) return;
  s.loading = true;
  if (btn){ btn.disabled = true; btn.textContent = 'Cargando…'; }
  Promise.all([nextPage(), pageRate()]).then(function(r){
    if (my !== S.view) return;
    s.loading = false;
    var data = r[0] || {};
    s.page = data.page || s.page + 1;
    s.pages = data.pages || s.pages;
    drawSearch(data.items);
    placeMore();
  }, function(){
    if (my !== S.view) return;
    s.loading = false;
    if (btn){ btn.disabled = false; btn.textContent = 'Reintentar'; }
    var note = $('moreNote');
    if (note) note.textContent = 'No pudimos cargar más ofertas. Revisa tu conexión.';
  });
}

/* ---------- boot ---------- */
function bindUI(){
  var q = $('q'), t = null;
  /* A search asks the server: wait until the typing pauses. */
  if (q) q.addEventListener('input', function(){
    if (t) clearTimeout(t);
    t = setTimeout(function(){
      try {
        var v = (q.value || '').replace(/\s+/g, ' ').trim().slice(0, 80);
        if (v !== S.q){ S.q = v; openSearch(); }
      } catch (e) {}
    }, 400);
  });
  /* One listener for every rail's tile and retry button. */
  document.addEventListener('click', function(e){
    var el = e.target && e.target.closest ? e.target.closest('[data-more], [data-retry-rail]') : null;
    if (!el) return;
    var r = railByKey(el.getAttribute('data-more') || el.getAttribute('data-retry-rail'));
    if (!r) return;
    if (el.hasAttribute('data-retry-rail')){ r.el.querySelector('.rail').innerHTML = skeletons(3); fillRail(r); }
    else railMore(r);
  });
}

try {
  bindUI();
  openRails();
} catch (e) {
  renderError('No pudimos iniciar la página de ofertas.', true);
}
})();
</script>
<!-- Aria's orb on every page (#386): assets/js/aria-launcher.js -->
<script src="/assets/js/aria-launcher.js" defer></script>
</body>
