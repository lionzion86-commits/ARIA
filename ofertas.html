<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ofertas — Aria Shop</title>
<meta name="description" content="Las mayores ofertas de tiendas de Estados Unidos, con entrega en Perú. Precio honesto, sin letra pequeña.">
<style>
/* Standalone Ofertas page. Zero dependencies: no frameworks, no CDN.
   If this stylesheet failed to load, the page would still render as
   plain readable HTML — never blank. */
:root{
  --navy:#0A1F44; --blue:#2F5FEE; --blue-dark:#1E46C4; --sky:#EAF0FF;
  --paper:#FAFAF8; --green:#1C8A4B; --green-bg:#EAF7EF; --line:#E4E6EC;
  --amber:#B8860B; --yellow:#FFC72C; --red:#D92D20;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);color:var(--navy);-webkit-font-smoothing:antialiased}
/* ---- header ---- */
.site-header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1240px;margin:0 auto;padding:0 12px;height:64px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{text-decoration:none;display:flex;align-items:center;gap:8px}
.wordmark .w1{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-size:20px}
.wordmark .w2{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-size:20px}
.main-nav{display:none;align-items:center;gap:20px;font-size:13.5px}
.main-nav a{color:var(--navy);text-decoration:none;opacity:.75;white-space:nowrap}
.main-nav a:hover{opacity:1}
.main-nav a.active{opacity:1;color:var(--blue);font-weight:800}
@media(min-width:1024px){.main-nav{display:flex}}
.header-meta{font-size:13px;color:#6b7280;white-space:nowrap}
/* ---- page ---- */
.page{max-width:1240px;margin:0 auto;padding:20px 12px 64px}
@media(min-width:640px){.page{padding:28px 20px 72px}}
.eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--blue);background:var(--sky);
  padding:6px 12px;border-radius:999px;margin-bottom:12px}
h1.page-title{margin:0 0 6px;font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em}
.page-sub{margin:0 0 16px;color:#4b5563;font-size:15px;max-width:640px}
/* Yellow is for sale badges only: the freshness line is green. */
.fresh{display:inline-block;font-size:12.5px;font-weight:700;color:var(--green);
  background:var(--green-bg);padding:5px 12px;border-radius:999px;margin-bottom:18px}
.fresh[hidden]{display:none}
/* ---- toolbar ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
.toolbar input[type="search"]{flex:1 1 220px;min-width:0;padding:11px 14px;font-size:14px;
  border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--navy)}
.toolbar select{padding:11px 12px;font-size:14px;border:1px solid var(--line);
  border-radius:12px;background:#fff;color:var(--navy)}
.count-line{font-size:13.5px;color:#4b5563;margin:0 0 14px;min-height:1.4em}
/* ---- grid & cards ---- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;position:relative;min-width:0}
/* THE CARD HOLDS ITS SHAPE BEFORE ANYTHING ARRIVES (#409): the photo
   box is a square from the first paint -- aspect-ratio, plus the
   padding-top square for Safari releases older than 15 -- and the
   text rows reserve their lines, empty or not. */
.card-img{position:relative;width:100%;aspect-ratio:1/1;background:#f1f2f6;overflow:hidden}
@supports not (aspect-ratio:1/1){.card-img{height:0;padding-top:100%}}
.card-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:block}
/* Yellow is for sale badges only. */
.badge{position:absolute;top:8px;left:8px;background:var(--yellow);color:var(--navy);
  font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:2}
.store-tag{position:absolute;bottom:8px;left:8px;background:rgba(10,31,68,.85);color:#fff;
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;z-index:2;max-width:calc(100% - 16px);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-body{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-brand{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;
  min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{font-size:13.5px;font-weight:600;line-height:1.35;margin:0;min-height:36px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* SOLES FIRST (#416): the price a shopper in Peru pays is the bold
   one, the was-price struck through beside it; dollars are the small
   grey reference. */
.card-prices{margin-top:auto;padding-top:8px;min-height:50px}
.price-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price{font-size:18px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.price-old{font-size:12.5px;color:#9aa1b2;text-decoration:line-through;font-variant-numeric:tabular-nums}
.price-usd{font-size:12px;color:#6b7280;font-variant-numeric:tabular-nums;min-height:16px}
/* Placeholder cards: the same boxes, grey bars where the words go. */
.card.sk .card-img{background:linear-gradient(100deg,#eef0f4 40%,#f7f8fb 50%,#eef0f4 60%);
  background-size:200% 100%;animation:sh 1.4s infinite}
.card.sk i{display:block;height:10px;border-radius:5px;background:#eef0f4;margin:3px 0}
.card.sk .card-title i:last-child{width:60%}
.card.sk .card-brand i{width:40%}
.card.sk .price i{height:16px;width:45%;margin-top:6px}
.more-wrap{text-align:center;margin:22px 0 8px}
.more-wrap .btn[disabled]{opacity:.6;cursor:default}
.more-note{display:block;font-size:12.5px;color:#6b7280;margin-top:8px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.rail .card{flex:0 0 42%;max-width:200px;scroll-snap-align:start}
/* ---- states ---- */
.state{border:1px dashed var(--line);border-radius:16px;background:#fff;
  padding:48px 24px;text-align:center;color:#4b5563;font-size:15px}
.state h2{color:var(--navy);font-size:20px;margin:0 0 8px}
.state p{margin:0 0 18px}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;cursor:pointer;
  font-size:15px;font-weight:800;padding:12px 26px;border-radius:12px}
.btn:hover{background:var(--blue-dark)}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.card.sk .card-img{animation:none}}
/* ---- footer ---- */
.site-footer{border-top:1px solid var(--line);background:#fff;margin-top:24px}
.footer-inner{max-width:1240px;margin:0 auto;padding:28px 12px;font-size:13px;color:#6b7280;
  display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.site-footer a{color:var(--blue);text-decoration:none}
</style>
<script src="/ref.js"></script>
<!-- META + TIKTOK PIXELS (#415): the IDs and the events live in assets/js/pixels.js. -->
<script>window.ariaTrack=window.ariaTrack||function(){(ariaTrack.q=ariaTrack.q||[]).push(arguments)};</script>
<script src="/assets/js/pixels.js" async></script>

  'xtremesoccer': 'Xtreme Soccer',
  'yesstyle': 'YesStyle',
  'youngla': 'YoungLA',
  'zumiez': 'Zumiez',
};

/* ---------- config ---------- */
/* THIN OFERTAS (2026-10-19, #409, the Mountain Test). This page used to
   download ofertas-feed-lite.json -- 800 full feed items with sizes,
   descriptions and weights, ~100KB gzipped -- and draw every deal at
   once (~750 cards), and it only ever saw the four stores at the head
   of the feed. Now:
     - the first 48 deals of the chosen store and sort are a static
       slice (assets/ofertas/slices/<store|all>.<sort>.json, ~5KB
       gzipped), built by scripts/build-ofertas-slices.mjs;
     - "Mostrar más" and the search box ask /.netlify/functions/ofertas
       for 48 more (the same order: netlify/functions/_ofertas-core.js);
     - a photo loads when its card is about to be seen (watchPhotos).
   Every URL is same-origin: the page works on a deploy preview too. */
var BASE = '';
var SRC = {
  slice: BASE + '/assets/ofertas/slices/',
  fn:    BASE + '/.netlify/functions/ofertas',
  fx:    BASE + '/.netlify/functions/exchange-rate'
};
var TIMEOUT_MS = 20000;      // per-request timeout: never hang forever
var PAGE_SIZE = 48;          // cards drawn per step, never more

/* ---------- tiny helpers ---------- */
/* Sized retailer derivatives (2026-10-16) -- the same rules the app
   bundle's sizedImageUrl applies: card slots are small, retailer
   originals are 1600-2000px, and decoding them by the hundred is
   what kills phone tabs. A derivative that fails swaps back to the
   original URL (data-img-orig) before the page's own error handling
   runs, so a card never breaks because of the resize. Hosts with no
   verified resize parameter return the URL unchanged. */
var CARD_IMG_WIDTHS = [360, 560, 800];
var CARD_IMG_SIZES = "(max-width: 640px) 44vw, 200px";
/* The width a URL already declares, when it declares one. Feeds are
   inconsistent about this: the same retailer's catalog can carry the
   bare original for one product and a small pre-sized variant for
   the next. */
function declaredImageWidth(u){
  const m = u.match(/[?&](?:wid|width|imwidth|odnWidth|w)=(\d+)/i)
    || u.match(/\/upload\/[^/]*\bw_(\d+)/)
    || u.match(/_(1000|750|500|250)\.jpg(?:\?|$)/i);
  return m ? parseInt(m[1], 10) : 0;
}

function sizedImageUrl(url, w){
  var u = typeof url === "string" ? url : "";
  if (!u || !/^https?:\/\//i.test(u) || !w) return u;
  /* NEVER UPSCALE. When the URL already declares a width at or
     below the step asked for (Kohl's feeds store wid=180/342, some
     Walmart and Sam's Club URLs declare 180), that variant is the
     card image the shopper sees today; asking the CDN for more
     pixels would ADD decoded weight -- the opposite of this job. */
  const declared = declaredImageWidth(u);
  if (declared && w >= declared) return u;
  function setQ(base, key, val){
    var re = new RegExp("([?&]" + key + "=)(\\d+)", "i");
    if (re.test(base)) return base.replace(re, function(m, p){ return p + val; });
    return base + (base.indexOf("?") >= 0 ? "&" : "?") + key + "=" + val;
  }
  var out = null;
  if (/cdn\.shopify\.com/i.test(u)){
    out = setQ(u, "width", w);
  } else if (/res\.cloudinary\.com/i.test(u)){
    if (/\/upload\/[^/]*\bw_\d+/.test(u)) out = u.replace(/(\/upload\/[^/]*)\bw_\d+/, "$1w_" + w);
  } else if (/i5\.(walmartimages|samsclubimages)\.com/i.test(u)){
    out = setQ(u, "odnWidth", w);
    out = /[?&]odnHeight=\d+/i.test(out)
      ? out.replace(/([?&]odnHeight=)(\d+)/i, function(m, p){ return p + w; })
      : out + "&odnHeight=" + w;
    if (!/odnBg=/i.test(out)) out += "&odnBg=FFFFFF";
  } else if (/(target|dks|nb)\.scene7\.com|media\.kohlsimg\.com/i.test(u)){
    /* Scene7 sizing only ever REDUCES a declared width; the bare
       default is already card-sized on these hosts. */
    if (/[?&]wid=\d+/i.test(u)){
      out = setQ(u, "wid", w);
      if (/[?&]hei=\d+/i.test(out)) out = out.replace(/([?&]hei=)(\d+)/i, function(m, p){ return p + w; });
    }
  } else if (/macysassets\.com/i.test(u)){
    if (/[?&]wid=\d+/i.test(u)) out = setQ(u, "wid", w);
  } else if (/sephora\.com/i.test(u)){
    out = setQ(u, "imwidth", w);
  } else if (/content\.gapinc\.com/i.test(u)){
    out = setQ(u, "width", w);
  } else if (/media\.ultainc\.com/i.test(u)){
    out = setQ(u, "w", w);
    if (/[?&]h=\d+/i.test(out)) out = out.replace(/([?&]h=)(\d+)/i, function(m, p){ return p + w; });
  } else if (/static\.bhphoto\.com/i.test(u)){
    if (/\/images\/fb\//i.test(u)){
      if (w <= 280) out = u.replace("/images/fb/", "/images/images250x250/");
      else if (w <= 560) out = u.replace("/images/fb/", "/images/images500x500/");
    }
  } else if (/cdn-images\.farfetch-contents\.com/i.test(u)){
    if (w <= 500 && /_1000\.jpg$/i.test(u)) out = u.replace(/_1000\.jpg$/i, "_500.jpg");
  }
  return out || u;
}
function imageSrcset(url){
  var u = typeof url === "string" ? url : "";
  if (!u) return "";
  if (/cdn-images\.farfetch-contents\.com/i.test(u) && /_1000\.jpg$/i.test(u)){
    return u.replace(/_1000\.jpg$/i, "_500.jpg") + " 500w, " + u + " 1000w";
  }
  var seen = {}, parts = [];
  for (var i = 0; i < CARD_IMG_WIDTHS.length; i++){
    var s = sizedImageUrl(u, CARD_IMG_WIDTHS[i]);
    if (s === u || seen[s]) continue;
    seen[s] = 1;
    parts.push(s + " " + CARD_IMG_WIDTHS[i] + "w");
  }
  return parts.length ? parts.join(", ") : "";
}
function imgOrigRetry(el){
  if (el && el.dataset && el.dataset.imgOrig && el.src !== el.dataset.imgOrig){
    el.src = el.dataset.imgOrig;
    el.removeAttribute("data-img-orig");
    el.removeAttribute("srcset");
    return true;
  }
  return false;
}
/* The card's inline onerror runs in the global scope, outside this
   wrapper: without this, a failed sized photo threw instead of falling
   back to the original. */
window.imgOrigRetry = imgOrigRetry;
function cardImgAttrs(url, sizes){
  var ss = imageSrcset(url);
  return 'src="' + esc(sizedImageUrl(url, 560)) + '"' +
    (ss ? ' srcset="' + esc(ss) + '" sizes="' + (sizes || CARD_IMG_SIZES) + '"' : '') +
    ' data-img-orig="' + esc(url || "") + '"';
}
/* SCRAPED TEXT IS TEXT (2026-10-19, #417 night order 4): titles arrive
   as "Lizzie &#38; Oliver"; escaping that printed "&#38;" to shoppers.
   Entities are decoded first, then everything is escaped as before. */
var ENTITY_NAMED = { amp:"&", lt:"<", gt:">", quot:'"', apos:"'", nbsp:" ", reg:"\u00ae", trade:"\u2122", copy:"\u00a9", deg:"\u00b0", eacute:"\u00e9", ntilde:"\u00f1", rsquo:"\u2019", lsquo:"\u2018", rdquo:"\u201d", ldquo:"\u201c", ndash:"\u2013", mdash:"\u2014", hellip:"\u2026" };
function decodeEntitiesText(s){
  if (typeof s !== "string" || s.indexOf("&") < 0) return s;
  for (var pass = 0; pass < 2 && s.indexOf("&") >= 0; pass++){
    s = s.replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi, function(m, e){
      if (e.charAt(0) === "#"){
        var cp = (e.charAt(1) === "x" || e.charAt(1) === "X") ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
        return (cp > 0 && cp <= 0x10ffff) ? String.fromCodePoint(cp) : m;
      }
      var v = ENTITY_NAMED[e.toLowerCase()];
      return v === undefined ? m : v;
    });
  }
  return s;
}
function esc(s){ return escRaw(decodeEntitiesText(s)); }
function escRaw(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function storeLabel(key){
  if (!key) return 'Tienda';
  if (RETAILER_LABELS[key]) return RETAILER_LABELS[key];
  return String(key).replace(/[-_]+/g,' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}
function relTime(iso){
  if (!iso) return null;
  var t = new Date(iso).getTime();
  if (!Number.isFinite(t)) return null;
  var mins = Math.floor((Date.now() - t) / 60000);
  if (mins < 2) return 'hace un momento';
  if (mins < 60) return 'hace ' + mins + ' min';
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return 'hace ' + hrs + ' h';
  var d = Math.floor(hrs / 24);
  return d === 1 ? 'hace 1 día' : 'hace ' + d + ' días';
}

/* ---------- fetch with timeout ---------- */
function fetchJson(url){
  return new Promise(function(resolve, reject){
    var ctrl = null, timer = null;
    try { ctrl = new AbortController(); } catch (e) { /* old browser */ }
    if (ctrl) timer = setTimeout(function(){ try { ctrl.abort(); } catch (e2) {} }, TIMEOUT_MS);
    var opts = ctrl ? { signal: ctrl.signal } : {};
    fetch(url, opts).then(function(res){
      if (timer) clearTimeout(timer);
      if (!res.ok) { reject(new Error('HTTP ' + res.status)); return; }
      res.json().then(resolve, reject);
    }, function(err){
      if (timer) clearTimeout(timer);
      reject(err);
    });
    if (!ctrl) setTimeout(function(){ reject(new Error('timeout')); }, TIMEOUT_MS);
  });
}

/* ---------- soles, always (#416) ----------
   The site's own rate: the same endpoint and 24-hour cache key the
   home page, search and checkout use. Asked for alongside the first
   slice, so it costs no extra round trip. Only if both fail does a
   card show dollars, plainly labelled, rather than nothing. */
var FX_CACHE_KEY = 'aria_fx_rate_v1', FX_CACHE_TTL_MS = 24 * 60 * 60 * 1000;
var fxVenta = null;     // PEN per USD (venta)
var fxPromise = null;
function pageRate(){
  if (fxVenta) return Promise.resolve(fxVenta);
  try {
    var c = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || 'null');
    if (c && typeof c.venta === 'number' && c.venta > 0 && Date.now() - c.fetchedAt < FX_CACHE_TTL_MS){
      fxVenta = c.venta;
      return Promise.resolve(fxVenta);
    }
  } catch (e) { /* private mode: ask the server */ }
  if (fxPromise) return fxPromise;
  fxPromise = fetchJson(SRC.fx).then(function(j){
    var v = Number(j && (j.venta || j.Venta));
    if (Number.isFinite(v) && v > 0){
      fxVenta = v;
      try { localStorage.setItem(FX_CACHE_KEY, JSON.stringify(Object.assign({}, j, { venta: v, fetchedAt: Date.now() }))); } catch (e) {}
    }
    return fxVenta;
  }, function(){ fxPromise = null; return null; });
  return fxPromise;
}
function fmtPen(n){ return 'S/ ' + Number(n).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtUsd(n){ return 'US$ ' + Number(n).toFixed(2); }

/* ---------- state ---------- */
var S = {
  store: '', sort: 'discount', q: '',
  page: 0, pages: 0, total: 0,
  shown: {},            // ids drawn, so a page boundary never repeats a card
  stores: null,         // [{key, label, n}] from the first slice
  generatedAt: null,
  view: 0,              // bumps on every filter change; late answers are dropped
  loadingMore: false
};

function sliceUrl(){
  return SRC.slice + encodeURIComponent(S.store || 'all') + '.' + S.sort + '.json';
}
function fnUrl(page){
  return SRC.fn + '?store=' + encodeURIComponent(S.store) + '&sort=' + encodeURIComponent(S.sort) +
    '&q=' + encodeURIComponent(S.q) + '&page=' + page;
}
/* Page 1 without a search is a static file; if it is missing the
   function answers the same page. A search is always the function. */
function fetchFirstPage(){
  if (S.q) return fetchJson(fnUrl(1));
  return fetchJson(sliceUrl()).then(null, function(){ return fetchJson(fnUrl(1)); });
}

/* ---------- photos load when their card is about to be seen ----------
   search.html's watchPhotos (#409): native loading="lazy" fetched
   every photo of a carousel at once on a slow link (1.2MB, measured);
   an IntersectionObserver with a 200px margin gives the first screen's
   photos the link to themselves, and the rest come as the shopper
   scrolls or swipes. */
var PHOTO_IO = null;
function showPhoto(img){
  if (!img || !img.dataset.src) return;
  if (img.dataset.srcset){ img.srcset = img.dataset.srcset; img.sizes = img.dataset.sizes || ''; }
  img.src = img.dataset.src;
  img.removeAttribute('data-src');
  img.removeAttribute('data-srcset');
}
function watchPhotos(root){
  var imgs = (root || document).querySelectorAll('img[data-src]');
  if (!imgs.length) return;
  if (typeof IntersectionObserver !== 'function'){ for (var i = 0; i < imgs.length; i++) showPhoto(imgs[i]); return; }
  if (!PHOTO_IO) PHOTO_IO = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (!e.isIntersecting) return;
      PHOTO_IO.unobserve(e.target);
      showPhoto(e.target);
      var rail = e.target.closest('.rail'), card = e.target.closest('.card');
      if (rail && rail.scrollLeft > 0 && card && card.nextElementSibling) showPhoto(card.nextElementSibling.querySelector('img[data-src]'));
    });
  }, { rootMargin: '200px 0px' });
  for (var j = 0; j < imgs.length; j++) PHOTO_IO.observe(imgs[j]);
}

/* ---------- rendering ---------- */
var SK_CARD = '<div class="card sk" aria-hidden="true"><div class="card-img"></div><div class="card-body">' +
  '<div class="card-brand"><i></i></div><div class="card-title"><i></i><i></i></div>' +
  '<div class="card-prices"><div class="price"><i></i></div></div></div></div>';
function skeletons(n){ var h = ''; for (var i = 0; i < n; i++) h += SK_CARD; return h; }

function priceHTML(c){
  var usd = Number(c.usd), was = Number(c.wasUsd);
  if (fxVenta){
    return '<div class="price-row"><span class="price">' + fmtPen(usd * fxVenta) + '</span>' +
      (was > usd ? '<span class="price-old">' + fmtPen(was * fxVenta) + '</span>' : '') + '</div>' +
      '<div class="price-usd">' + fmtUsd(usd) + '</div>';
  }
  /* No rate from the server or the cache: dollars, labelled, never blank. */
  return '<div class="price-row"><span class="price">' + fmtUsd(usd) + '</span>' +
    (was > usd ? '<span class="price-old">' + fmtUsd(was) + '</span>' : '') + '</div>' +
    '<div class="price-usd">&nbsp;</div>';
}
function cardHTML(c){
  var pct = Number(c.pct) || 0;
  var title = decodeEntitiesText(c.title || '') || 'Producto';
  /* The card links into Aria's own product page, with the store, so it
     reads one catalogue. Never out to the retailer. */
  var href = 'producto.html?producto=' + encodeURIComponent(title) +
    (c.store ? '&tienda=' + encodeURIComponent(c.store) : '');
  /* src/srcset parked in data- until the card is about to be seen. */
  var img = c.image
    ? '<img ' + cardImgAttrs(c.image, '(max-width: 640px) 46vw, 300px').replace(/^src=/, 'data-src=').replace(/ srcset=/, ' data-srcset=').replace(/ sizes=/, ' data-sizes=') +
      ' alt="' + esc(title) + '" width="560" height="560" decoding="async" onerror="if(!imgOrigRetry(this)){this.style.display=\'none\'}">'
    : '';
  return '<a class="card" href="' + esc(href) + '" data-id="' + esc(c.id || '') + '">' +
    '<div class="card-img">' +
      (pct > 0 ? '<span class="badge">-' + pct + '%</span>' : '') + img +
      '<span class="store-tag">' + esc(storeName(c.store)) + '</span>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-brand">' + (c.brand ? esc(c.brand) : '&nbsp;') + '</div>' +
      '<h3 class="card-title">' + esc(title) + '</h3>' +
      '<div class="card-prices">' + priceHTML(c) + '</div>' +
    '</div></a>';
}
function storeName(key){
  if (S.stores){
    for (var i = 0; i < S.stores.length; i++) if (S.stores[i].key === key && S.stores[i].label) return S.stores[i].label;
  }
  return storeLabel(key);
}
function cardsHTML(items){
  var html = '';
  for (var i = 0; i < items.length; i++){
    var c = items[i];
    if (!c || (c.id && S.shown[c.id])) continue;
    if (c.id) S.shown[c.id] = 1;
    try { html += cardHTML(c); } catch (e) { /* one bad card never kills the grid */ }
  }
  return html;
}
function moreHTML(){
  if (S.page >= S.pages) return '';
  var seen = Math.min(S.page * PAGE_SIZE, S.total);
  return '<div class="more-wrap" id="moreWrap"><button class="btn" id="moreBtn" type="button">Mostrar más</button>' +
    '<span class="more-note" id="moreNote">Viendo ' + seen.toLocaleString('es-PE') + ' de ' + S.total.toLocaleString('es-PE') + '</span></div>';
}
function renderCount(){
  var cnt = $('countLine');
  if (cnt) cnt.textContent = S.total ? S.total.toLocaleString('es-PE') + (S.total === 1 ? ' oferta real' : ' ofertas reales') : '';
}
function renderFresh(){
  var b = $('freshBadge');
  if (!b) return;
  var rel = relTime(S.generatedAt);
  if (rel){ b.hidden = false; b.textContent = 'Actualizado ' + rel; }
  else { b.hidden = true; }
}
function renderStoreFilter(){
  var sel = $('store');
  if (!sel || !S.stores) return;
  var keys = S.stores.slice().sort(function(a, b){
    return storeName(a.key).localeCompare(storeName(b.key), 'es');
  });
  var html = '<option value="">Todas las tiendas</option>';
  for (var j = 0; j < keys.length; j++){
    var k = keys[j].key;
    html += '<option value="' + esc(k) + '"' + (k === S.store ? ' selected' : '') + '>' + esc(storeName(k)) + '</option>';
  }
  sel.innerHTML = html;
}
/* The first page of a view: the grid, then "Mostrar más". */
function renderView(data){
  var host = $('content');
  if (!host) return;
  S.shown = {};
  S.page = data.page || 1;
  S.pages = data.pages || 1;
  S.total = data.total || 0;
  if (data.generatedAt) S.generatedAt = data.generatedAt;
  if (!S.stores && Array.isArray(data.stores)){ S.stores = data.stores; renderStoreFilter(); }
  renderCount();
  renderFresh();
  if (!S.total){
    host.innerHTML = (S.q || S.store
      ? '<div class="state"><h2>Sin resultados</h2><p>Ninguna oferta coincide con tu búsqueda. Prueba con otra palabra.</p></div>'
      : '<div class="state"><h2>Estamos actualizando las ofertas</h2>' +
        '<p>Vuelve en unos minutos — las revisamos varias veces al día.</p>' +
        '<button class="btn" id="retryBtn" type="button">Reintentar</button></div>');
    bindRetry();
    watchPhotos(host);
    return;
  }
  host.innerHTML = '<div class="grid" id="grid">' + cardsHTML(data.items || []) + '</div>' + moreHTML();
  bindMore();
  watchPhotos(host);
}
function renderLoading(){
  var host = $('content');
  if (!host) return;
  host.innerHTML = '<div class="grid" aria-hidden="true">' + skeletons(8) + '</div>';
}
function renderError(msg, allowRetry){
  var host = $('content');
  if (!host) return;
  host.innerHTML = '<div class="state"><h2>Algo salió mal</h2>' +
    '<p>' + esc(msg || 'No pudimos cargar las ofertas.') + '</p>' +
    (allowRetry ? '<button class="btn" id="retryBtn" type="button">Reintentar</button>' : '') + '</div>';
  bindRetry();
}
function bindRetry(){
  var b = $('retryBtn');
  if (b) b.addEventListener('click', function(){ openView(); });
}
function bindMore(){
  var b = $('moreBtn');
  if (!b) return;
  b.addEventListener('click', showMore);
  /* The next 48 are asked for while the shopper scrolls toward the
     button (a few KB), so on a 2-second link the tap answers at once. */
  if (typeof IntersectionObserver !== 'function') return;
  var io = new IntersectionObserver(function(entries){
    if (!entries.some(function(e){ return e.isIntersecting; })) return;
    io.disconnect();
    nextPage();
  }, { rootMargin: '900px 0px' });
  io.observe(b);
}
/* One request per next page, shared by the prefetch and the tap. */
var NEXT = null;   // { key, promise }
function nextPage(){
  var key = S.view + ':' + (S.page + 1);
  if (NEXT && NEXT.key === key) return NEXT.promise;
  var p = fetchJson(fnUrl(S.page + 1));
  NEXT = { key: key, promise: p };
  p.then(null, function(){ if (NEXT && NEXT.key === key) NEXT = null; });
  return p;
}

/* ---------- a view: store x sort x search ---------- */
function openView(){
  var my = ++S.view;
  S.loadingMore = false;
  if (my > 1) renderLoading();   // the first view shows the HTML placeholders
  Promise.all([fetchFirstPage(), pageRate()]).then(function(r){
    if (my !== S.view) return;
    try { renderView(r[0] || {}); }
    catch (e) { renderError('No pudimos mostrar las ofertas.', true); }
  }, function(){
    if (my !== S.view) return;
    renderError('No pudimos cargar las ofertas. Revisa tu conexión e inténtalo de nuevo.', true);
  });
}

/* "Mostrar más": the next 48, drawn under the ones already there. */
function showMore(){
  if (S.loadingMore || S.page >= S.pages) return;
  var my = S.view, grid = $('grid'), btn = $('moreBtn');
  if (!grid) return;
  S.loadingMore = true;
  if (btn){ btn.disabled = true; btn.textContent = 'Cargando…'; }
  grid.insertAdjacentHTML('beforeend', skeletons(4));
  function dropSkeletons(){
    var sk = grid.querySelectorAll('.card.sk');
    for (var i = 0; i < sk.length; i++) sk[i].parentNode.removeChild(sk[i]);
  }
  Promise.all([nextPage(), pageRate()]).then(function(r){
    if (my !== S.view) return;
    S.loadingMore = false;
    dropSkeletons();
    var data = r[0] || {};
    S.page = data.page || S.page + 1;
    S.pages = data.pages || S.pages;
    grid.insertAdjacentHTML('beforeend', cardsHTML(data.items || []));
    watchPhotos(grid);
    var wrap = $('moreWrap');
    if (wrap){
      var html = moreHTML();
      if (!html) wrap.parentNode.removeChild(wrap);
      else { wrap.insertAdjacentHTML('afterend', html); wrap.parentNode.removeChild(wrap); bindMore(); }
    }
  }, function(){
    if (my !== S.view) return;
    S.loadingMore = false;
    dropSkeletons();
    if (btn){ btn.disabled = false; btn.textContent = 'Reintentar'; }
    var note = $('moreNote');
    if (note) note.textContent = 'No pudimos cargar más ofertas. Revisa tu conexión.';
  });
}

/* ONE SOURCE (2026-10-13, #386). The live scrape (sales-cache, 33 rows
   from three stores in production) no longer sits beside the catalogue
   feed: a store's count here is its count on its own page. */

/* ---------- boot ---------- */
function readUI(){
  S.q = (($('q') || {}).value || '').replace(/\s+/g, ' ').trim().slice(0, 80);
  S.sort = (($('sort') || {}).value || 'discount');
  S.store = (($('store') || {}).value || '');
}
function bindUI(){
  var q = $('q'), s = $('sort'), st = $('store');
  var t = null;
  function change(){ var before = S.store + '|' + S.sort + '|' + S.q; readUI(); if (before !== S.store + '|' + S.sort + '|' + S.q) openView(); }
  /* A search asks the server: wait until the typing pauses. */
  if (q) q.addEventListener('input', function(){
    if (t) clearTimeout(t);
    t = setTimeout(function(){ try { change(); } catch (e) {} }, 400);
  });
  if (s) s.addEventListener('change', function(){ try { change(); } catch (e) {} });
  if (st) st.addEventListener('change', function(){ try { change(); } catch (e) {} });
}

try {
  bindUI();
  readUI();
  openView();
} catch (e) {
  renderError('No pudimos iniciar la página de ofertas.', true);
}
})();
</script>
<!-- Aria's orb on every page (#386): assets/js/aria-launcher.js -->
<script src="/assets/js/aria-launcher.js" defer></script>
</body>
