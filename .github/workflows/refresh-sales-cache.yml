# Keeps the Ofertas deals cache warm server-side, so no visitor's browser
# ever has to write it.
#
# Once a day, 12:00 UTC (07:00 Peru time, before the day's traffic). Cost
# is 12 Apify actor runs per refresh, so 12 runs/day at roughly $0.01-0.03
# each.
#
# KNOWN AND ACCEPTED: the cache TTL is 6h, so from ~18:00 UTC each day the
# cache reads stale and visitors fall back to a live browser scan until the
# next run. That is deliberate pre-launch — it keeps Apify spend down while
# traffic is minimal — and is to be revisited when ad traffic starts, by
# moving back to a cron at or under the 6h TTL (e.g. "0 */6 * * *").
#
# Required repository secret:
#   SALES_REFRESH_TOKEN   must match the SALES_REFRESH_TOKEN environment
#                         variable set on the Netlify site
name: Refresh Ofertas cache

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}      # lets an operator run it by hand from the Actions tab

concurrency:
  # Two overlapping refreshes would just burn Apify credits racing to write
  # the same key.
  group: refresh-sales-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20       # a full scan polls 12 sources; 20m is generous headroom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh the deals cache
        env:
          SITE: https://ariashop.pe
          SALES_REFRESH_TOKEN: ${{ secrets.SALES_REFRESH_TOKEN }}
        run: node scripts/refresh-sales-cache.js
