<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Aria Compradores</title>

<!-- ============================================================
     COMPRADORES -- the purchasing agent's view (#443, Phase 1).
     STAFF ONLY, not linked from any public page, noindex. Phone first.

     The storefront never links out to a retailer. THIS PAGE DOES, by
     spec: COMPRAR is a direct anchor to the exact product page the
     order was placed from (deep-link spec c.6548858279).

     WHERE THINGS LIVE (so a grep of this file finds the way):
       - The rules AND the copy that is the same everywhere live in
         /assets/agent/agent-core.js: the ALMACEN ship-to block
         (ALMACEN_FIXED_LINES / almacenBlock, rendered below into
         #almacenText from the order's customerName), the celebration
         texts (MILESTONES), the problem presets, the ceiling sentence.
       - Who may use it: the agent's own Aria login with the role Danny
         grants (agent-queue.js). The demo picker and sample orders run
         ONLY on deploy previews and localhost (demoAllowed).
       - Weak signal: the day is kept on the phone, /agente-sw.js keeps
         the page and photos, completions and exceptions wait in an
         outbox and sync when signal returns (the top-bar indicator).
       - PHASE 2, LIVE DISPATCH (signed in): while she is clocked in the
         page polls /.netlify/functions/agent-dispatch every few seconds.
         That poll is her presence (on a break or in focus mode she is
         not pinged) and brings the pop-up: "Pedido de [cliente]", S/ N,
         N compras · N tiendas, store chips, photos, the total in USD and
         soles, a 30-second countdown, ACEPTAR and Pasar. First claim
         wins on the server; everyone else sees "taken". A claimed order
         opens as one store checkout after another (the only place the
         customer's DNI, address and phone appear), and Pagos holds her
         balance, cash-out (fee and net shown first) and history. The
         rules: /assets/agent/dispatch-core.js.
       - THE BOARD (#443 c.6559624585): what nobody took in the ring, or
         what came in while nobody was online, waits unassigned on
         «Compras que todavía hay que hacer». Going online, the count
         («Hay 3 compras esperando») is the first thing on screen; each
         card carries the pop-up's decision layer plus how long it has
         waited, and «Tomar» is the same first claim as ACEPTAR (the
         loser sees «Otra compradora lo tomó»; an ineligible buyer sees
         the card greyed with why, e.g. «Sin cupo en Crocs hoy»).
     ============================================================ -->
<style>
  body { padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px)); }
  /* The fixed dock / tab bar never hides what a jump or a focus scrolls to. */
  html { scroll-padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); scroll-padding-top: 70px; }
  main { max-width: 640px; margin: 0 auto; padding: 14px 16px 24px; }

  /* sync indicator */
  .sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 900; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .top .right { min-width: 0; }
  #whoTop { max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 430px) { .brand small { display: none; } }
  .sync.off { background: var(--bad); color: #fff; }
  .sync.wait { background: var(--gold); color: var(--navy); }
  .sync.ok { background: rgba(255,255,255,.14); color: #C5D0E8; }
  .sync i { width: 8px; height: 8px; border-radius: 999px; background: currentColor; display: inline-block; }

  /* clock-in */
  .hero { text-align: center; padding: 28px 8px 8px; }
  .hero .mark { width: 76px; height: 76px; border-radius: 22px; background: var(--navy); display: grid; place-items: center; margin: 0 auto 16px; }
  .hero h1 { font-size: 30px; line-height: 1.1; margin: 0 0 8px; letter-spacing: -.02em; }
  .hero p { margin: 0 auto 22px; max-width: 30ch; color: var(--ink-2); }
  .who-pick { display: grid; gap: 10px; margin: 18px 0; }
  .who-pick button { text-align: left; justify-content: flex-start; }
  .who-pick button[aria-pressed="true"] { outline: 3px solid var(--blue); background: var(--card); }
  .initial { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 999px; background: var(--navy); color: var(--gold); display: grid; place-items: center; font-weight: 900; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 13px; margin: 22px 0 6px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .stamp { margin: 18px auto 0; display: inline-block; padding: 10px 16px; border-radius: 12px; background: var(--ok-bg); color: var(--ok); font-weight: 800; }

  /* shift bar */
  .shift { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .shift .clock { font-weight: 800; }
  .shift .clock small { display: block; font-weight: 600; color: var(--ink-3); font-size: 12px; }
  .shift .breaks { margin-left: auto; display: flex; gap: 8px; }
  .paused { background: var(--warn-bg); color: var(--warn); border-radius: var(--radius); padding: 22px 16px; text-align: center; margin-bottom: 14px; }
  .paused h2 { margin: 0 0 4px; font-size: 26px; }

  /* Mi día strip */
  .strip { padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .strip .num { font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
  .bar { height: 12px; background: var(--sky); border-radius: 999px; overflow: hidden; flex: 1; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--gold)); border-radius: 999px; transition: width .5s; }

  /* tabs */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 5px; margin: 12px 0; }
  .seg button { border: 0; background: none; min-height: 52px; border-radius: 12px; font-weight: 800; color: var(--ink-2); font-size: 16px; }
  .seg button[aria-selected="true"] { background: var(--navy); color: #fff; }
  .seg .n { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 999px; background: var(--gold); color: var(--navy); font-size: 13px; margin-left: 6px; padding: 0 6px; }

  .store { margin: 16px 0 8px; }
  .store-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .store-h h3 { margin: 0; font-size: 19px; }
  .store-h .acts { margin-left: auto; display: flex; gap: 8px; }
  .row { display: flex; gap: 12px; padding: 10px; align-items: center; margin-bottom: 8px; width: 100%; min-height: 84px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 16px; }
  .row img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--sky); flex: 0 0 auto; }
  .row .t { font-weight: 800; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .s { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
  .row .go { margin-left: auto; color: var(--blue); flex: 0 0 auto; }
  .row.bought { border-color: var(--ok-bg); }
  .row.bought .tick { margin-left: auto; width: 34px; height: 34px; border-radius: 999px; background: var(--ok); display: grid; place-items: center; flex: 0 0 auto; }
  .row .pend { font-size: 12px; font-weight: 900; color: var(--warn); }
  .empty { text-align: center; padding: 30px 12px; color: var(--ink-2); }
  .empty strong { display: block; color: var(--ink); font-size: 19px; margin-bottom: 4px; }
  @keyframes inright { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }
  .slide-in { animation: inright .35s ease-out; }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { background: var(--ok-bg); } 100% { background: var(--card); } }

  /* focus */
  .focus .photo { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: #fff; border-radius: var(--radius); border: 1px solid var(--line); display: block; }
  .focus h1 { font-size: 22px; line-height: 1.2; margin: 14px 0 6px; letter-spacing: -.01em; }
  .focus .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 12px; }
  .steps span { text-align: center; font-size: 12px; font-weight: 900; padding: 8px 4px; border-radius: 10px; background: var(--sky); color: var(--ink-3); }
  .steps span.now { background: var(--navy); color: #fff; }
  .steps span.done { background: var(--ok-bg); color: var(--ok); }
  .variant { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .variant div { border: 3px solid var(--gold); background: var(--gold-2); border-radius: 16px; padding: 10px 12px; }
  .variant b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
  .variant span { font-size: 24px; font-weight: 900; line-height: 1.15; }
  .variant .nocolor span { font-size: 16px; }
  .rule { background: var(--bad-bg); color: var(--bad); border-left: 6px solid var(--bad); border-radius: 16px; padding: 12px 14px; margin: 12px 0; }
  .rule strong { display: block; font-size: 19px; letter-spacing: .06em; }
  .ojo { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 10px 14px; font-weight: 700; margin: 10px 0; }
  .ceiling { font-size: 19px; font-weight: 800; background: var(--sky); color: var(--navy); border-radius: 16px; padding: 14px; margin: 12px 0 4px; }
  .fxnote { font-size: 12px; color: var(--ink-3); margin: 0 0 12px; }
  .almacen { padding: 14px; margin: 12px 0; }
  .almacen h2 { margin: 0 0 8px; font-size: 14px; letter-spacing: .12em; color: var(--ink-3); }
  .almacen pre { margin: 0 0 12px; font: 700 17px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .checklist { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 8px; }
  .checklist label { display: flex; gap: 12px; align-items: center; min-height: 58px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-weight: 800; }
  .checklist input { width: 28px; height: 28px; accent-color: var(--ok); flex: 0 0 auto; }
  .checklist label.done { border-color: var(--ok); background: var(--ok-bg); }
  .comments { padding: 14px; margin: 14px 0; }
  .comments h2 { margin: 0 0 8px; font-size: 17px; }
  .msg { padding: 8px 12px; border-radius: 12px; background: var(--bg); margin: 6px 0; }
  .msg b { font-size: 13px; }
  .inline { display: flex; gap: 8px; }
  .inline input { flex: 1; min-width: 0; min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); padding: 0 12px; }

  /* THE DOCK: one primary action, always under the thumb. */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 10px;
    box-shadow: 0 -6px 20px rgba(10,31,68,.08);
  }
  .dock .btn { min-height: 64px; font-size: 18px; padding: 0 12px; gap: 8px; }
  .dock .second-bad { font-size: 17px; }
  .dock .primary-act { font-size: 20px; letter-spacing: .02em; }
  .btn.second-bad { background: transparent; border: 2px solid var(--bad); color: var(--bad); }

  /* card reveal */
  .vcard { border-radius: 20px; padding: 20px; color: #fff; background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 55%, #2443A0 100%); position: relative; overflow: hidden; }
  .vcard .sb { position: absolute; top: 14px; right: 14px; background: var(--gold); color: var(--navy); font-weight: 900; letter-spacing: .14em; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .vcard .pan { font: 800 22px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; margin: 34px 0 14px; }
  .vcard .row2 { display: flex; gap: 24px; font-size: 13px; color: #C5D0E8; }
  .vcard .row2 b { display: block; color: #fff; font-size: 17px; }
  .locks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .locks div { min-width: 0; overflow-wrap: anywhere; background: var(--bg); border-radius: 14px; padding: 10px 12px; }
  .locks b { display: block; font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
  .locks span { font-weight: 900; font-size: 18px; }
  .locks small { display: block; color: var(--ink-2); font-weight: 700; }
  .timer { display: flex; align-items: center; gap: 14px; margin: 10px 0; }
  .timer .mm { font: 900 34px/1 ui-monospace, Menlo, monospace; }
  .hidden-card { text-align: center; padding: 26px 12px; background: var(--bg); border-radius: 18px; }

  /* sheets */
  .presets { display: grid; gap: 10px; margin: 14px 0; }
  .presets .btn { justify-content: flex-start; min-height: 64px; font-size: 18px; background: var(--bad-bg); color: var(--bad); }
  .shotpick { cursor: pointer; overflow: hidden; }
  .shotpick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shotpick:focus-within { outline: 3px solid var(--blue); }

  /* Mi día + summary */
  .ring-wrap { display: grid; place-items: center; padding: 18px 0 6px; position: relative; }
  .ring-wrap .c { position: absolute; text-align: center; }
  .ring-wrap .c b { display: block; font-size: 44px; letter-spacing: -.03em; line-height: 1; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .stats div { padding: 14px; min-width: 0; }
  .stats b { display: block; font-size: 26px; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .stats .wide { grid-column: 1 / -1; }
  .earn b { font-size: 22px; }
  .badges { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0; }
  .badge { text-align: center; font-size: 11px; font-weight: 800; color: var(--ink-3); }
  .badge svg { width: 100%; height: auto; max-width: 56px; display: block; margin: 0 auto 4px; }
  .badge.got { color: var(--navy); }
  .summary-h { background: var(--navy); color: #fff; border-radius: var(--radius); padding: 20px 18px; margin: 4px 0 12px; }
  .summary-h h1 { margin: 0 0 4px; font-size: 26px; }
  .summary-h p { margin: 0; color: #C5D0E8; }

  /* celebration: never blocks the next tap */
  .party { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; background: rgba(10,31,68,.86); overflow: hidden; pointer-events: none; animation: partyout .4s ease-in 2.8s forwards; }
  @keyframes partyout { to { opacity: 0; } }
  .party .msg2 { text-align: center; color: #fff; position: relative; z-index: 2; padding: 0 24px; }
  .party h2 { font-size: 40px; line-height: 1.05; margin: 14px 0 10px; letter-spacing: -.02em; }
  .party .count { font-size: 88px; font-weight: 900; color: var(--gold); line-height: 1; letter-spacing: -.04em; }
  .party p { font-size: 19px; color: #DDE5F7; margin: 0; font-weight: 700; }
  .confetti { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .burst { animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }

  /* bottom nav */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.tabs button { background: none; border: 0; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 800; color: var(--ink-3); }
  nav.tabs button svg { width: 24px; height: 24px; }
  nav.tabs button[aria-selected="true"] { color: var(--blue); }
  .search { width: 100%; min-height: 56px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); padding: 0 16px; }
  @media (min-width: 900px) { main { max-width: 760px; } }

  /* ---- Phase 2: go online (Uber-style, #443 c.6554384221) ---- */
  .line-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 900; letter-spacing: .08em; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .line-tag i { width: 8px; height: 8px; border-radius: 999px; background: currentColor; }
  .line-tag.on { background: #12A150; color: #fff; }
  .line-tag.on i { animation: blink 1.4s infinite; }
  .line-tag.pause { background: var(--gold); color: var(--navy); }
  .line-tag.off { background: rgba(255,255,255,.14); color: #C5D0E8; }
  .golive { min-height: 84px !important; font-size: 24px !important; letter-spacing: .01em; background: #12A150; color: #fff; border-radius: 22px; box-shadow: 0 10px 24px rgba(18,161,80,.28); }
  .offline-hero { text-align: center; padding: 26px 8px 10px; }
  .offline-hero .dot { width: 96px; height: 96px; border-radius: 999px; margin: 0 auto 14px; display: grid; place-items: center; background: var(--line); }
  .offline-hero .dot i { width: 30px; height: 30px; border-radius: 999px; background: var(--ink-3); }
  .offline-hero h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -.02em; }
  .offline-hero p { margin: 0 auto 20px; max-width: 32ch; color: var(--ink-2); }
  .wait-hero { text-align: center; padding: 34px 12px 26px; margin: 0 0 14px; }
  .radar { position: relative; width: 140px; height: 140px; margin: 0 auto 18px; }
  .radar i { position: absolute; inset: 0; border-radius: 999px; background: #12A150; opacity: .18; animation: ping 2s ease-out infinite; }
  .radar i:nth-child(2) { animation-delay: .7s; }
  .radar b { position: absolute; inset: 42px; border-radius: 999px; background: #12A150; box-shadow: 0 0 0 8px rgba(18,161,80,.18); }
  @keyframes ping { from { transform: scale(.45); opacity: .5; } to { transform: scale(1.15); opacity: 0; } }
  /* Online must visibly MOVE (Danny, c.6560383898); offline stays still.
     Reduced motion keeps a gentle breathing pulse rather than nothing. */
  @media (prefers-reduced-motion: reduce) {
    .radar i { animation: breathe 3.2s ease-in-out infinite; }
    .radar i:nth-child(2) { animation-delay: 1.6s; }
    .line-tag.on i { animation: breathe 3.2s ease-in-out infinite; }
  }
  @keyframes breathe { 0%, 100% { opacity: .12; transform: scale(.9); } 50% { opacity: .3; transform: scale(1); } }
  .menu-btn { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 12px; min-width: 44px; min-height: 40px; display: inline-grid; place-items: center; padding: 0 8px; }
  .menu-btn svg { width: 22px; height: 22px; }
  .wait-hero h2 { font-size: 28px; margin: 0 0 6px; letter-spacing: -.02em; }
  .wait-hero .on-word { color: #12A150; font-weight: 900; letter-spacing: .08em; font-size: 14px; display: block; margin-bottom: 4px; }
  .wait-hero p { margin: 0 auto; color: var(--ink-2); max-width: 30ch; }
  .demo-banner { background: var(--gold); color: var(--navy); border-radius: 16px; padding: 12px 14px; margin: 0 0 12px; font-weight: 800; }
  .demo-banner b { letter-spacing: .1em; }

  /* ---- Phase 2: live dispatch ---- */
  nav.tabs { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .dx-status { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin: 0 0 12px; font-weight: 800; }
  .dx-status i { width: 12px; height: 12px; border-radius: 999px; background: var(--ink-3); flex: 0 0 auto; }
  .dx-status.on i { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-bg); }
  .dx-status.off i { background: var(--warn); }
  .dx-status .sb, .ring .sb, .bundle-h .sb, .bcard .sb { margin-left: auto; background: var(--gold); color: var(--navy); font-weight: 900; letter-spacing: .12em; font-size: 11px; padding: 3px 9px; border-radius: 999px; }
  .bundle-card { padding: 14px; margin: 0 0 10px; }
  .bundle-card h3 { margin: 0 0 4px; font-size: 19px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .ring-back { position: fixed; inset: 0; z-index: 96; background: rgba(6,15,34,.72); display: flex; align-items: flex-end; justify-content: center; }
  .ring { background: var(--card); width: 100%; max-width: 560px; border-radius: 26px 26px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); animation: up .22s ease-out; max-height: 96vh; overflow-y: auto; }
  @media (min-width: 700px) { .ring-back { align-items: center; } .ring { border-radius: 26px; } }
  .ring-top { display: flex; align-items: center; gap: 10px; }
  .ring-live { display: inline-flex; align-items: center; gap: 8px; font-weight: 900; color: var(--blue); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  .ring-live i { width: 10px; height: 10px; border-radius: 999px; background: var(--blue); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .ring-count { margin-left: auto; font: 900 30px/1 ui-monospace, Menlo, monospace; color: var(--navy); min-width: 2ch; text-align: right; }
  .ring .sb + .ring-count { margin-left: 8px; }
  .ring h2 { font-size: 24px; line-height: 1.15; margin: 10px 0 6px; letter-spacing: -.01em; }
  .ring-pay { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .ring-pay b { font-size: 46px; font-weight: 900; letter-spacing: -.03em; color: var(--ok); line-height: 1; }
  .ring-pay span { font-size: 19px; font-weight: 800; color: var(--ink-2); }
  .strip-photos { display: flex; gap: 8px; overflow-x: auto; margin: 10px 0; padding-bottom: 2px; }
  .strip-photos img { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; background: var(--sky); flex: 0 0 auto; border: 1px solid var(--line); }
  .ring-total { background: var(--sky); color: var(--navy); border-radius: 16px; padding: 12px 14px; margin: 8px 0; }
  .ring-total b { display: block; font-size: 22px; }

<body>

<script type="module">
import * as C from "/assets/agent/agent-core.js";
import * as D from "/assets/agent/dispatch-core.js";
import { loadDemoDay, resetDemoDay, saveDay, loadDay, onDayChange, DEMO_KEY, loadFx, rememberSession, lastSession } from "/assets/agent/agent-store.js";

/* The back button must never resurrect a closed session: a page restored
   from the back/forward cache boots again, against the server. */
window.addEventListener("pageshow", (e) => { if (e.persisted) location.reload(); });

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nowIso = () => new Date().toISOString();
const hhmm = (iso) => iso ? new Date(iso).toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }) : "";
const dayLabel = (iso) => new Date(iso).toLocaleDateString("es-PE", { weekday: "long", day: "numeric", month: "long" });
const hm = (mins) => `${Math.floor(mins / 60)} h ${String(mins % 60).padStart(2, "0")} min`;
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3l10 18H2z" stroke-linejoin="round"/><path d="M12 10v5M12 18v.5"/></svg>',
  card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5z"/><path d="M9 11h6M9 15h6"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
};

/* ---------------- session ---------------- */
const DEMO_OK = C.demoAllowed(location.hostname);
const S = { mode: null, gate: null, day: null, key: DEMO_KEY, agentId: null, view: "in", tab: "lista", list: "por", focusId: null, checks: {}, timer: null, query: "", fx: null, syncing: false };

async function boot() {
  let res = null;
  try {
    const r = await fetch("/.netlify/functions/agent-queue", { credentials: "same-origin" });
    res = { status: r.status, body: await r.json().catch(() => ({})) };
  } catch { res = null; } // no signal (or no functions on a bare static server)
  const last = lastSession();
  const wantDemo = DEMO_OK && new URLSearchParams(location.search).has("demo");
  /* Danny (admin) is on the launch roster: on this page he is a buyer too. */
  if (res && res.status === 200 && res.body.role === "admin" && res.body.agentId && !wantDemo) {
    res.body = { ...res.body, role: "agent", orders: [], history: [], accounts: [], chat: [] };
  }
  if (res && res.status === 200 && res.body.role === "agent") {
    const live = res.body;
    S.mode = "live"; S.agentId = live.agentId; S.key = "aria-compradores-live-" + live.agentId + "-" + live.date;
    S.day = loadDay(S.key) || {
      date: live.date, agents: [live.agent], accounts: live.accounts || [], orders: live.orders, history: live.history || [],
      shifts: {}, exceptions: [], chat: live.chat || [], storeNotes: [], storeFlags: [], cards: {}, ledger: [], log: [], outbox: [],
      settings: live.settings || { payPerPurchasePen: null }, seq: 0,
    };
    S.day.settings = live.settings || S.day.settings; // Danny may have set the rate since
    /* PHASE 2: a signed-in buyer's queue IS live dispatch -- one packet per
       customer order per store. Phase 1's sample list (one item per
       "order", each with its own customer and card) is the demo's model
       only; showing it to a live buyer on a preview is what made packets
       look per item. It stays in demo mode (?demo=1). */
    S.day.orders = []; S.day.history = [];
    $("#demoTag").hidden = true;
    restoreStash();
    healStaleSession();
    rememberSession({ mode: "live", key: S.key, agentId: S.agentId });
  } else if (!res && last && last.mode === "live" && loadDay(last.key)) {
    /* No signal: reopen the day this phone was already working on. */
    S.mode = "live"; S.key = last.key; S.agentId = last.agentId; S.day = loadDay(last.key);
  } else if (DEMO_OK && (!res || res.status === 401 || res.status === 404 || res.status === 403 || (res.status === 200 && res.body.role === "admin"))) {
    S.mode = "demo"; S.day = loadDemoDay();
    if (last && last.mode === "demo") S.agentId = last.agentId || null;
    $("#demoTag").hidden = false;
    onDayChange((d) => { S.day = d; render(); });
  } else {
    /* Production: the agent's own Aria login, with the role Danny grants. */
    S.mode = "gate";
    S.gate = !res ? "offline" : res.status === 401 ? "login" : "denied";
    render();
    return;
  }
  const sh = S.agentId && S.day.shifts[S.agentId];
  S.view = sh && sh.clockOut ? "summary" : sh && sh.clockIn ? "home" : "in";
  render();
  loadFx().then((fx) => { S.fx = fx; render(); });
  registerWorker();
  if (S.mode === "live") {
    $("#tabPagos").hidden = false;
    DX.mine = S.day.dispatchMine || []; DX.ledger = S.day.dispatchLedger || null; DX.cfg = S.day.dispatchCfg || null;
    if (sh && sh.clockIn && !sh.clockOut) startDispatch();
  }
  window.addEventListener("online", sync);
  window.addEventListener("offline", paintSync);
  setInterval(sync, 15000);
  sync();
}
const save = () => { saveDay(S.day, S.key); paintSync(); };

/* ---------------- truthful presence (Danny, c.6560568865) ----------------
   Presence is a heartbeat: every successful dispatch poll stamps
   S.day.lastBeatAt (and, on the server, presence.seenAt, which decides
   pings: presenceTtlSeconds). A page that opens on a day whose heartbeat
   lapsed past HEARTBEAT_STALE_MS was a dead session (tab closed, phone
   off): its open shift is closed at the last heartbeat, the online flag
   is dropped, and she starts clean -- FUERA DE LÍNEA with a working
   «Ponerse en línea». The header, the control and the server agree. */
const HEARTBEAT_STALE_MS = 90 * 1000;
function healStaleSession() {
  if (!S.day || !S.agentId) return;
  const s = S.day.shifts[S.agentId];
  const beat = S.day.lastBeatAt ? Date.parse(S.day.lastBeatAt) : 0;
  if (beat && Date.now() - beat <= HEARTBEAT_STALE_MS) return;
  if (s && s.clockIn && !s.clockOut) {
    const end = beat && beat > Date.parse(s.clockIn) ? S.day.lastBeatAt : s.clockIn;
    C.clockOut(S.day, S.agentId, end);
    S.healedAt = end;
  }
  if (s && s.clockOut) retireShift();
  S.day.dispatchOnline = false;
  saveDay(S.day, S.key);
}
/* A finished shift moves to pastShifts, so a new one can start the same day. */
function retireShift() {
  const s = S.day.shifts[S.agentId];
  if (!s || !s.clockOut) return;
  (S.day.pastShifts || (S.day.pastShifts = [])).push({ agentId: S.agentId, ...s });
  delete S.day.shifts[S.agentId];
}

/* ---------------- Cerrar sesión (Danny, c.6560594013) ----------------
   Three separate things: EN LÍNEA / FUERA DE LÍNEA is availability only;
   «Terminar turno» ends the shift (Fin de turno), still signed in;
   «Cerrar sesión» ends the session: server session deleted, this agent's
   days and cached state removed from the phone, the worker's caches
   cleared, and the login screen. Completions not yet synced are NEVER
   dropped: she is warned and can sync first; if they still cannot go, they
   stay on this phone under her name only (STASH_PREFIX + her id) and are
   sent the next time she signs in here. */
const STASH_PREFIX = "aria-compradores-pending-";
const LAST_SESSION_KEY = "aria-compradores-last-v1";
const lsKeys = () => { try { return Array.from({ length: localStorage.length }, (_, i) => localStorage.key(i)); } catch { return []; } };
function restoreStash() {
  let stash = null;
  try { stash = JSON.parse(localStorage.getItem(STASH_PREFIX + S.agentId) || "null"); } catch { stash = null; }
  if (!Array.isArray(stash) || !stash.length) return;
  const have = new Set((S.day.outbox || []).map((e) => e.id));
  (S.day.outbox || (S.day.outbox = [])).push(...stash.filter((e) => e && e.id && !have.has(e.id)));
  saveDay(S.day, S.key);
  try { localStorage.removeItem(STASH_PREFIX + S.agentId); } catch { /* storage off */ }
}
function signOutSheet() {
  const n = S.day ? C.pendingEvents(S.day).length : 0;
  if (!n) return signOut();
  sheet(`<h2>Cerrar sesión</h2><p class="muted" style="margin:0" id="soPending">Tienes ${n} por sincronizar. Conviene sincronizar antes de salir.</p>
    <button class="btn big primary" data-sync style="margin-top:14px">Sincronizar y cerrar sesión</button>
    <button class="btn big ghost" data-anyway style="margin-top:8px">Cerrar sesión igual</button>
    <p class="tiny" style="margin:8px 0 0">Si sales igual, quedan guardadas en este teléfono a tu nombre y se envían solas la próxima vez que entres. No se pierden.</p>
    <button class="btn big ghost" data-x style="margin-top:8px">Cancelar</button>`, (el, close) => {
    el.querySelector("[data-x]").onclick = close;
    el.querySelector("[data-anyway]").onclick = () => { close(); signOut(); };
    el.querySelector("[data-sync]").onclick = async () => {
      await sync();
      const left = C.pendingEvents(S.day).length;
      if (!left) { close(); signOut(); return; }
      el.querySelector("#soPending").textContent = `Todavía quedan ${left} por sincronizar (sin señal). Puedes esperar o cerrar sesión igual.`;
    };
  });
}
async function signOut() {
  if (DX.timer) { clearInterval(DX.timer); DX.timer = null; }
  closePopup();
  const id = S.agentId;
  try { await dxPost({ action: "leave" }); } catch { /* the heartbeat lapses anyway */ }
  try {
    const pend = S.day ? C.pendingEvents(S.day) : [];
    if (id && pend.length) localStorage.setItem(STASH_PREFIX + id, JSON.stringify(pend));
    for (const k of lsKeys()) if (k === LAST_SESSION_KEY || (id && k.startsWith("aria-compradores-live-" + id + "-"))) localStorage.removeItem(k);
  } catch { /* storage off */ }
  try { if (window.caches) for (const k of await caches.keys()) if (k.startsWith("aria-agente-")) await caches.delete(k); } catch { /* no caches */ }
  try { await fetch("/.netlify/functions/auth-logout", { method: "POST", credentials: "same-origin" }); } catch { /* the cookie is cleared server-side when it can be */ }
  S.day = null; S.agentId = null;
  location.replace("/agente.html");
}
function menuSheet() {
  const s = (S.day && S.day.shifts[S.agentId]) || {};
  const open = s.clockIn && !s.clockOut;
  sheet(`<h2>${esc(me() ? me().name : "Menú")}</h2>
    ${open ? `<button class="btn big ghost" data-end style="margin-top:8px">Terminar turno</button>` : ""}
    <button class="btn big bad" data-signout style="margin-top:8px">Cerrar sesión</button>
    <button class="btn big ghost" data-x style="margin-top:8px">Volver</button>`, (el, close) => {
    el.querySelector("[data-x]").onclick = close;
    const e = el.querySelector("[data-end]"); if (e) e.onclick = () => { close(); endShiftSheet(); };
    el.querySelector("[data-signout]").onclick = () => { close(); signOutSheet(); };
  });
}
const me = () => S.day.agents.find((a) => a.id === S.agentId);
const venta = () => (S.fx ? S.fx.venta : null);

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2400); }

/* ---------------- weak signal: worker + outbox ---------------- */
function registerWorker() {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("/agente-sw.js", { scope: "/agente" }).catch(() => null);
}
function warmPhotos() {
  try {
    const urls = S.day.orders.filter((o) => o.assignedTo === S.agentId).map((o) => o.image).filter(Boolean);
    navigator.serviceWorker && navigator.serviceWorker.ready.then((r) => r.active && r.active.postMessage({ type: "warm", urls }));
  } catch { /* no worker: photos load as usual */ }
}
function paintSync() {
  const tag = $("#syncTag");
  if (!S.day || S.mode === "gate") { tag.hidden = true; return; }
  const n = C.pendingEvents(S.day).length;
  const off = navigator.onLine === false;
  tag.hidden = false;
  tag.className = "sync " + (off ? "off" : n ? "wait" : "ok");
  tag.innerHTML = `<i></i>${off ? (n ? `Sin señal · ${n} por sincronizar` : "Sin señal") : n ? (S.syncing ? `Sincronizando ${n}` : `${n} por sincronizar`) : "Sincronizado"}`;
  tag.title = tag.textContent;
}
async function sync() {
  paintSync();
  if (!S.day || S.syncing || navigator.onLine === false) return;
  const pending = C.pendingEvents(S.day);
  if (!pending.length) return;
  S.syncing = true; paintSync();
  try {
    let ids = [];
    if (S.mode === "live") {
      /* Dispatch events (a store checkout bought / an exception) go to the
         dispatch endpoint; Phase 1's go where they always went. */
      const dx = pending.filter((e) => DISPATCH_TYPES.has(e.type)), q = pending.filter((e) => !DISPATCH_TYPES.has(e.type));
      if (q.length) {
        const r = await fetch("/.netlify/functions/agent-queue", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ events: q }) });
        if (r.ok) ids = (await r.json()).accepted || [];
      }
      if (dx.length) {
        const r = await dxPost({ action: "events", events: dx });
        if (r.status === 200) {
          ids = ids.concat(r.body.accepted || []);
          /* Refused for good (not a dropped signal): stop resending, and say why. */
          for (const x of r.body.rejected || []) if ([400, 403, 404, 409].includes(x.code)) { ids.push(x.id); toast("No se registró: " + x.error); }
        }
      }
    } else {
      /* Demo: there is no server record; a round trip to this site stands in for one. */
      const r = await fetch("/assets/agent/agent-core.js?sync=" + Date.now(), { method: "HEAD", cache: "no-store" });
      if (r.ok) ids = pending.map((e) => e.id);
    }
    if (ids.length) { C.markSynced(S.day, ids, nowIso()); saveDay(S.day, S.key); }
  } catch { /* still no signal: they wait */ }
  S.syncing = false; paintSync();
}

/* ---------------- render ---------------- */
function render() {
  const app = $("#app");
  $("#tabs").hidden = S.mode === "gate" || S.view === "in" || S.view === "focus" || S.view === "summary" || S.view === "bundle";
  $("#whoTop").textContent = S.agentId && S.day && me() ? me().name : "";
  $("#menuBtn").hidden = S.mode !== "live";
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  if (S.mode === "gate") app.innerHTML = viewGate();
  else if (S.view === "in") app.innerHTML = viewIn();
  else if (S.view === "focus") app.innerHTML = viewFocus();
  else if (S.view === "summary") app.innerHTML = viewSummary();
  else if (S.view === "bundle") app.innerHTML = viewBundle();
  else if (S.tab === "pagos") app.innerHTML = viewPagos();
  else if (S.tab === "midia") app.innerHTML = viewMiDia();
  else if (S.tab === "chat") app.innerHTML = viewChat();
  else if (S.tab === "buscar") app.innerHTML = viewSearch();
  else app.innerHTML = viewHome();
  if ((S.view !== "focus" && S.view !== "bundle") || S.mode === "gate") $("#layer .dock")?.remove();
  if (S.mode === "demo") app.insertAdjacentHTML("afterbegin", `<div class="demo-banner" id="demoBanner"><b>MODO DEMO</b> · pedidos de muestra. No estás en línea y nada de esto es real.</div>`);
  paintSync();
  paintLine();
  wire();
}

function loginForm() {

    <label class="field"><span>Correo</span><input name="email" type="email" autocomplete="username" required></label>

}

    <h1>Buenos días${S.agentId && me() ? ", " + esc(me().name) : ""}</h1>

  </section>
  ${pick ? `<div class="who-pick" role="group" aria-label="Quién eres">

  <button class="btn big primary" id="clockIn" ${S.agentId ? "" : "disabled"}>Marcar entrada y empezar</button>
  ${shift && shift.clockIn ? `<div style="text-align:center"><span class="stamp">Entrada marcada a las ${hhmm(shift.clockIn)}</span></div>` : ""}
  ${pick ? `<p class="tiny" style="text-align:center;margin-top:18px">Modo demo (solo en vista previa): pedidos de muestra con productos reales del catálogo y clientes ficticios. Nada se compra de verdad.</p>
  <div class="divider">¿Eres compradora invitada?</div>${loginForm()}` : ""}`;
}

function shiftBar() {
  const s = S.day.shifts[S.agentId] || {};

  return `<div class="shift">
    <div class="clock">${hm(mins)}<small>Entrada ${hhmm(s.clockIn)}</small></div>
    <div class="breaks">
      <button class="btn small ghost" data-break="bano">${ICON.pause} Baño</button>
      <button class="btn small ghost" data-break="almuerzo">${ICON.pause} Almuerzo</button>
    </div>
  </div>`;
}
function pausedCard() {
  const s = S.day.shifts[S.agentId];
  if (!s || !s.onBreak) return "";
  return `<div class="paused"><h2>En pausa: ${esc(s.onBreak.label)}</h2><p style="margin:0 0 14px">Desde las ${hhmm(s.onBreak.start)}. Tu reloj y tu lista están detenidos.</p>
    <button class="btn big primary" id="endBreak">Volver al trabajo</button></div>`;
}
function strip() {
  const d = C.miDia(S.day, S.agentId);
  return `<div class="card strip"><div class="num">${d.done}<span class="muted" style="font-size:18px"> / ${d.total}</span></div>
    <div style="flex:1"><div class="tiny" style="margin-bottom:6px">Mi día · ${d.pct}% comprado</div><div class="bar"><i style="width:${d.pct}%"></i></div></div></div>`;
}
const isPending = (orderId) => C.pendingEvents(S.day).some((e) => e.orderId === orderId);

function viewHome() {
  const s = S.day.shifts[S.agentId];
  if (s && s.onBreak) return shiftBar() + pausedCard() + (S.mode === "live" ? dxSection() : "");

  }
  return viewHomePhase1();
}
function viewHomePhase1() {
  const s = S.day.shifts[S.agentId];
  const groups = C.porComprarByStore(S.day, S.agentId);
  const bought = C.compradas(S.day, S.agentId);
  const pend = groups.reduce((n, g) => n + g.orders.length, 0);
  const acc = (id) => (S.day.accounts.find((a) => a.id === id) || {}).label || "";

    <section class="store">

        <div class="acts"><button class="btn small ghost" data-notes="${esc(g.store)}" aria-label="Notas de la tienda">${ICON.note}</button>
        <button class="btn small ghost" data-flag="${esc(g.store)}" aria-label="Reportar tienda">${ICON.flag}</button></div></div>
      ${g.orders.map((o) => `<button class="row" data-open="${esc(o.orderId)}">
        <img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">
        <div><div class="t">${esc(o.title)}</div><div class="s">Talla ${esc(o.selectedSize || "no aplica")}${o.color ? " · " + esc(o.color) : ""}</div><div class="s">Hasta ${esc(C.dual(o.ceilingUsd, venta()))}</div><div class="tiny">${esc(acc(o.accountId))}</div></div>
        <span class="go">${ICON.arrow}</span></button>`).join("")}
    </section>`).join("")
    : `<div class="empty card"><strong>No te queda nada por comprar</strong>Todo lo de hoy ya está en Compradas.</div>
       <button class="btn big ghost" id="endShift" style="margin-top:12px">Terminar turno</button>`;
  const comp = bought.length ? bought.map((o) => `<div class="row bought${o.orderId === S.justBought ? " flash" : ""}">
      <img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">
      <div><div class="t">${esc(o.title)}</div><div class="s">${esc(o.storeLabel)} · pedido ${esc(o.retailerOrderNumber)}</div><div class="tiny">${esc(C.dual(o.chargedTotalUsd, venta()))} · comprada a las ${hhmm(o.boughtAt)}</div>${isPending(o.orderId) ? '<div class="pend">Por sincronizar</div>' : ""}</div>
      <span class="tick">${ICON.check}</span></div>`).join("")
    : `<div class="empty card"><strong>Aquí van tus compras</strong>Cada pedido que compres pasa de Por comprar a esta lista.</div>`;
  return (S.mode === "live" ? "" : shiftBar()) + strip() + `
    <div class="seg" role="tablist">
      <button role="tab" data-list="por" aria-selected="${S.list === "por"}">Por comprar<span class="n">${pend}</span></button>
      <button role="tab" data-list="comp" aria-selected="${S.list === "comp"}">Compradas<span class="n">${bought.length}</span></button>
    </div>

}

/* The order card's state decides its ONE primary action (in the dock):
   comprar -> tarjeta -> registrar. Everything else on the card is secondary. */
function stageOf(o) {
  if (!(S.checks[o.orderId] || {}).abri) return "comprar";
  if (!S.day.cards[o.orderId]) return "tarjeta";
  return "registrar";
}

function viewFocus() {
  const o = S.day.orders.find((x) => x.orderId === S.focusId);
  if (!o || o.status !== "por_comprar" || o.assignedTo !== S.agentId) { S.view = "home"; return viewHome(); }
  const link = C.buyLink(o);
  const steps = C.checklistFor(o);
  const checks = S.checks[o.orderId] || {};
  const left = C.porComprar(S.day, S.agentId).length;
  const stage = stageOf(o);
  const order = ["comprar", "tarjeta", "registrar"], si = order.indexOf(stage);
  const html = `<div class="focus slide-in">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <button class="btn small ghost" id="back">${ICON.back} Lista</button>
      <span class="tiny" style="margin-left:auto">Quedan ${left} · ${esc(o.orderId)}</span>
    </div>
    <div class="steps" aria-label="Paso">${["1 Comprar", "2 Tarjeta", "3 Registrar"].map((t, i) => `<span class="${i < si ? "done" : i === si ? "now" : ""}">${t}</span>`).join("")}</div>
    <img class="photo" src="${esc(o.image)}" alt="${esc(o.title)}" referrerpolicy="no-referrer">
    <h1>${esc(o.title)}</h1>
    <div class="meta"><span class="pill">${esc(o.storeLabel)}</span>${o.brand && o.brand !== o.storeLabel ? `<span class="pill">${esc(o.brand)}</span>` : ""}<span class="pill">Cantidad ${o.qty}</span></div>
    <div class="variant">
      <div><b>Talla</b><span>${esc(o.selectedSize || "No aplica")}</span></div>
      <div class="${o.color ? "" : "nocolor"}"><b>Color</b><span>${o.color ? esc(o.color) : "El de la foto, exacto"}</span></div>
    </div>
    <div class="rule"><strong>SIN SUSTITUTOS</strong>Si no está exacto (modelo, color, talla), no compres otro parecido. Usa Problema.</div>
    ${link.pinned ? "" : `<div class="ojo">Ojo con este modelo: la tienda no fija color ni talla desde el link. Compara la foto, el nombre, el color y la talla antes de agregar al carrito.</div>`}
    <div class="ceiling" id="ceiling">${esc(C.ceilingSentence(o.ceilingUsd, venta()))}</div>
    <p class="fxnote">${S.fx ? `Soles al tipo de cambio ${esc(S.fx.origen || "SUNAT")} venta ${Number(S.fx.venta).toFixed(3)}${S.fx.fecha ? " del " + esc(S.fx.fecha) : ""}.` : "Tipo de cambio no disponible ahora: los soles no se muestran."}</p>
    <section class="card almacen" aria-label="Almacén">
      <h2>ALMACEN · ENVIAR A</h2>
      <pre id="almacenText">${esc(C.almacenBlock(o.customerName))}</pre>
      <button class="btn big ghost" id="copyAlmacen">${ICON.copy} Copiar dirección</button>
    </section>
    ${stage !== "comprar" && link.href ? `<a class="btn big ghost" href="${esc(link.href)}" target="_blank" rel="noopener noreferrer">${ICON.ext} Abrir la tienda otra vez</a>` : ""}
    <ol class="checklist">
      ${steps.map((st, i) => `<li><label class="${checks[st.id] ? "done" : ""}"><input type="checkbox" data-step="${st.id}" ${checks[st.id] ? "checked" : ""}> ${i + 1}. ${esc(st.label)}</label></li>`).join("")}
    </ol>
    ${stage === "registrar" ? `<button class="btn big ghost" id="showCard">${ICON.card} Tarjeta Aria</button>` : ""}
    <section class="card comments">
      <h2>Notas de este pedido</h2>
      ${(o.comments || []).map((m) => `<div class="msg"><b>${esc(nameOf(m.by))} · ${hhmm(m.at)}</b><div>${esc(m.text)}</div></div>`).join("") || `<p class="tiny" style="margin:0 0 8px">Nada todavía. Lo que escribas queda guardado con el pedido.</p>`}
      <form class="inline" id="commentForm"><input name="t" placeholder="Escribe una nota" maxlength="500" aria-label="Nota del pedido"><button class="btn small ghost">Guardar</button></form>
    </section>
  </div>`;
  setTimeout(() => dock(o, stage, link), 0);
  return html;
}
function nameOf(id) { if (id === "admin") return "Danny"; const a = S.day.agents.find((x) => x.id === id); return a ? a.name : "Equipo"; }

function dock(o, stage, link) {
  let d = $("#layer .dock");
  if (!d) { d = document.createElement("div"); d.className = "dock"; $("#layer").appendChild(d); }
  const primary = stage === "comprar"
    ? `<a class="btn gold primary-act" id="comprar" href="${esc(link.href)}" target="_blank" rel="noopener noreferrer">COMPRAR ${ICON.ext}</a>`
    : stage === "tarjeta"
      ? `<button class="btn primary primary-act" id="primaryCard">${ICON.card} Mostrar tarjeta</button>`
      : `<button class="btn ok primary-act" id="done">${ICON.done} Ya pagué</button>`;
  d.innerHTML = `<button class="btn second-bad" id="problem">${ICON.alert} Problema</button>${link.href || stage !== "comprar" ? primary : `<button class="btn ok primary-act" id="done">${ICON.done} Ya pagué</button>`}`;
  $("#problem").onclick = () => problemSheet(o);
  const cp = $("#comprar"); if (cp) cp.addEventListener("click", () => { (S.checks[o.orderId] ||= {}).abri = true; setTimeout(render, 60); });
  const pc = $("#primaryCard"); if (pc) pc.onclick = () => cardSheet(o);
  const dn = $("#done"); if (dn) dn.onclick = () => completeSheet(o);
}

function earningsCard(e) {
  return `<div class="card wide earn"><span class="muted">Ganancia de hoy</span><b>${e.totalPen == null ? "Por definir" : C.pen(e.totalPen)}</b><span class="tiny">${esc(e.rateText)}${e.totalPen == null ? "" : ` × ${e.bought} compras`}</span></div>`;
}

function viewMiDia() {
  const d = C.miDia(S.day, S.agentId);
  const e = C.earnings(S.day, S.agentId);
  const mins = C.workedMinutes(S.day, S.agentId, nowIso());
  const s = S.day.shifts[S.agentId] || { breaks: [] };
  const r = 84, circ = 2 * Math.PI * r, off = circ * (1 - d.pct / 100);
  const earned = new Set((S.day.log || []).filter((l) => l.by === S.agentId && l.what.startsWith("hito:")).map((l) => l.what.slice(5)));
  const shapes = [
    (c) => `<circle cx="32" cy="32" r="26" fill="${c}"/>`,
    (c) => `<path d="M32 6l7.6 15.4 17 2.5-12.3 12 2.9 16.9L32 44.8l-15.2 8 2.9-16.9-12.3-12 17-2.5z" fill="${c}"/>`,
    (c) => `<path d="M32 6a26 26 0 1 0 0 52V6z" fill="${c}"/><circle cx="32" cy="32" r="26" fill="none" stroke="${c}" stroke-width="4"/>`,
    (c) => `<path d="M32 4l28 28-28 28L4 32z" fill="${c}"/>`,
    (c) => `<path d="M10 52V12h44v40z" fill="${c}"/><path d="M20 32l8 8 16-16" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
  ];
  const palette = ["#2F5FEE", "#F4C463", "#0E7A4D", "#0A1F44", "#B3261E"];
  return `<h1 style="margin:4px 0 0;font-size:26px">Mi día</h1>
    <div class="ring-wrap"><svg width="210" height="210" viewBox="0 0 210 210" aria-hidden="true">
      <circle cx="105" cy="105" r="${r}" fill="none" stroke="var(--sky)" stroke-width="20"/>
      <circle cx="105" cy="105" r="${r}" fill="none" stroke="url(#g)" stroke-width="20" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}" transform="rotate(-90 105 105)"/>
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2F5FEE"/><stop offset="1" stop-color="#F4C463"/></linearGradient></defs></svg>
      <div class="c"><b>${d.done}</b><span class="muted">de ${d.total} compradas</span></div></div>
    <p style="text-align:center;font-weight:800;font-size:18px;margin:4px 0 0">${d.left === 0 && d.total ? "Lista completa. Gran trabajo." : d.pct >= 50 ? "Ya pasaste la mitad." : d.done ? "Vas avanzando muy bien." : "Tu primera compra te espera."}</p>
    <div class="stats">
      <div class="card"><b>${d.done}</b><span class="muted">compradas</span></div>
      <div class="card"><b>${d.sentToLead}</b><span class="muted">excepciones enviadas</span></div>
      ${earningsCard(e)}
      <div class="card"><b>${d.left}</b><span class="muted">por comprar</span></div>
      <div class="card"><b>${hm(mins).replace(" min", "")}</b><span class="muted">trabajadas</span></div>
    </div>
    <h2 style="font-size:18px;margin:18px 0 6px">Tus hitos de hoy</h2>
    <div class="badges">${C.MILESTONES.map((m, i) => `<div class="badge${earned.has(m.id) ? " got" : ""}"><svg viewBox="0 0 64 64">${shapes[i % 5](earned.has(m.id) ? palette[i % 5] : "var(--line)")}</svg>${esc(m.title.replace(/[¡!]/g, ""))}</div>`).join("")}</div>
    <p class="tiny">Pausas hoy: ${(s.breaks || []).length}. Tu historial cuenta para comisiones y bonos.</p>
    <button class="btn big ghost" id="endShift" style="margin-top:8px">Terminar turno</button>`;
}

function viewChat() {

/* ---------------- sheets ---------------- */
function sheet(html, onMount) {
  const back = document.createElement("div");
  back.className = "sheet-back";
  back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  back.addEventListener("click", (e) => { if (e.target === back) close(); });
  const close = () => { back.remove(); if (S.timer) { clearInterval(S.timer); S.timer = null; } };
  $("#layer").appendChild(back);
  onMount && onMount(back.firstElementChild, close);
  return close;
}

function problemSheet(o) {
  sheet(`<h2>¿Qué pasó?</h2><p class="muted" style="margin:0">Elige uno. El pedido se va a la cola de Danny con el motivo y tú sigues con el siguiente.</p>

function celebrate(m, count) {
  document.querySelectorAll(".party").forEach((p) => p.remove());

    bits += `<i class="confetti" style="left:${(i * 37) % 100}%;background:${colors[i % colors.length]};animation-duration:${2.2 + (i % 7) * 0.35}s;animation-delay:${(i % 10) * 0.08}s;${round ? "border-radius:999px;width:12px;height:12px" : ""}"></i>`;
  }
  p.innerHTML = bits + `<div class="msg2 burst">
    ${m.at ? `<div class="count">${count}</div>` : `<svg width="110" height="110" viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="50" fill="#F4C463"/><path d="M33 57l15 15 30-32" stroke="#0A1F44" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
    <h2>${esc(m.title)}</h2><p>${esc(m.line)}</p></div>`;
  document.body.appendChild(p);
  setTimeout(() => p.isConnected && p.remove(), 3400);

/* After a purchase or a problem: straight to the NEXT order, no trip to the list. */
function goNext(next) {

/* ================= PHASE 2: LIVE DISPATCH =================
   Short polling (there is no websocket): every few seconds while she is
   clocked in. The poll carries her presence; the server decides whether
   she is pinged (online, not on a break, not in focus mode, store
   accounts with cap left). No signal: polls are skipped, her claimed
   orders stay on the phone, completions wait in the same outbox. */
const DX = { data: null, mine: [], ledger: null, cfg: null, me: null, popup: null, popTimer: null, timer: null, inflight: false, bundleId: null, ck: 0, sandbox: false, cardMode: null, cardTick: null, boardTaken: {} };
const DISPATCH_TYPES = new Set(["checkout_comprado", "checkout_excepcion"]);
const PENDING = D.CHECKOUT.PENDING;
function dxPresence() {
  const s = (S.day && S.day.shifts[S.agentId]) || {};
  return { clockedIn: Boolean(s.clockIn), clockedOut: Boolean(s.clockOut), online: isOnline(), onBreak: s.onBreak ? s.onBreak.kind : null, focus: S.view === "bundle" || S.view === "focus" };
}
async function dxPost(payload) {
  const r = await fetch("/.netlify/functions/agent-dispatch", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  return { status: r.status, body: await r.json().catch(() => ({})) };
}
function startDispatch() {
  if (S.mode !== "live" || DX.timer) return;
  dxPoll();
  DX.timer = setInterval(dxPoll, ((DX.cfg && DX.cfg.pollSeconds) || 4) * 1000);
}
async function dxPoll() {
  if (S.mode !== "live" || DX.inflight || navigator.onLine === false || !S.day) return;
  DX.inflight = true;
  try {
    const r = await dxPost({ action: "poll", ...dxPresence(), watching: DX.popup ? DX.popup.orderId : null });
    if (r.status === 200) { DX.off = null; DX.lastOkAt = Date.now(); S.day.lastBeatAt = nowIso(); dxApply(r.body); }
    else if (r.status === 503 && r.body.off) { DX.off = r.body.error; DX.lastOkAt = Date.now(); S.day.lastBeatAt = nowIso(); saveDay(S.day, S.key); softRender(); }
  } catch { /* weak signal: next poll */ } finally { DX.inflight = false; paintLine(); }
}
/* Local moves not yet synced win over the server's older picture: the
   outbox's dispatch events are replayed onto what the server sent, with
   the same rules the server will apply when they arrive. */
function replayPending(bundle) {
  const pend = C.pendingEvents(S.day).filter((e) => DISPATCH_TYPES.has(e.type) && e.orderId === bundle.orderId);
  if (!pend.length) return bundle;
  const me = DX.me || S.agentId, cfg = DX.cfg || D.dispatchConfig();
  const probe = { state: "CLAIMED", claimedBy: me, packet: structuredClone(bundle.packet), history: [], stateAt: {} };
  for (const e of pend) {
    const c = probe.packet.checkouts.find((x) => x.id === e.checkoutId);
    if (!c || c.state !== PENDING) continue;
    try {
      if (e.type === "checkout_comprado") D.checkoutBought(probe, e.checkoutId, me, e.data || {}, e.at, cfg);
      else D.checkoutException(probe, e.checkoutId, me, (e.data || {}).reason, e.at, (e.data || {}).note);
    } catch { /* the server will say why */ }
  }
  return { ...bundle, packet: probe.packet };
}
function mergeMine(server) {
  return (server || []).map(replayPending);
}
const bundleById = (id) => DX.mine.find((x) => x.orderId === id);
function dxApply(b) {
  DX.data = b; DX.cfg = b.config; DX.sandbox = b.sandbox; DX.cardMode = b.cardMode; DX.ledger = b.ledger; DX.me = b.me || DX.me;
  DX.mine = mergeMine(b.mine);
  Object.assign(S.day, { dispatchMine: DX.mine, dispatchLedger: b.ledger, dispatchCfg: b.config });
  saveDay(S.day, S.key);
  if (DX.popup) {
    const w = b.watch;
    if (w && w.orderId === DX.popup.orderId && (w.takenByOther || (w.state && w.state !== "CLAIMABLE" && !w.mine))) popupTaken();
  } else if (b.ping && isOnline() && !$(".sheet-back")) showPopup(b.ping);
  softRender();
}
/* Re-paint what the poll changed without wiping what she is typing. */
function softRender() {
  if (S.view !== "home" || $(".sheet-back")) return;
  if (S.tab === "lista") { const el = $("#dxSection"); if (el) { const tmp = document.createElement("div"); tmp.innerHTML = dxSection(); if (tmp.firstElementChild.outerHTML !== el.outerHTML) { el.replaceWith(tmp.firstElementChild); wireDispatch(); } } }
  else if (S.tab === "pagos" && !(document.activeElement && document.activeElement.matches("input"))) render();
}

/* ---------- online / offline (the Uber-style control) ---------- */
function isOnline() {
  const s = (S.day && S.day.shifts[S.agentId]) || {};
  return S.mode === "live" && Boolean(S.day.dispatchOnline) && Boolean(s.clockIn) && !s.clockOut;
}
const dxOpen = () => DX.mine.filter((b) => b.packet.checkouts.some((c) => c.state === PENDING));
/* The header says, at all times, whether pedidos can reach her. */
function paintLine() {
  const tag = $("#lineTag");
  if (S.mode !== "live" || S.view === "summary") { tag.hidden = true; return; }
  const s = S.day.shifts[S.agentId] || {};
  /* No answer from the server for longer than it keeps her presence: it already
     treats her as unreachable, so the header says so instead of EN LÍNEA. */
  const lapsed = isOnline() && (navigator.onLine === false || (DX.lastOkAt && Date.now() - DX.lastOkAt > ((DX.cfg && DX.cfg.presenceTtlSeconds) || 20) * 1000));
  const [cls, text] = !isOnline() ? ["off", "FUERA DE LÍNEA"] : lapsed ? ["off", "SIN SEÑAL"] : s.onBreak ? ["pause", "EN PAUSA"] : ["on", "EN LÍNEA"];
  tag.hidden = false; tag.className = "line-tag " + cls; tag.dataset.state = cls;
  tag.innerHTML = `<i></i>${text}`;
}
function viewOffline() {
  const s = S.day.shifts[S.agentId] || {};
  const open = dxOpen();
  return `<section class="offline-hero" id="offlineHero">
      <div class="dot"><i></i></div>
      <h1>Estás fuera de línea</h1>
      <p>${s.clockIn ? `Tu turno sigue abierto desde las ${hhmm(s.clockIn)}. ` : S.healedAt ? `Tu sesión anterior se cerró sola a las ${hhmm(S.healedAt)} (la app estuvo cerrada). ` : ""}Ponte en línea para recibir pedidos.</p>
    </section>
    <button class="btn big golive" id="goOnline">Ponerse en línea</button>
    ${open.length ? `<h2 style="font-size:18px;margin:18px 0 8px">Tus pedidos tomados</h2>${open.map(bundleCard).join("")}` : ""}
    ${s.clockIn ? `<button class="btn big ghost" id="endShift" style="margin-top:12px">Terminar turno</button>` : ""}`;
}
async function goOnline() {
  if (S.day.shifts[S.agentId] && S.day.shifts[S.agentId].clockOut) retireShift();
  const s = S.day.shifts[S.agentId];
  if (!s || !s.clockIn) { C.clockIn(S.day, S.agentId, nowIso()); rememberSession({ mode: S.mode, key: S.key, agentId: S.agentId }); warmPhotos(); }
  S.day.dispatchOnline = true; save();
  S.view = "home"; S.tab = "lista"; render(); window.scrollTo(0, 0);
  toast("Estás en línea");
  startDispatch(); dxPoll();
}
function goOffline() {
  S.day.dispatchOnline = false; save();
  closePopup(); render(); dxPoll();
  toast("Fuera de línea. Tu turno sigue abierto.");
}
function bundleCard(b) {
  const cs = b.packet.checkouts, n = cs.filter((c) => c.state !== PENDING).length;
  return `<div class="card bundle-card"><h3>Pedido de ${esc(b.customerName)}</h3>
    <div class="tiny">${n} de ${cs.length} ${cs.length === 1 ? "compra" : "compras"} hechas · ${esc(D.payText(cs.reduce((t, c) => t + D.checkoutPay(c, DX.cfg || D.dispatchConfig()), 0)))}</div>
    <div class="chips">${cs.map((c) => `<span class="pill ${c.state === "BOUGHT" ? "ok" : c.state === "EXCEPTION" ? "bad" : ""}">${esc(c.storeLabel)}</span>`).join("")}</div>
    ${cs.some((c) => c.state === PENDING) ? `<button class="btn big primary" data-bundle="${esc(b.orderId)}">Abrir el pedido ${ICON.arrow}</button>` : ""}</div>`;
}
/* Home while live: an order in progress takes over; otherwise the
   waiting state IS the screen. No sample list, ever, for a real agent. */
function dxSection() {
  const s = S.day.shifts[S.agentId] || {};
  if (DX.off) return `<section id="dxSection"><div class="card dx-status off" id="dxOff"><i></i><span>${esc(DX.off)}</span></div></section>`;

    : av && av.ok ? "Recibiendo pedidos" : av && av.reason === "enfocada" ? "Comprando: no te llegan pedidos nuevos" : "No estás recibiendo pedidos";
  const waiting = s.onBreak ? "" : `<div class="card wait-hero" id="waitHero"><div class="radar" aria-hidden="true"><i></i><i></i><b></b></div>
      <span class="on-word">EN LÍNEA</span><h2>Esperando pedidos…</h2><p id="waitLine">${esc(line)}. Cuando entre uno, aparece aquí con su tiempo para aceptarlo.</p>

  const bd = isOnline() && DX.data && DX.data.board ? DX.data.board : null;

    ${bd ? boardHead(bd) : ""}
