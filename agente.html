    ${bd ? boardList(bd) : ""}
    ${!open.length && isOnline() ? waiting : ""}
    ${isOnline() ? `<button class="btn big ghost" id="goOffline">Ponerse fuera de línea</button>` : `<button class="btn big golive" id="goOnline">Ponerse en línea</button>`}
    ${done.length ? `<h2 style="font-size:16px;margin:16px 0 8px;color:var(--ink-2)">Terminados hoy</h2>${done.map(bundleCard).join("")}` : ""}
  </section>`;
}

/* ---------- the board: compras que todavía hay que hacer ----------
   Orders nobody took in the ring, or that came in while nobody was online.
   Nobody is assigned: every online buyer sees the same list, oldest first,
   with the pop-up's decision layer and how long each has waited. «Tomar»
   is the same first claim as ACEPTAR. It is the FIRST thing on screen when
   she goes online; live pings still arrive as the pop-up. */
function boardHead(bd) {
  return `<div class="board-head${bd.count ? "" : " empty"}" id="boardHead" data-count="${bd.count}"><span class="n" id="boardCount">${bd.count}</span>
    <div><h2 id="boardLine">${esc(bd.headline)}</h2><p>${bd.count ? "Compras que todavía hay que hacer. Sin asignar: la primera que toque «Tomar» se la lleva." : "Compras que todavía hay que hacer: ninguna ahora."}</p></div></div>`;
}
function boardList(bd) {
  const now = Date.now();
  for (const [id, t] of Object.entries(DX.boardTaken)) if (t.until <= now) delete DX.boardTaken[id];
  const live = bd.orders.filter((o) => !DX.boardTaken[o.orderId]);
  /* A card she lost keeps «Otra compradora lo tomó» for a moment, in its place in the list. */
  const taken = Object.values(DX.boardTaken).map((t) => ({ ...t.model, _taken: t.text }));
  const list = [...live, ...taken].sort((a, b) => String(a.paidAt).localeCompare(String(b.paidAt)));
  if (!list.length) return "";
  return `<div id="boardList">${list.map(boardCard).join("")}</div>`;
}
function boardCard(o) {
  const el = o.eligible || {};
  const cls = o._taken ? " taken" : el.ok ? "" : " off";
  const foot = o._taken ? `<div class="taken-msg" data-taken>${esc(o._taken)}</div>`
    : el.ok ? `<button class="btn big ok" data-grab="${esc(o.orderId)}">Tomar</button>`
      : `<div class="bc-why" data-why>${esc(el.label)}</div><button class="btn big ghost" disabled>Tomar</button>`;
  return `<div class="card bcard${cls}" data-board="${esc(o.orderId)}">
    <div class="bc-top"><span class="bc-wait" data-wait>${esc(o.waitingText)}</span>${o.sandbox || DX.sandbox ? '<span class="sb">SANDBOX</span>' : ""}</div>
    <div class="bc-body"><h3 data-head>${esc(o.header)}</h3>
      <div class="ring-pay"><b data-pay>${esc(o.headline)}</b><span data-sub>${esc(o.sub)}</span></div>
      <div class="chips">${o.stores.map((s) => `<span class="pill">${esc(s)}</span>`).join("")}</div>
      ${o.photos.length ? `<div class="strip-photos">${o.photos.map((u) => `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer">`).join("")}</div>` : ""}
      <div class="ring-total"><span class="tiny">${esc(o.itemText)} · total a comprar</span><b data-total>${esc(C.dual(o.totalUsd, venta()))}</b></div></div>
    ${foot}
  </div>`;
}
async function grabBoard(orderId) {
  const bd = DX.data && DX.data.board;
  const model = bd && bd.orders.find((o) => o.orderId === orderId);
  if (!model) return;
  document.querySelectorAll(`[data-grab="${CSS.escape(orderId)}"]`).forEach((b) => b.disabled = true);
  const dropFromBoard = () => {
    bd.orders = bd.orders.filter((o) => o.orderId !== orderId);
    bd.count = bd.orders.length; bd.headline = D.boardHeadline(bd.count);
  };
  try {
    const r = await dxPost({ action: "grab", orderId });
    if (r.status === 200) {
      dropFromBoard();
      DX.mine = [r.body.order, ...DX.mine.filter((b) => b.orderId !== orderId)];
      S.day.dispatchMine = DX.mine; save();
      toast("Es tuyo: " + model.header);
      render(); dxPoll();
    } else if (r.body.taken) {
      dropFromBoard();
      DX.boardTaken[orderId] = { text: D.BOARD_TAKEN_TEXT, until: Date.now() + 4000, model };
      render();
      setTimeout(() => { if (S.view === "home") render(); }, 4100);
    } else { toast(r.body.error || "No se pudo tomar"); dxPoll(); }
  } catch { toast("Sin señal: no se pudo tomar"); render(); }
}

/* ---------- the pop-up ---------- */
function showPopup(p) {
  closePopup();
  if (navigator.vibrate) try { navigator.vibrate([180, 80, 180]); } catch { /* not allowed */ }
  DX.popup = { ...p, endsAt: Date.now() + p.secondsLeft * 1000, total: Math.max(1, p.secondsLeft) };
  const el = document.createElement("div");
  el.className = "ring-back"; el.id = "ringPop";
  el.innerHTML = `<div class="ring" role="alertdialog" aria-modal="true" aria-labelledby="ringH" data-order="${esc(p.orderId)}">
    <div class="ring-top"><span class="ring-live"><i></i>Pedido nuevo</span>${p.sandbox || DX.sandbox ? '<span class="sb">SANDBOX</span>' : ""}<span class="ring-count" id="ringCount" aria-label="segundos">${p.secondsLeft}</span></div>
    <h2 id="ringH">${esc(p.header)}</h2>
    <div class="ring-pay"><b id="ringPay">${esc(p.headline)}</b><span id="ringSub">${esc(p.sub)}</span></div>
    <div class="chips">${p.stores.map((s) => `<span class="pill">${esc(s)}</span>`).join("")}</div>
    <div class="strip-photos">${p.photos.map((u) => `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer">`).join("")}</div>
    <div class="ring-total"><span class="tiny">${esc(p.itemText)} · total a comprar</span><b id="ringTotal">${esc(C.dual(p.totalUsd, venta()))}</b></div>
    <div class="ring-bar"><i id="ringBar" style="width:100%"></i></div>
    <div class="ring-acts" id="ringActs"><button class="btn big ghost" id="ringPass">Pasar</button><button class="btn big ok" id="ringAccept">ACEPTAR</button></div>
  </div>`;
  document.body.appendChild(el);
  el.querySelector("#ringAccept").onclick = acceptPopup;
  el.querySelector("#ringPass").onclick = passPopup;
  const tick = () => {
    if (!DX.popup) return;
    const left = Math.max(0, Math.ceil((DX.popup.endsAt - Date.now()) / 1000));
    const c = $("#ringCount"), bar = $("#ringBar");
    if (c) c.textContent = left;
    if (bar) bar.style.width = Math.max(0, Math.min(100, (left / DX.popup.total) * 100)) + "%";
    if (left <= 0 && !DX.popup.taken) { closePopup(); toast("Se acabó el tiempo de ese pedido"); }
  };
  DX.popTimer = setInterval(tick, 250);
}
function closePopup() {
  if (DX.popTimer) { clearInterval(DX.popTimer); DX.popTimer = null; }
  DX.popup = null;
  document.querySelectorAll("#ringPop").forEach((x) => x.remove());
}
function popupTaken() {
  if (!DX.popup || DX.popup.taken) return;
  DX.popup.taken = true;
  if (DX.popTimer) { clearInterval(DX.popTimer); DX.popTimer = null; }
  const r = $("#ringPop .ring");
  if (r) { r.classList.add("taken"); $("#ringActs").outerHTML = `<div class="taken-msg" id="ringTaken">Otra compradora lo tomó</div>`; $("#ringCount").textContent = ""; }
  setTimeout(closePopup, 2600);
}
async function acceptPopup() {
  const p = DX.popup; if (!p) return;
  document.querySelectorAll("#ringActs button").forEach((b) => b.disabled = true);
  try {
    const r = await dxPost({ action: "claim", orderId: p.orderId });
    if (r.status === 200) {
      closePopup();
      DX.mine = [r.body.order, ...DX.mine.filter((b) => b.orderId !== p.orderId)];
      S.day.dispatchMine = DX.mine; save();
      toast("Es tuyo: " + p.header);
      openBundle(p.orderId);
    } else if (r.body.taken) popupTaken();
    else { toast(r.body.error || "No se pudo aceptar"); closePopup(); }
  } catch { toast("Sin señal: no se pudo aceptar"); closePopup(); }
}
async function passPopup() {
  const p = DX.popup; if (!p) return;
  closePopup();
  toast("Pasaste este pedido. Queda en tu historial.");
  try { await dxPost({ action: "pass", orderId: p.orderId }); } catch { /* the ring ends anyway */ }
}

/* ---------- a claimed order: one store checkout after another ---------- */
function openBundle(orderId) {
  const b = DX.mine.find((x) => x.orderId === orderId);
  if (!b) return;
  DX.bundleId = orderId;
  const i = b.packet.checkouts.findIndex((c) => c.state === PENDING);
  DX.ck = i < 0 ? 0 : i;
  S.view = "bundle"; render(); window.scrollTo(0, 0);
  dxPoll(); // focus mode: she stops being pinged at once
}
function viewBundle() {
  const b = DX.mine.find((x) => x.orderId === DX.bundleId);
  if (!b) { S.view = "home"; return viewHome(); }
  const cs = b.packet.checkouts;
  const c = cs[Math.min(DX.ck, cs.length - 1)];
  const pv = b.packet.private || {};
  /* ONE packet per store: one row per item, each with its own link, the
     verify step and add-to-cart. One card, one ALMACEN block and one
     registration (with its screenshot) for the whole store checkout. */
  const rowChecks = (i) => S.checks[c.id + "#" + i] || {};
  const inCart = c.items.filter((_, i) => rowChecks(i).carrito).length;
  const items = c.items.map((it, i) => `<div class="card item" data-row="${i}">
      <img src="${esc(it.image || "")}" alt="" referrerpolicy="no-referrer">
      <div><div class="tiny" style="font-weight:900;color:var(--ink-2)">Producto ${i + 1} de ${c.items.length}</div><div class="t">${esc(it.title)}</div>
        <div class="tiny">Talla ${esc(it.selectedSize || "no aplica")} · ${it.color ? "Color " + esc(it.color) : "Color: el de la foto"} · Cantidad ${it.qty}</div>
        <div class="tiny">Hasta ${esc(C.dual(it.ceilingUsd, venta()))}</div></div>
      ${c.state === PENDING ? (it.url ? `<a class="btn gold" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer" data-buy="${esc(c.id)}">Abrir producto ${ICON.ext}</a>` : `<div class="ojo" style="grid-column:1/-1;margin:0">Sin link guardado (${esc(it.linkProblem || "falta")}). Danny lo agrega desde su tablero, o usa Problema: «Link caído».</div>`)
        + `<ul class="checklist" style="grid-column:1/-1;margin:4px 0 0">${[["exacto", "Es el producto exacto (foto, modelo, color, talla)"], ["carrito", "Agregado al carrito"]].map(([k, l]) => `<li><label class="${rowChecks(i)[k] ? "done" : ""}"><input type="checkbox" data-rowcheck="${esc(c.id)}#${i}" data-k="${k}" ${rowChecks(i)[k] ? "checked" : ""}> ${l}</label></li>`).join("")}</ul>` : ""}
    </div>`).join("");
  const doneCard = c.state === "BOUGHT"
    ? `<div class="card" style="padding:14px;background:var(--ok-bg);color:var(--ok);font-weight:800">Comprada: pedido ${esc(c.retailerOrderNumber)} · ${esc(C.dual(c.chargedTotalUsd, venta()))}</div>`
    : c.state === "EXCEPTION" ? `<div class="card" style="padding:14px;background:var(--bad-bg);color:var(--bad);font-weight:800">Enviada a Danny: ${esc(c.reasonLabel)}</div>` : "";
  setTimeout(() => dxDock(b, c), 0);
  return `<div class="focus slide-in">
    <div class="bundle-h"><button class="btn small ghost" id="back">${ICON.back} Lista</button>${b.sandbox || DX.sandbox ? '<span class="sb">SANDBOX</span>' : ""}</div>
    <h1 style="margin:4px 0 2px">Pedido de ${esc(b.customerName)}</h1>
    <div class="tiny">${cs.length} ${cs.length === 1 ? "compra" : "compras"} · ${b.packet.itemCount} ${b.packet.itemCount === 1 ? "artículo" : "artículos"} · ${esc(b.orderId)}</div>
    <div class="cktabs" role="tablist">${cs.map((x, i) => `<button role="tab" data-ck="${i}" aria-selected="${x.id === c.id}" class="${x.state === "BOUGHT" ? "ok" : x.state === "EXCEPTION" ? "bad" : ""}">${i + 1}. ${esc(x.storeLabel)}${x.state === "BOUGHT" ? " · lista" : x.state === "EXCEPTION" ? " · problema" : ""}</button>`).join("")}</div>
    <h2 style="font-size:21px;margin:4px 0 2px">Compra ${c.n} de ${cs.length}: ${esc(c.storeLabel)}</h2>
    <p class="tiny" style="margin:0 0 10px" id="ckSummary">${c.items.length} ${c.items.length === 1 ? "producto" : "productos"} en un solo pedido de la tienda · ${c.state === PENDING ? `${inCart} de ${c.items.length} en el carrito · ` : ""}un solo pago con la tarjeta de esta compra</p>
    ${doneCard}
    ${items}
    ${c.state === PENDING ? `<div class="rule"><strong>SIN SUSTITUTOS</strong>Si no está exacto (modelo, color, talla), no compres otro parecido. Usa Problema.</div>
    <div class="ceiling" id="ceiling">${esc(C.ceilingSentence(c.budgetUsd, venta()))}</div>
    <p class="fxnote">${S.fx ? `Soles al tipo de cambio ${esc(S.fx.origen || "SUNAT")} venta ${Number(S.fx.venta).toFixed(3)}${S.fx.fecha ? " del " + esc(S.fx.fecha) : ""}.` : "Tipo de cambio no disponible ahora: los soles no se muestran."}</p>` : ""}
    <section class="card almacen" aria-label="Almacén"><h2>ALMACEN · ENVIAR A</h2><pre id="almacenText">${esc(b.packet.almacen.join("\n"))}</pre>
      <button class="btn big ghost" id="copyAlmacen">${ICON.copy} Copiar dirección</button></section>
    <section class="card private" aria-label="Datos del cliente"><h2>DATOS DEL CLIENTE · SOLO EN ESTA PANTALLA</h2>
      <dl><dt>Nombre</dt><dd>${esc(b.customerName)}</dd><dt>DNI</dt><dd>${esc(pv.dni || "No registrado")}</dd><dt>Dirección</dt><dd>${esc(pv.address || "No registrada")}</dd><dt>Teléfono</dt><dd>${esc(pv.phone || "No registrado")}</dd></dl></section>
    ${c.state === PENDING ? dxCard(c) : ""}
  </div>`;
}
const cardKey = (c) => "dx:" + c.id;
function dxCard(c) {
  if (c.cardError) return `<div class="errors"><p>La tarjeta de esta compra no se emitió: ${esc(c.cardError)}. Avísale a Danny.</p></div>`;
  if (!c.card) return `<div class="hidden-card" style="margin:12px 0"><strong>Emitiendo la tarjeta de esta compra...</strong></div>`;
  const shown = S.day.cards[cardKey(c)];
  const now = nowIso();
  const head = `<h2 style="font-size:18px;margin:16px 0 8px">Tarjeta Aria de esta compra</h2>`;
  if (!shown) return head + `<button class="btn big primary" data-reveal="${esc(c.id)}">${ICON.card} Mostrar tarjeta</button><p class="tiny">Se muestra una sola vez, por 10 minutos. Monto fijo ${esc(C.dual(c.card.spendLimitUsd, venta()))}, solo en ${esc(c.card.merchant)}.</p>`;
  if (!C.cardVisible(shown, now)) return head + `<div class="hidden-card"><strong style="font-size:19px;display:block;margin-bottom:6px">Tarjeta oculta</strong><span class="muted">Se mostró una sola vez. Si no alcanzaste a pagar, usa Problema: «La tarjeta no pasó».</span></div>`;
  const sec = C.cardSecondsLeft(shown, now);
  return head + `<div class="vcard"><span class="sb">${esc(c.card.mode || DX.cardMode || "SANDBOX")}</span>
      <div style="font-weight:900;letter-spacing:.06em">ARIA <span style="color:var(--gold)">·</span> una compra</div>
      <div class="pan">•••• •••• •••• ${esc(c.card.last4 || "0000")}</div>
      <div class="row2"><div>Vence<b>${esc(c.card.expMonth || "00")}/${esc(String(c.card.expYear || "00").slice(-2))}</b></div><div>Tienda<b>${esc(c.card.merchant)}</b></div></div></div>
    <p class="tiny" style="margin:8px 0 0">${c.card.fake ? "Tarjeta de prueba (sandbox): no es un número real y no cobra." : "El número completo se ve solo en la tarjeta del programa, nunca en esta página."}</p>
    <div class="locks"><div><b>Monto fijo</b><span>${C.usd(c.card.spendLimitUsd)}</span><small>${C.penOf(c.card.spendLimitUsd, venta()) == null ? C.PEN_UNAVAILABLE : C.pen(C.penOf(c.card.spendLimitUsd, venta()))}</small></div><div><b>Solo en</b><span>${esc(c.card.merchant)}</span></div></div>
    <div class="timer"><div><div class="mm" data-hides="${esc(shown.hidesAt)}">${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}</div><div class="tiny">Se oculta sola. Se muestra una sola vez.</div></div></div>`;
}
function dxDock(b, c) {
  let d = $("#layer .dock");
  if (S.view !== "bundle") return;
  if (!d) { d = document.createElement("div"); d.className = "dock"; $("#layer").appendChild(d); }
  if (c.state !== PENDING) {
    const next = b.packet.checkouts.findIndex((x) => x.state === PENDING);
    d.innerHTML = `<button class="btn ghost" id="dxHome">${ICON.back} Lista</button>${next >= 0 ? `<button class="btn primary primary-act" id="dxNext">Siguiente compra ${ICON.arrow}</button>` : `<button class="btn ok primary-act" id="dxHome2">${ICON.done} Pedido terminado</button>`}`;
    const n = $("#dxNext"); if (n) n.onclick = () => { DX.ck = next; render(); window.scrollTo(0, 0); };
    ["#dxHome", "#dxHome2"].forEach((id) => { const x = $(id); if (x) x.onclick = () => { S.view = "home"; S.tab = "lista"; render(); dxPoll(); }; });
    return;
  }
  d.innerHTML = `<button class="btn second-bad" id="problem">${ICON.alert} Problema</button><button class="btn ok primary-act" id="done">${ICON.done} Ya pagué</button>`;
  $("#problem").onclick = () => dxProblemSheet(b, c);
  $("#done").onclick = () => dxCompleteSheet(b, c);
}
function dxAfter(b) {
  if (!b) { S.view = "home"; render(); return; }
  const next = b.packet.checkouts.findIndex((x) => x.state === PENDING);
  if (next >= 0) { DX.ck = next; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  S.view = "home"; S.tab = "lista"; render(); window.scrollTo(0, 0); dxPoll();
}
function dxCompleteSheet(b, c) {
  sheet(`<h2>Registrar compra</h2><p class="muted" style="margin:0">${esc(c.storeLabel)} · Pedido de ${esc(b.customerName)}</p>
    <p class="tiny" style="margin:4px 0 0">Tope de esta compra: ${esc(C.dual(c.budgetUsd, venta()))}</p>
    <form id="cf" novalidate>
      <label class="field"><span>Número de pedido de la tienda</span><input name="num" autocomplete="off"></label>
      <label class="field"><span>Total cobrado (USD)</span><input name="total" inputmode="decimal" placeholder="Ej. ${c.totalUsd.toFixed(2)}"></label>
      <div class="field"><span>Captura de la confirmación</span>
        <label class="btn big ghost shotpick"><input name="shot" type="file" accept="image/*" class="sr"><span id="shotName">Subir captura</span></label></div>
      <div id="cfErr"></div>
      <button class="btn big ok" type="submit">Marcar como comprada</button>
    </form>`, (el, close) => {
    const shotIn = el.querySelector('[name="shot"]');
    shotIn.onchange = () => { const f = shotIn.files && shotIn.files[0]; el.querySelector("#shotName").textContent = f ? "Captura: " + f.name : "Subir captura"; };
    el.querySelector("#cf").onsubmit = (e) => {
      e.preventDefault();
      const f = e.target, file = f.shot.files && f.shot.files[0], now = nowIso();
      const input = { retailerOrderNumber: f.num.value, chargedTotalUsd: f.total.value, screenshot: file ? { name: file.name, size: file.size } : null };
      /* The server's rule, run here first, so the phone never queues what the server would refuse. */
      const me = DX.me || S.agentId;
      const probe = { state: "CLAIMED", claimedBy: me, packet: structuredClone((bundleById(b.orderId) || b).packet), history: [], stateAt: {} };
      try { D.checkoutBought(probe, c.id, me, input, now, DX.cfg || D.dispatchConfig()); }
      catch (err) { el.querySelector("#cfErr").innerHTML = `<div class="errors">${(err.errors || [err.message]).map((x) => `<p>${esc(x)}</p>`).join("")}</div>`; return; }
      C.queueEvent(S.day, { type: "checkout_comprado", orderId: b.orderId, checkoutId: c.id, agentId: S.agentId, at: now, data: input });
      DX.mine = DX.mine.map((x) => (x.orderId === b.orderId ? replayPending(x) : x));
      S.day.dispatchMine = DX.mine; save(); close(); sync();
      toast(`Comprada: ${c.storeLabel}. Ganaste ${D.payText(D.checkoutPay(c, DX.cfg || D.dispatchConfig()))}.`);
      dxAfter(bundleById(b.orderId));
    };
  });
}
function dxProblemSheet(b, c) {
  sheet(`<h2>¿Qué pasó en ${esc(c.storeLabel)}?</h2><p class="muted" style="margin:0">Esta compra se va a Danny con el motivo. Tú sigues con las otras tiendas del pedido.</p>
    <div class="presets">${C.PROBLEM_PRESETS.concat([C.LINK_DOWN]).map((p) => `<button class="btn" data-p="${p.id}">${ICON.alert} ${esc(p.label)}</button>`).join("")}</div>
    <button class="btn big ghost" data-x>Cancelar</button>`, (el, close) => {
    el.querySelector("[data-x]").onclick = close;
    el.querySelectorAll("[data-p]").forEach((btn) => btn.onclick = () => {
      const now = nowIso(), me = DX.me || S.agentId;
      const probe = { state: "CLAIMED", claimedBy: me, packet: structuredClone((bundleById(b.orderId) || b).packet), history: [], stateAt: {} };
      try { D.checkoutException(probe, c.id, me, btn.dataset.p, now); } catch (err) { toast(err.message); return; }
      C.queueEvent(S.day, { type: "checkout_excepcion", orderId: b.orderId, checkoutId: c.id, agentId: S.agentId, at: now, data: { reason: btn.dataset.p } });

      dxAfter(bundleById(b.orderId));

  });
}

        <div id="regErr"></div><button class="btn big primary" type="submit">Guardar</button></form>`}

    ${L.payouts.length ? L.payouts.map((p) => `<div class="card hist"><div><b>${C.pen(p.netPen)} ${p.channel === "cci" ? "a CCI" : "a Yape"}</b><span class="tiny">${esc(String(p.requestedAt).slice(0, 10))} ${hhmm(p.requestedAt)} · retiro ${C.pen(p.grossPen)} · comisión ${C.pen(p.feePen)}${p.kind === "barrido" ? " · semanal" : ""}</span></div>${statusPill(p)}</div>`).join("") : '<p class="tiny">Todavía no retiraste.</p>'}
    <h2 style="font-size:18px;margin:18px 0 8px">Lo que ganaste</h2>
    ${L.earnings.length ? L.earnings.map((e) => `<div class="card hist"><div><b>Pedido de ${esc(e.customerName)}</b><span class="tiny">${esc(e.store)}${e.items ? ` · ${e.items} ${e.items === 1 ? "producto" : "productos"}` : ""} · ${esc(String(e.at).slice(0, 10))} ${hhmm(e.at)}</span></div><b>+ ${esc(C.pen(e.amountPen))}</b></div>`).join("") : '<p class="tiny">Cada compra confirmada suma aquí.</p>'}`;
}

function wireDispatch() {
  const gon = $("#goOnline"); if (gon) gon.onclick = goOnline;
  const goff = $("#goOffline"); if (goff) goff.onclick = goOffline;
  document.querySelectorAll("[data-rowcheck]").forEach((cb) => cb.onchange = () => {
    (S.checks[cb.dataset.rowcheck] ||= {})[cb.dataset.k] = cb.checked;
    if (cb.checked && cb.dataset.k === "carrito") S.checks[cb.dataset.rowcheck].exacto = true;
    render();
  });
  document.querySelectorAll("[data-bundle]").forEach((b) => b.onclick = () => openBundle(b.dataset.bundle));
  document.querySelectorAll("[data-grab]").forEach((b) => b.onclick = () => grabBoard(b.dataset.grab));
  document.querySelectorAll("[data-ck]").forEach((b) => b.onclick = () => { DX.ck = Number(b.dataset.ck); render(); });
  document.querySelectorAll("[data-reveal]").forEach((b) => b.onclick = () => {
    const now = nowIso();
    S.day.cards["dx:" + b.dataset.reveal] = { revealedAt: now, hidesAt: new Date(Date.parse(now) + C.CARD_REVEAL_MS).toISOString(), closedAt: null };
    save(); render();
  });
  const amt = $("#dxAmt");
  if (amt) amt.oninput = () => {
    const L = DX.ledger || S.day.dispatchLedger, cfg = DX.cfg || S.day.dispatchCfg;
    DX.amount = Number(String(amt.value).replace(",", "."));
    const q = D.cashoutQuote(L.ledger, DX.amount, cfg, nowIso());
    $("#dxQuote").outerHTML = quoteHtml(q);
    $("#dxCash").disabled = !q.ok;
  };
  const cf = $("#cashForm");
  if (cf) cf.onsubmit = (e) => {
    e.preventDefault();
    const L = DX.ledger || S.day.dispatchLedger, cfg = DX.cfg || S.day.dispatchCfg;
    const q = D.cashoutQuote(L.ledger, Number(String(cf.amt.value).replace(",", ".")), cfg, nowIso());
    if (!q.ok) return;
    sheet(`<h2>Confirmar retiro</h2>${quoteHtml(q)}<button class="btn big ok" data-go>Confirmar: recibes ${C.pen(q.netPen)}</button><button class="btn big ghost" data-x style="margin-top:8px">Cancelar</button>`, (el, close) => {
      el.querySelector("[data-x]").onclick = close;
      el.querySelector("[data-go]").onclick = async () => {
        el.querySelector("[data-go]").disabled = true;
        try {
          const r = await dxPost({ action: "cashout", amountPen: q.grossPen });
          if (r.status !== 200) { toast(r.body.error || "No se pudo"); close(); return; }
          DX.ledger = r.body.ledger; S.day.dispatchLedger = DX.ledger; DX.amount = null; save(); close();
          toast(`Retiro solicitado: recibes ${C.pen(q.netPen)}`); render();
        } catch { toast("Sin señal: intenta de nuevo"); close(); }
      };
    });
  };
  const rf = $("#regForm");
  if (rf) rf.onsubmit = async (e) => {
    e.preventDefault();
    const v = D.validateRegistration({ yape: rf.yape.value, cci: rf.cci.value });
    if (!v.ok) { $("#regErr").innerHTML = `<div class="errors">${v.errors.map((x) => `<p>${esc(x)}</p>`).join("")}</div>`; return; }
    const r = await dxPost({ action: "register", yape: v.yape, cci: v.cci }).catch(() => null);
    if (!r || r.status !== 200) { toast((r && r.body.error) || "Sin señal"); return; }
    DX.ledger = r.body.ledger; S.day.dispatchLedger = DX.ledger; save(); toast("Guardado"); render();
  };
}
/* The card's ten-minute clock, without re-painting the page every second. */
setInterval(() => {
  document.querySelectorAll("[data-hides]").forEach((el) => {
    const sec = Math.max(0, Math.ceil((Date.parse(el.dataset.hides) - Date.now()) / 1000));
    if (sec <= 0) render(); else el.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  });
}, 1000);

/* ---------------- wiring ---------------- */
function wire() {
  document.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => { S.agentId = b.dataset.pick; render(); });
  const ci = $("#clockIn");
  if (ci) ci.onclick = () => {
    C.clockIn(S.day, S.agentId, nowIso()); save();
    rememberSession({ mode: S.mode, key: S.key, agentId: S.agentId });
    warmPhotos();
    S.view = "home"; toast(`Entrada marcada: ${hhmm(S.day.shifts[S.agentId].clockIn)}`); render();
    startDispatch();
  };
  const lf = $("#login");
  if (lf) lf.onsubmit = async (e) => {
    e.preventDefault();
    const msg = $("#loginMsg"); msg.textContent = "Entrando...";
    try {
      const r = await fetch("/.netlify/functions/auth-login", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ email: lf.email.value, password: lf.password.value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { msg.textContent = j.error || "No se pudo entrar"; return; }
      location.reload();
    } catch { msg.textContent = "Sin conexión con el servidor."; }
  };
  const lo = $("#logout"); if (lo) lo.onclick = async () => { try { await fetch("/.netlify/functions/auth-logout", { method: "POST", credentials: "same-origin" }); } catch {} location.replace("/agente.html"); };
  const so = $("#signOut"); if (so) so.onclick = signOutSheet;
  document.querySelectorAll("[data-break]").forEach((b) => b.onclick = () => { C.startBreak(S.day, S.agentId, b.dataset.break, nowIso()); save(); render(); dxPoll(); });
  const eb = $("#endBreak"); if (eb) eb.onclick = () => { C.endBreak(S.day, S.agentId, nowIso()); save(); toast("De vuelta. Seguimos."); render(); dxPoll(); };
  wireDispatch();
  document.querySelectorAll("[data-list]").forEach((b) => b.onclick = () => { S.list = b.dataset.list; render(); });
  document.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => { S.focusId = b.dataset.open; S.view = "focus"; render(); window.scrollTo(0, 0); });
  const sn = $("#startNext"); if (sn) sn.onclick = () => { const n = C.nextOrder(S.day, S.agentId); if (n) { S.focusId = n.orderId; S.view = "focus"; render(); window.scrollTo(0, 0); } };
  document.querySelectorAll("[data-notes]").forEach((b) => b.onclick = () => storeNotesSheet(b.dataset.notes));
  document.querySelectorAll("[data-flag]").forEach((b) => b.onclick = () => flagSheet(b.dataset.flag));
  const bk = $("#back"); if (bk) bk.onclick = () => { S.view = "home"; render(); };
  const ca = $("#copyAlmacen");
  if (ca) ca.onclick = async () => {
    const text = $("#almacenText").textContent;
    try { await navigator.clipboard.writeText(text); toast("Dirección copiada"); }
    catch { const r = document.createRange(); r.selectNodeContents($("#almacenText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selecciona y copia"); }
  };
  document.querySelectorAll("[data-step]").forEach((c) => c.onchange = () => { (S.checks[S.focusId] ||= {})[c.dataset.step] = c.checked; c.closest("label").classList.toggle("done", c.checked); if (c.dataset.step === "abri") render(); });
  const sc = $("#showCard"); if (sc) sc.onclick = () => cardSheet(S.day.orders.find((x) => x.orderId === S.focusId));
  const cf = $("#commentForm"); if (cf) cf.onsubmit = (e) => { e.preventDefault(); if (C.addOrderComment(S.day, S.focusId, S.agentId, e.target.t.value, nowIso())) { save(); render(); } };
  const ch = $("#chatForm"); if (ch) ch.onsubmit = (e) => { e.preventDefault(); if (C.postChat(S.day, S.agentId, e.target.t.value, nowIso())) { save(); render(); } };
  const q = $("#q"); if (q) q.oninput = () => { S.query = q.value; const pos = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  document.querySelectorAll("#endShift").forEach((b) => b.onclick = endShiftSheet);
  const th = $("#toHistory"); if (th) th.onclick = () => { S.query = C.shiftSummary(S.day, S.agentId, nowIso()).searchQuery; S.view = "home"; S.tab = "buscar"; render(); };
}
document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; S.view = "home"; render(); window.scrollTo(0, 0); });
setInterval(() => { if (S.view === "home" && S.tab === "lista" && !$(".sheet-back") && $(".shift .clock")) render(); }, 60000);
/* A test/preview handle -- only where demo mode may run, never on production. */
if (DEMO_OK) window.__compradores = { S, C, D, DX, render, sync, dxPoll, resetDemoDay: () => { S.day = resetDemoDay(); S.agentId = null; S.view = "in"; render(); } };
$("#menuBtn").onclick = () => { if (S.mode === "live") menuSheet(); };
/* Closing the tab tells the server at once that she is gone (the heartbeat would lapse anyway). */
window.addEventListener("pagehide", () => {
  if (S.mode !== "live" || !S.agentId) return;
  try { navigator.sendBeacon("/.netlify/functions/agent-dispatch", new Blob([JSON.stringify({ action: "leave" })], { type: "application/json" })); } catch { /* best effort */ }
});
boot();
</script>
