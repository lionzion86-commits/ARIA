<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producto — Aria Shop</title>
<meta name="description" content="Detalle del producto con precio honesto en soles.">
<style>
:root{--navy:#0A1F44;--blue:#2456A0;--gold:#F4C463;--sky:#F2F6FF;--line:#E4E9F2;--ink:#1A2333;--muted:#6B7280;--green:#16A34A;--red:#DC2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.site-header{background:var(--navy);color:#fff}
.util-bar{background:#071633;font-size:12px;padding:7px 20px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.util-bar a{color:#B9C6E4}
.main-nav{display:flex;align-items:center;gap:22px;padding:14px 20px;max-width:1240px;margin:0 auto;width:100%}
.logo{font-weight:800;font-size:20px;color:#fff;letter-spacing:-.02em;white-space:nowrap}
.logo span{color:var(--gold)}
.nav-links{display:flex;gap:18px;font-size:14px;flex-wrap:wrap}
.nav-links a{color:#DCE4F7}
@media(max-width:760px){.nav-links{display:none}}
main{flex:1;width:100%;max-width:900px;margin:0 auto;padding:32px 20px 48px}
.hero{text-align:center;margin:0 0 32px}
.kicker{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin-bottom:12px}
.hero h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.02em;color:var(--navy);margin-bottom:12px}
.hero h1 .gold{color:var(--gold)}
.hero p.lead{font-size:16px;color:var(--muted);max-width:60ch;margin:0 auto;line-height:1.6}
section.block{margin:28px 0}
section.block h2{font-size:22px;font-weight:800;color:var(--navy);margin:0 0 14px;letter-spacing:-.01em}
section.block h3{font-size:17px;font-weight:700;color:var(--navy);margin:18px 0 8px}
section.block p{font-size:15px;line-height:1.7;color:var(--ink);margin:0 0 12px}
.card{border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;background:#fff}
.card h3{margin-top:0}
.step{display:flex;gap:16px;margin:16px 0;align-items:flex-start}
.step .num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
.step .body h3{margin:2px 0 6px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px;margin:16px 0}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.store-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}
@media(min-width:640px){.store-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.store-grid{grid-template-columns:repeat(4,1fr)}}
.store-card{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;font-weight:600;font-size:14px;color:var(--navy)}
.store-card:hover{border-color:var(--blue);text-decoration:none;background:var(--sky)}
.btn{display:inline-block;background:var(--navy);color:#fff;font-weight:700;padding:12px 28px;border-radius:12px;font-size:15px;margin:8px 0}
.btn:hover{background:var(--blue);text-decoration:none}
footer{background:var(--navy);color:#B9C6E4;font-size:13px;padding:28px 20px;text-align:center;margin-top:auto}
footer a{color:#fff}
.err-box{border:1px solid #FECACA;background:#FEF2F2;border-radius:16px;padding:32px 20px;text-align:center;margin:24px 0}
.err-box strong{display:block;font-size:18px;color:var(--navy);margin-bottom:8px}
/* Buy path: size selector + add-to-cart (producto.html restore, 2026-10-08) */
.buy-box{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.size-label{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:-6px}
.size-select{width:100%;padding:13px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink)}
.size-select:focus{outline:none;border-color:var(--blue)}
.size-note{font-size:12.5px;color:var(--muted);line-height:1.5}
.btn-add{width:100%;text-align:center;border:none;cursor:pointer;background:var(--gold);color:var(--navy)}
.btn-add:hover{background:#EAB54E;text-decoration:none}
.btn-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn-secondary:hover{background:var(--sky);text-decoration:none}
.btn-checkout{width:100%;text-align:center;background:var(--blue);color:#fff;border:none}
.btn-checkout:hover{background:var(--navy);text-decoration:none;color:#fff}
.cart-confirm{margin-top:4px}
.confirm-msg{font-size:15px;font-weight:700;color:var(--green);margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,24px);background:var(--navy);color:#fff;padding:13px 22px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:999;max-width:90vw;text-align:center;line-height:1.4}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* Related rails (2026-10-18): same store, same category, sale items only. */
.rel-rail{margin:28px 0 8px}
.rel-rail h2{font-size:19px;font-weight:800;color:var(--navy);margin:0 0 12px;letter-spacing:-.01em}
.rel-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.rel-card{flex:0 0 156px;scroll-snap-align:start;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;color:var(--ink);text-decoration:none;display:flex;flex-direction:column}
.rel-card:hover{text-decoration:none;border-color:var(--blue)}
/* THE CARD HOLDS ITS SHAPE (2026-10-19, #409 T1): the photo box is a
   square from the first paint -- aspect-ratio, plus the padding-top
   square for Safari releases that ignore it -- and the text rows
   reserve their lines, so nothing collapses while photos arrive. */
.rel-img{position:relative;width:100%;aspect-ratio:1/1;background:#f7f8fb;overflow:hidden}
@supports not (aspect-ratio:1/1){.rel-img{height:0;padding-top:100%}}
.rel-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.rel-body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px}
.rel-store{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-height:14px}
.rel-title{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.rel-pricebox{min-height:36px}
.rel-price{font-size:15px;font-weight:800;color:var(--navy)}
.rel-was{font-size:12px;color:var(--muted);text-decoration:line-through;margin-left:4px;font-weight:500}
.rel-usd{display:block;font-size:11.5px;color:var(--muted)}
.rel-off{font-size:11px;font-weight:800;color:var(--red);min-height:14px}
/* Placeholders: the same boxes, grey bars where the words go. */
.sk i{display:block;height:10px;border-radius:5px;background:var(--line);margin:3px 0}
.sk .rel-title i:last-child{width:60%}
.sk .rel-pricebox i{height:15px;width:50%}
/* The product photo: a square box before the photo arrives. */
.p-photo{position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;border:1px solid var(--line);background:#f7f8fb;overflow:hidden}
@supports not (aspect-ratio:1/1){.p-photo{height:0;padding-top:100%}}
.p-photo img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:block}
.p-sk-line{display:block;height:14px;border-radius:7px;background:var(--line);margin:0 0 10px}
.p-pen{font-size:28px;font-weight:800;color:var(--navy)}
.p-was{font-size:15px;color:var(--muted);text-decoration:line-through;margin-left:8px;font-weight:500}
.p-off{display:inline-block;background:var(--gold);color:var(--navy);font-size:12px;font-weight:800;border-radius:8px;padding:3px 7px;margin-left:8px;vertical-align:middle}
.p-usd{font-size:14px;color:var(--muted);margin-top:2px}
</style>

<script src="sale-rule.js"></script>
<script src="product-type.js"></script>

/* THE SHARDS (2026-10-19, #409 T1). FNV-1a over the normalised title
   (or part number), the same function at build time and here. The
   build fails if a shard outgrows 30KB gzipped; raise the count then. */
var PDP_SHARDS = 4096;
var AUTO_SHARDS = 32;
var PDP_BASE = "/assets/pdp/";
function pdpHash(key){
  var h = 0x811c9dc5;
  for (var i = 0; i < key.length; i++){ h ^= key.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
function pdpShard(key){ return ("00" + (pdpHash(key) % PDP_SHARDS).toString(16)).slice(-3); }
function autoShard(key){ return ("0" + (pdpHash(key) % AUTO_SHARDS).toString(16)).slice(-2); }
/* The record the old download-and-scan returned: the first file of
   `files` (in order) that carries the title, at its earliest position. */
function pickRecord(cands, files){
  if (!Array.isArray(cands) || !Array.isArray(files)) return null;
  /* A title only one record carries is the answer from any store (the
     build leaves its positions out). */
  if (cands.length === 1 && !cands[0].src) return cands[0];
  for (var i = 0; i < files.length; i++){
    var best = null, bestPos = Infinity;
    for (var j = 0; j < cands.length; j++){
      var src = cands[j].src || [];
      for (var k = 0; k < src.length; k++){
        if (src[k][0] === files[i] && src[k][1] < bestPos){ best = cands[j]; bestPos = src[k][1]; }
      }
    }
    if (best) return best;
  }
  return null;
}

/* SOLES FIRST (#416): the site's own rate -- the same endpoint and
   24-hour cache key the home page, search and checkout use -- so a
   slow exchange-rate call never flips the page to dollars when a
   recent rate is on the phone already. */
var FX_CACHE_KEY = "aria_fx_rate_v1", FX_CACHE_TTL_MS = 24 * 60 * 60 * 1000;
var PAGE_FX = null;
async function pageRate(){
  if (PAGE_FX) return PAGE_FX;
  try{
    var c = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || "null");
    if (c && typeof c.venta === "number" && Date.now() - c.fetchedAt < FX_CACHE_TTL_MS) return (PAGE_FX = c.venta);
  }catch(e){}
  var d = await fetchJson("/.netlify/functions/exchange-rate", 6000);
  if (d && typeof d.venta === "number" && d.venta > 0){
    try{ localStorage.setItem(FX_CACHE_KEY, JSON.stringify(Object.assign({}, d, { fetchedAt: Date.now() }))); }catch(e){}

/* Sized retailer derivatives (2026-10-16) -- the same rules the app
   bundle's sizedImageUrl applies: card slots are small, retailer
   originals are 1600-2000px, and decoding them by the hundred is
   what kills phone tabs. A derivative that fails swaps back to the
   original URL (data-img-orig) before the page's own error handling
   runs, so a card never breaks because of the resize. Hosts with no
   verified resize parameter return the URL unchanged. */
var CARD_IMG_WIDTHS = [360, 560, 800];
var CARD_IMG_SIZES = "(max-width: 640px) 44vw, 200px";
/* The width a URL already declares, when it declares one. Feeds are

   bare original for one product and a small pre-sized variant for
   the next. */
function declaredImageWidth(u){
  const m = u.match(/[?&](?:wid|width|imwidth|odnWidth|w)=(\d+)/i)
    || u.match(/\/upload\/[^/]*\bw_(\d+)/)
    || u.match(/_(1000|750|500|250)\.jpg(?:\?|$)/i);
  return m ? parseInt(m[1], 10) : 0;

function sizedImageUrl(url, w){
  var u = typeof url === "string" ? url : "";
  if (!u || !/^https?:\/\//i.test(u) || !w) return u;
  /* NEVER UPSCALE. When the URL already declares a width at or
     below the step asked for (Kohl's feeds store wid=180/342, some
     Walmart and Sam's Club URLs declare 180), that variant is the
     card image the shopper sees today; asking the CDN for more
     pixels would ADD decoded weight -- the opposite of this job. */
  const declared = declaredImageWidth(u);
  if (declared && w >= declared) return u;
  function setQ(base, key, val){
    var re = new RegExp("([?&]" + key + "=)(\\d+)", "i");
    if (re.test(base)) return base.replace(re, function(m, p){ return p + val; });
    return base + (base.indexOf("?") >= 0 ? "&" : "?") + key + "=" + val;
  }

  if (/cdn\.shopify\.com/i.test(u)){
    out = setQ(u, "width", w);
  } else if (/res\.cloudinary\.com/i.test(u)){
    if (/\/upload\/[^/]*\bw_\d+/.test(u)) out = u.replace(/(\/upload\/[^/]*)\bw_\d+/, "$1w_" + w);
  } else if (/i5\.(walmartimages|samsclubimages)\.com/i.test(u)){
    out = setQ(u, "odnWidth", w);
    out = /[?&]odnHeight=\d+/i.test(out)
      ? out.replace(/([?&]odnHeight=)(\d+)/i, function(m, p){ return p + w; })
      : out + "&odnHeight=" + w;
    if (!/odnBg=/i.test(out)) out += "&odnBg=FFFFFF";
  } else if (/(target|dks|nb)\.scene7\.com|media\.kohlsimg\.com/i.test(u)){
    /* Scene7 sizing only ever REDUCES a declared width; the bare
       default is already card-sized on these hosts. */
    if (/[?&]wid=\d+/i.test(u)){
      out = setQ(u, "wid", w);
      if (/[?&]hei=\d+/i.test(out)) out = out.replace(/([?&]hei=)(\d+)/i, function(m, p){ return p + w; });
    }
  } else if (/macysassets\.com/i.test(u)){
    if (/[?&]wid=\d+/i.test(u)) out = setQ(u, "wid", w);
  } else if (/sephora\.com/i.test(u)){
    out = setQ(u, "imwidth", w);
  } else if (/content\.gapinc\.com/i.test(u)){
    out = setQ(u, "width", w);
  } else if (/media\.ultainc\.com/i.test(u)){
    out = setQ(u, "w", w);
    if (/[?&]h=\d+/i.test(out)) out = out.replace(/([?&]h=)(\d+)/i, function(m, p){ return p + w; });

    if (/\/images\/fb\//i.test(u)){
      if (w <= 280) out = u.replace("/images/fb/", "/images/images250x250/");

}

  var u = typeof url === "string" ? url : "";

    return u.replace(/_1000\.jpg$/i, "_500.jpg") + " 500w, " + u + " 1000w";
  }
  var seen = {}, parts = [];
  for (var i = 0; i < CARD_IMG_WIDTHS.length; i++){
    var s = sizedImageUrl(u, CARD_IMG_WIDTHS[i]);
    if (s === u || seen[s]) continue;
    seen[s] = 1;

          price: best.rec.price, thumbnail: best.rec.thumbnail, images: best.rec.images,
          retailer: tienda || best.src }, best.src);
        if (p){ p.url = ""; p.partNumber = best.rec.part_number || null; }
        return p;
      }catch(e){ return null; }
    }
    function autoUrl(){
      var pn = String(params.get("pn") || "").trim().toUpperCase();
      return pn ? PDP_BASE + "auto-pn/" + autoShard(pn) + ".json" : PDP_BASE + "auto-t/" + autoShard(w) + ".json";
    }
    var AUTO_STORES = { autozone: 1 };

    var found = AUTO_STORES[tienda] ? await huntAuto(autoUrl()) : null;
    if (!found) found = list ? await hunt(list) : null;
    /* The fast path missed: every catalogue's record of this title (the
       same shard), then by name, rather than lie. */
    if (!found) found = await hunt(CATALOG_FILES);
    if (!found) found = await huntByName();
    if (!found && !AUTO_STORES[tienda] && params.get("pn")) found = await huntAuto(autoUrl());
    await fxP;
    if (!found){
      if (tienda) lastPool = await fetchStoreRail(tienda, { name: want, dept: "" });
      fail("No encontramos “" + want + "” en el catálogo. Puede que ya no esté disponible.", { store: tienda, query: want, pool: lastPool });
      return;
    }
    render(found);
    lastPool = await fetchStoreRail(found.retailer, found);
    buildRelatedRails(found, lastPool.filter(function(it){ return it.retailer === found.retailer; }));
  }catch(e){ fail("Ocurrió un error inesperado."); }
})();
