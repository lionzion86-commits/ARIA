<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda — Aria Shop</title>
<meta name="description" content="Compra en tiendas de Estados Unidos con entrega en Perú. Precio honesto, sin letra pequeña.">
<style>
/* Standalone Tienda template — one page for every store (?tienda=clave).
   Zero dependencies: no frameworks, no CDN. If this stylesheet failed to
   load, the page still renders as plain readable HTML — never blank. */
:root{
  --navy:#0A1F44; --blue:#2F5FEE; --blue-dark:#1E46C4; --sky:#EAF0FF;
  --paper:#FAFAF8; --green:#1C8A4B; --green-bg:#EAF7EF; --line:#E4E6EC;
  --amber:#B8860B; --yellow:#FFC72C; --red:#D92D20; --store:#0A1F44;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);color:var(--navy);-webkit-font-smoothing:antialiased}
/* ---- header ---- */
.site-header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1240px;margin:0 auto;padding:0 12px;height:64px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{text-decoration:none;display:flex;align-items:center;gap:8px}
.wordmark .w1{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-size:20px}
.wordmark .w2{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-size:20px}
.main-nav{display:none;align-items:center;gap:20px;font-size:13.5px}
.main-nav a{color:var(--navy);text-decoration:none;opacity:.75;white-space:nowrap}
.main-nav a:hover{opacity:1}
@media(min-width:1024px){.main-nav{display:flex}}
.header-meta{font-size:13px;color:#6b7280;white-space:nowrap}
/* ---- hero ---- */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--store) 0%,#0A1F44 70%);color:#fff;
  padding:36px 12px 30px}
.hero .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;}
.hero .hero-scrim{position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,20,40,.72) 0%,rgba(10,20,40,.88) 100%);}
.hero-inner{position:relative;z-index:1;max-width:1240px;margin:0 auto}
.hero-logo{background:#fff;border-radius:16px;display:inline-flex;align-items:center;
  padding:10px 18px;margin-bottom:14px;max-width:100%}
.hero-logo img{height:40px;max-width:220px;object-fit:contain;display:block}
.hero-name{margin:0 0 6px;font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.02em}
.hero-tag{margin:0;color:rgba(255,255,255,.82);font-size:15px;max-width:640px}
.eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:#fff;background:rgba(255,255,255,.16);
  padding:6px 12px;border-radius:999px;margin-bottom:12px}
/* ---- page ---- */
.page{max-width:1240px;margin:0 auto;padding:20px 12px 64px}
@media(min-width:640px){.page{padding:28px 20px 72px}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.toolbar input[type="search"]{flex:1 1 220px;min-width:0;padding:11px 14px;font-size:14px;
  border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--navy)}
.toolbar select{padding:11px 12px;font-size:14px;border:1px solid var(--line);
  border-radius:12px;background:#fff;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:#fff;color:var(--navy);font-size:13px;
  font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.count-line{font-size:13.5px;color:#4b5563;margin:0 0 14px}
/* ---- grid & cards ---- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;text-decoration:none;color:inherit}
.card-img{position:relative;aspect-ratio:1/1;background:#f1f2f6;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;
  font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:2}
.card-body{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-brand{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6b7280}
.card-title{font-size:13.5px;font-weight:600;line-height:1.35;margin:0;color:var(--navy);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-prices{margin-top:auto;padding-top:8px}
.price-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price{font-size:19px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.price-old{font-size:13.5px;color:#9aa1b2;text-decoration:line-through;font-variant-numeric:tabular-nums}
.price-pen{font-size:12.5px;color:#4b5563;font-variant-numeric:tabular-nums}
/* ---- store directory ---- */
.dir-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.dir-grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1024px){.dir-grid{grid-template-columns:repeat(4,1fr)}}
.dir-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  text-decoration:none;color:inherit;display:flex;flex-direction:column}
.dir-band{height:64px;display:flex;align-items:center;justify-content:center;padding:10px;background:#fff;border-bottom:1px solid var(--line)}
.dir-band img{max-height:40px;max-width:80%;object-fit:contain}
.dir-body{padding:12px 14px}
.dir-name{font-weight:800;font-size:14px;color:var(--navy)}
.dir-tag{font-size:12.5px;color:#6b7280;margin-top:2px}
/* ---- states ---- */
.state{border:1px dashed var(--line);border-radius:16px;background:#fff;
  padding:48px 24px;text-align:center;color:#4b5563;font-size:15px}
.state h2{color:var(--navy);font-size:20px;margin:0 0 8px}
.state p{margin:0 0 18px}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;cursor:pointer;
  font-size:15px;font-weight:800;padding:12px 26px;border-radius:12px;text-decoration:none}
.btn:hover{background:var(--blue-dark)}
.skel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.skel-grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1024px){.skel-grid{grid-template-columns:repeat(4,1fr)}}
.skel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.skel .ph{aspect-ratio:1/1;background:linear-gradient(100deg,#eef0f4 40%,#f7f8fb 50%,#eef0f4 60%);
  background-size:200% 100%;animation:sh 1.4s infinite}
.skel .ln{height:12px;border-radius:6px;background:#eef0f4;margin:10px 12px}
.skel .ln.short{width:55%}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel .ph{animation:none}}
/* ---- footer ---- */
.site-footer{border-top:1px solid var(--line);background:#fff;margin-top:24px}
.footer-inner{max-width:1240px;margin:0 auto;padding:28px 12px;font-size:13px;color:#6b7280;
  display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.site-footer a{color:var(--blue);text-decoration:none}

/* ---- carousels (2026-10-07, Danny): sales-first merchandising ---- */
.rail-sec{margin:0 0 28px}
.rail-head{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.rail-title{font-size:19px;font-weight:800;color:var(--navy);margin:0;letter-spacing:-.01em}
.rail-count{font-size:11.5px;font-weight:700;color:#fff;background:var(--navy);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.rail-ver{margin-left:auto;flex-shrink:0;background:none;border:none;font-size:13px;font-weight:800;color:var(--blue);cursor:pointer;padding:6px 2px}
.rail-ver:hover{text-decoration:underline}
.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{height:6px}
.rail::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.rail .card{flex:0 0 164px;scroll-snap-align:start;min-width:0}
@media(min-width:640px){.rail .card{flex-basis:196px}}
/* ---- rail expand overlay (2026-10-07): full-screen "Ver todo" ---- */
.rail-expand{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;flex-direction:column}
.rail-expand[hidden]{display:none}
.re-head{flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:12px}
.re-back{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:none;background:var(--sky);display:grid;place-items:center;cursor:pointer}
.re-title{font-size:17px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.re-count{font-size:12px;font-weight:600;color:#6b7280}
.re-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;align-content:start}
@media(min-width:640px){.re-grid{grid-template-columns:repeat(3,1fr);max-width:1100px;margin:0 auto;width:100%}}
@media(min-width:1024px){.re-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>Aria Shop — Compra en Estados Unidos, entregado en Perú.</span>
    <span><a href="/">Volver al inicio</a></span>
  </div>
</footer>

/* ---------- tiny helpers ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function qs(name){
  try {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  } catch (e) { return ''; }
}
/* ---------- pricing: tiered marginal margin (LOCKED 2026-10-02) ---------- */
function tieredMarginUsd(raw){
  var r = Number(raw);
  if (!(r > 0)) return 0;
  return Math.min(r,500)*0.24
    + Math.min(Math.max(r-500,0),1500)*0.18
    + Math.min(Math.max(r-2000,0),3000)*0.12
    + Math.max(r-5000,0)*0.08;
}
/* PER-RETAILER MIAMI SALES TAX (2026-10-09). Mirrors the 'exempt' rows of
   TAX_EXEMPT_STATUS in index.html (a test pins the two): every price on
   the site is (raw + tieredMarginUsd(raw)) x taxRate -- see weight-data.js.
   This page used to stop at the margin, 7% under the SPA's price. */
var TAX_EXEMPT = {"walmart": 1};
function salesTaxRate(retailer){ return TAX_EXEMPT[String(retailer || "").toLowerCase()] ? 1 : 1.07; }
function finalUsd(raw, retailer){
  var r = Number(raw);
  if (!(r > 0)) return NaN;
  return Math.round((r + tieredMarginUsd(r)) * salesTaxRate(retailer) * 100) / 100;
}
function fmtUSD(n){
  if (!isFinite(n)) return 'Precio no disponible';
  return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function money(n){
  var v = Number(n);
  if (!Number.isFinite(v)) return '—';
  return '$' + v.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function discountPct(p){
  var o = Number(p.regularPrice || p.wasPrice || p.originalPrice), pr = Number(p.price);
  if (!(o > 0) || !(pr >= 0) || !(o > pr)) return 0;
  return Math.round((1 - pr / o) * 100);
} /* DANNY 2026-10-07: regularPrice counts (VS) */
/* SALE TIER (2026-10-07, Danny): 2 = measured % off, 1 = merchant-flagged
   sale without a measurable %, 0 = full price. Sales always lead. */
function saleTier(p){
  if (discountPct(p) > 0) return 2;
  if (p && p.onSale) return 1;
  return 0;
}
/* ---------- product-type classification (word-boundary, not substring) ----------
   DANNY 2026-10-07: store pages group carousels by PRODUCT TYPE, not department.
   A Gymshark store page shows Leggings/Tops/Shorts carousels, never a "Gym Rat"
   department carousel. Same classifier as marca.html. */
var PRODUCT_TYPES = [
  { key:'trajes_bano', label:'Trajes de Baño', keywords:['bikini','swimsuit','swim','one-piece','two-piece','beach','swimwear','rash guard'] },
  { key:'carteras',    label:'Carteras y mochilas', keywords:['bag','handbag','purse','tote','clutch','backpack','crossbody','satchel'] },
  { key:'joyas',       label:'Joyas',          keywords:['jewelry','earring','necklace','bracelet','ring','pendant','charm'] },
  { key:'zapatos',     label:'Zapatos',        keywords:['shoe','sandal','heel','sneaker','flat','mule','boot','loafer','espadrille'] },
  { key:'sombreros',   label:'Sombreros',      keywords:['hat','cap','beanie','fedora','visor'] },
  { key:'accesorios',  label:'Accesorios',     keywords:['scarf','belt','sunglasses','wallet','glove','shawl','pareo','sarong'] },
  { key:'ropa',        label:'Ropa',           keywords:[] }
];
var TYPE_RES = PRODUCT_TYPES.map(function(t){
  return t.keywords.map(function(kw){
    return new RegExp('\\b' + kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + 's?\\b', 'i');
  });
});
/* DANNY 2026-10-08 (audit2): keyword-exclusion guards for productTypeOf.
   Same keyword, wrong product: 'flat' as an adjective is not a flat shoe --
   hair tools (flat iron), flat-front shorts and flat-bottom objects all
   matched the zapatos keyword. 'bag' as grocery/packaging (3 lb Bag onions,
   18 Pound Bag epsom salt, 110 Ct Bulk Bag candy, Bags Per Box snacks) is
   not a cartera. A guard only suppresses that one keyword's match; the item
   still classifies normally against every other keyword. */
function typeKeywordBlocked(n, kw){
  if (kw === 'flat' && /\bflat[\s-]*iron\b/i.test(n)) return true;
  if (kw === 'flat' && /\bflat[\s-]*(front|bottom|panel)\b/i.test(n)) return true;
  if (kw !== 'bag') return false;
  if (/\b(bulk|resealable|party size|fun size|variety pack)\s+bags?\b/i.test(n)) return true;
  if (/\b\d[\d.,]*\s*(oz|lb|lbs|pound|pounds|ct|count)\b[^a-z]{0,25}\bbags?\b/i.test(n)) return true;
  if (/\bbags?\s+per\s+box\b/i.test(n)) return true;
  if (/\b(candy|gummy|gummies|gummi|chocolate|chips|onions?|croutons?|salts?|snacks?|popcorn|pretzels?|yogurt|alfajores?|raisins?|licorice|taffy|skittles|snickers|twix|twizzlers|haribo|peppermint)\b[^.\n]{0,60}\bbags?\b/i.test(n)) return true;
  return false;
}
function productTypeOf(item){
  var n = String((item && (item.name || item.title)) || '');
  for (var i = 0; i < PRODUCT_TYPES.length; i++){
    if (!PRODUCT_TYPES[i].keywords.length) continue;
    var res = TYPE_RES[i];
    for (var k = 0; k < res.length; k++){
      if (res[k].test(n) && !typeKeywordBlocked(n, PRODUCT_TYPES[i].keywords[k])) return PRODUCT_TYPES[i].key;
    }
  }
  return 'ropa';
}
/* Shared sale-first sort: tier desc, then discount % desc, then price desc
   so hero products lead instead of cheap accessories when nothing is on sale. */
function saleSort(a, b){
  var ta = saleTier(a), tb = saleTier(b);
  if (ta !== tb) return tb - ta;
  var pa = discountPct(a), pb = discountPct(b);
  if (pa !== pb) return pb - pa;
  return b.price - a.price;
}
function realImage(p){
  var cands = [];
  if (p.image) cands.push(p.image);
  if (p.imageUrl) cands.push(p.imageUrl);
  if (p.img) cands.push(p.img);
  if (p.thumbnail) cands.push(p.thumbnail);
  if (Array.isArray(p.images)) for (var i = 0; i < p.images.length; i++) cands.push(p.images[i]);
  for (var j = 0; j < cands.length; j++){
    var u = cands[j];
    if (typeof u !== 'string' || !u) continue;
    if (u.indexOf('foto-en-camino') !== -1 || u.indexOf('placeholder') !== -1 || u.indexOf('no-image') !== -1) continue;
    if (u.indexOf('http') === 0 && u.length > 20) return u;
  }
  return null;
}

/* ---------- fetch with timeout ---------- */
function fetchJson(url){
  return new Promise(function(resolve, reject){
    var ctrl = null, timer = null;
    try { ctrl = new AbortController(); } catch (e) {}
    if (ctrl) timer = setTimeout(function(){ try { ctrl.abort(); } catch (e2) {} }, TIMEOUT_MS);
    var opts = ctrl ? { signal: ctrl.signal } : {};
    fetch(url, opts).then(function(res){
      if (timer) clearTimeout(timer);
      if (!res.ok) { reject(new Error('HTTP ' + res.status)); return; }
      res.json().then(resolve, reject);
    }, function(err){
      if (timer) clearTimeout(timer);
      reject(err);
    });
    if (!ctrl) setTimeout(function(){ reject(new Error('timeout')); }, TIMEOUT_MS);
  });
}

/* ---------- item normalization ---------- */
function normItem(raw, deptKey){
  if (!raw || typeof raw !== 'object') return null;
  var name = raw.name || raw.title || raw.productName || '';  /* footlocker catalog uses productName */
  var price = Number(raw.price);
  if (!name || !(price > 0)) return null;
  var img = realImage(raw);
  if (!img) return null;
  return {
    name: String(name),
    brand: raw.brand ? String(raw.brand) : '',
    price: price,
    originalPrice: raw.originalPrice != null ? Number(raw.originalPrice) : null,
    regularPrice: raw.regularPrice != null ? Number(raw.regularPrice) : null,
    wasPrice: raw.wasPrice != null ? Number(raw.wasPrice) : null,
    onSale: !!(raw.onSale || raw.isOnSale),
    image: img,
    url: raw.url || raw.link || '',
    dept: deptKey || '',
    type: raw.type ? String(raw.type) : ''
  };
}

     "For Him" / "For Her"  (YoungLA): gender only. */
var GENDER_LABELS = { womens: 'Mujer', women: 'Mujer', 'for her': 'Mujer',
                      mens: 'Hombre', men: 'Hombre', 'for him': 'Hombre', unisex: 'Unisex' };
var GENDER_ORDER = ['Mujer', 'Hombre', 'Unisex'];
var FACET_MIN = 5;  /* a category pill needs this many products; smaller ones stay under Todo */
function typeFacets(type){
  var t = String(type || '').trim();
  if (!t) return { gender: '', cat: '' };
  if (t.indexOf('>') >= 0){
    var seg = t.split('>').map(function(x){ return x.trim(); });
    return { gender: GENDER_LABELS[seg[0].toLowerCase()] || '', cat: seg[2] || '' };
  }
  var whole = GENDER_LABELS[t.toLowerCase()];
  if (whole) return { gender: whole, cat: '' };
  var m = /^(women|men)['\u2019]?s\s+|^unisex\s+/i.exec(t);
  var gender = m ? (GENDER_LABELS[m[0].replace(/['\u2019\s]/g, '').toLowerCase()] || '') : '';
  var words = (m ? t.slice(m[0].length) : t).split(/\s+/).filter(Boolean);
  var last = words.length ? words[words.length - 1] : '';
  var cat = last ? last.charAt(0).toUpperCase() + last.slice(1) : '';
  if (cat && !/s$/i.test(cat)) cat += 's';  /* "Short" and "Shorts" are one pill */
  return { gender: gender, cat: cat };
}
var facetMode = false;
var facetGenders = [];   /* gender labels present, in GENDER_ORDER */
var facetCats = [];      /* category labels with >= FACET_MIN products, biggest first */
var activeGender = '';
var activeCat = '';
function buildFacets(){
  facetMode = Object.keys(deptLabels).length === 1;
  facetGenders = []; facetCats = []; activeGender = ''; activeCat = '';
  if (!facetMode) return;
  var g = {}, c = {};
  for (var i = 0; i < allItems.length; i++){
    var f = typeFacets(allItems[i].type);
    allItems[i].gender = f.gender;
    allItems[i].cat = f.cat;
    if (f.gender) g[f.gender] = 1;
    if (f.cat) c[f.cat] = (c[f.cat] || 0) + 1;
  }
  facetGenders = GENDER_ORDER.filter(function(x){ return g[x]; });
  facetCats = Object.keys(c).filter(function(k){ return c[k] >= FACET_MIN; })
    .sort(function(a, b){ return c[b] - c[a] || a.localeCompare(b, 'es'); });
  /* Nothing to offer from the type field: fall back to the old pills. */
  if (!facetGenders.length && !facetCats.length) facetMode = false;
}

/* ---------- data loading ---------- */
function loadStore(){
  var files = storeMeta.files || [];
  if (!files.length){
    return Promise.resolve({ items: [], empty: 'nocatalog' });
  }
  return Promise.all(files.map(function(f){
    var url = f.charAt(0) === '/' ? BASE + f : f;
    return fetchJson(url).then(function(j){ return { ok: true, json: j }; },
                               function(){ return { ok: false }; });
  })).then(function(results){
    var items = [], depts = {}, anyOk = false;
    for (var i = 0; i < results.length; i++){
      var r = results[i];
      if (!r.ok || !r.json) continue;
      anyOk = true;
      var retailers = r.json.retailers;
      if (!retailers || typeof retailers !== 'object') continue;
      var bucket = retailers[storeKey];
      if (!bucket) continue;
      var departments = bucket.departments || {};
      var keys = Object.keys(departments);
      for (var d = 0; d < keys.length; d++){
        var dk = keys[d];
        var entry = departments[dk];
        var label = dk, arr = null;
        if (entry && typeof entry === 'object' && !Array.isArray(entry)){
          label = entry.label || dk;
          arr = entry.items;
        } else if (Array.isArray(entry)){
          arr = entry;
        }
        if (!Array.isArray(arr)) continue;
        depts[dk] = String(label);
        for (var j = 0; j < arr.length; j++){
          var n = null;
          try { n = normItem(arr[j], dk); } catch (e) { n = null; }
          if (n) items.push(n);
        }
      }
    }
    // dedupe by name+image
    var seen = {}, out = [];
    for (var k = 0; k < items.length; k++){
      var key = items[k].name + '||' + items[k].image;
      if (seen[key]) continue;
      seen[key] = 1;
      out.push(items[k]);
    }
    deptLabels = depts;
    return { items: out, empty: anyOk ? (out.length ? '' : 'nodata') : 'failed' };
  });
}

/* ---------- FX (non-blocking) ---------- */
function loadFx(){
  fetchJson(FX_URL).then(function(j){
    var v = Number(j && (j.venta || j.Venta));
    if (Number.isFinite(v) && v > 0){
      fxVenta = v;
      try { renderPenPrices(); } catch (e) {}
    }
  }, function(){});
}

/* ---------- rendering: store page ---------- */
function currentFilters(){
  var q = (($('q') || {}).value || '').trim().toLowerCase();
  var sort = (($('sort') || {}).value || 'relevance');
  return { q: q, sort: sort, dept: activeDept, gender: activeGender, cat: activeCat };
}
var activeDept = '';
function filteredItems(){
  var f = currentFilters();
  var pool = allItems;
  if (f.dept) pool = pool.filter(function(p){ return p.dept === f.dept; });
  if (f.gender) pool = pool.filter(function(p){ return p.gender === f.gender; });
  if (f.cat) pool = pool.filter(function(p){ return p.cat === f.cat; });
  if (f.q){
    var words = f.q.split(/\s+/).filter(Boolean);
    pool = pool.filter(function(p){
      var t = (p.name + ' ' + p.brand).toLowerCase();
      for (var i = 0; i < words.length; i++){
        if (t.indexOf(words[i]) === -1) return false;
      }
      return true;
    });
  }
  var arr = pool.slice();
  if (f.sort === 'priceAsc') arr.sort(function(a,b){ return a.price - b.price; });
  else if (f.sort === 'priceDesc') arr.sort(function(a,b){ return b.price - a.price; });
  else if (f.sort === 'discount') arr.sort(saleSort);
  return arr;
}
function penHTML(usd){
  var f = finalUsd(usd, storeKey);
  if (!fxVenta || !isFinite(f)) return '';
  return '<div class="price-pen" data-usd="' + esc(f) + '">S/ ' +
    (f * fxVenta).toLocaleString('es-PE',{minimumFractionDigits:2, maximumFractionDigits:2}) + '</div>';
}
function cardHTML(p){
  var f = finalUsd(p.price, storeKey);
  var pct = discountPct(p);
  var brand = p.brand ? '<div class="card-brand">' + esc(p.brand) + '</div>' : '';
  /* THE CARD STAYS IN THE SHOP. It used to open the retailer's own
     site in a new tab when it had a url, and be dead when it did
     not. Now every card lands on our product page, where the price
     is the honest one; the product page carries the link out. */
  var _href = 'producto.html?producto=' + encodeURIComponent(p.name || '')
    + (p.retailer ? '&tienda=' + encodeURIComponent(p.retailer) : '');
  var open = '<a class="card" href="' + esc(_href) + '">';
  var close = '</a>';
  return open +
    '<div class="card-img">' +
      (pct >= 5 ? '<span class="badge">-' + pct + '%</span>' : '') +
      '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + '" loading="lazy" decoding="async" onerror="this.style.display=\'none\'">' +
    '</div>' +
    '<div class="card-body">' + brand +
      '<h3 class="card-title">' + esc(p.name) + '</h3>' +
      '<div class="card-prices"><div class="price-row">' +
        '<span class="price">' + fmtUSD(f) + '</span>' +
        (pct >= 5 && p.originalPrice ? '<span class="price-old">' + money(p.originalPrice) + '</span>' : '') +
      '</div>' + penHTML(p.price) + '</div>' +
    '</div>' + close;
}
function renderPenPrices(){
  if (!fxVenta) return;
  var els = document.querySelectorAll('.price-pen');
  for (var i = 0; i < els.length; i++){
    var usd = Number(els[i].getAttribute('data-usd'));
    if (!Number.isFinite(usd)) continue;
    els[i].textContent = 'S/ ' + (usd * fxVenta).toLocaleString('es-PE',{minimumFractionDigits:2, maximumFractionDigits:2});
  }
}
function renderFacetChips(host){
  var chip = function(kind, val, label, on){
    return '<button type="button" class="chip' + (on ? ' active' : '') + '" data-' + kind + '="' + esc(val) + '">' + esc(label) + '</button>';
  };
  var html = chip('all', '', 'Todo', !activeGender && !activeCat);
  for (var i = 0; i < facetGenders.length; i++) html += chip('gender', facetGenders[i], facetGenders[i], activeGender === facetGenders[i]);
  for (var j = 0; j < facetCats.length; j++) html += chip('cat', facetCats[j], facetCats[j], activeCat === facetCats[j]);
  host.innerHTML = html;
  var btns = host.querySelectorAll('.chip');
  for (var k = 0; k < btns.length; k++){
    btns[k].addEventListener('click', function(){
      /* Gender and category combine (Mujer + Leggings); tapping an
         active pill clears it; Todo clears both. */
      if (this.hasAttribute('data-all')){ activeGender = ''; activeCat = ''; }
      else if (this.hasAttribute('data-gender')){
        var g = this.getAttribute('data-gender');
        activeGender = activeGender === g ? '' : g;
      } else {
        var c = this.getAttribute('data-cat');
        activeCat = activeCat === c ? '' : c;
      }
      visibleCount = PAGE_SIZE;
      try { renderDeptChips(); render(); } catch (e) {}
    });
  }
}
function renderDeptChips(){
  var host = $('deptChips');
  if (!host) return;
  if (facetMode){ renderFacetChips(host); return; }
  var keys = Object.keys(deptLabels).sort(function(a,b){
    return String(deptLabels[a]).localeCompare(String(deptLabels[b]), 'es');
  });
  if (!keys.length){ host.innerHTML = ''; return; }
  var html = '<button type="button" class="chip' + (activeDept === '' ? ' active' : '') + '" data-dept="">Todo</button>';
  for (var i = 0; i < keys.length; i++){
    html += '<button type="button" class="chip' + (activeDept === keys[i] ? ' active' : '') +
      '" data-dept="' + esc(keys[i]) + '">' + esc(deptLabels[keys[i]]) + '</button>';
  }
  host.innerHTML = html;
  var btns = host.querySelectorAll('.chip');
  for (var j = 0; j < btns.length; j++){
    btns[j].addEventListener('click', function(){
      activeDept = this.getAttribute('data-dept') || '';
      visibleCount = PAGE_SIZE;
      try { renderDeptChips(); render(); } catch (e) {}
    });
  }
}
/* ---------- carousel merchandising (2026-10-07, Danny) ----------
   Store pages lead with sales, then one carousel per category.
   Every rail expands to a full-screen grid via "Ver todo". */
var RAIL_MAX = 16;
var railPools = {};  /* rail key -> full sorted item list (legacy lookup) */
var railPoolList = []; /* DANNY 2026-10-07: bulletproof pool by numeric index.
   The string-key lookup could silently fail (encoding/pool resets), leaving
   an empty overlay. Buttons now carry a numeric data-idx into this array,
   rebuilt on every renderCarousels() alongside the buttons themselves. */

function railHTML(title, list, railKey){
  if (!list || !list.length) return '';
  var rk = 'rail::' + railKey;
  railPools[rk] = list;
  var idx = railPoolList.length;
  railPoolList.push(list);
  var shown = list.slice(0, RAIL_MAX);
  var cards = '';
  for (var i = 0; i < shown.length; i++){
    try { cards += cardHTML(shown[i]); }
    catch (e) { /* one bad card never kills the rail */ }
  }
  var door = list.length > RAIL_MAX
    ? '<button type="button" class="rail-ver" data-idx="' + idx + '" data-title="' + esc(title) + '">Ver todo &#8594;</button>'
    : '';
  return '<section class="rail-sec">' +
    '<div class="rail-head"><h2 class="rail-title">' + esc(title) + '</h2>' +
    '<span class="rail-count">' + list.length + '</span>' + door + '</div>' +
    '<div class="rail">' + cards + '</div></section>';
}
function openRailExpand(list, title){
  try {
    list = list || [];
    var ov = $('railExpand');
    if (!ov) return;
    $('reTitle').textContent = title || 'Productos';
    $('reCount').textContent = list.length + (list.length === 1 ? ' producto' : ' productos');
    var grid = $('reGrid');
    if (!grid) return;
    if (!list.length){
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px 16px;color:#6B7280">'
        + '<p style="font-weight:700;margin-bottom:8px">No pudimos cargar estos productos.</p>'
        + '<p style="font-size:13px">Cierra y vuelve a intentarlo.</p></div>';
    } else {
      var out = '';
      for (var i = 0; i < list.length; i++){
        try { out += cardHTML(list[i]); } catch (e) {}
      }
      grid.innerHTML = out;
    }
    ov.hidden = false;
    document.body.style.overflow = 'hidden';
    grid.scrollTop = 0;
    try { renderPenPrices(); } catch (e) {}
  } catch (e) {}
}
/* Legacy string-key entry point (kept for any external callers) */
function openRailExpandByKey(rk, title){
  try { openRailExpand(railPools[rk] || [], title); } catch (e) {}
}
function closeRailExpand(){
  try {
    var ov = $('railExpand');
    if (ov) ov.hidden = true;
    document.body.style.overflow = '';
  } catch (e) {}
}
if (typeof window !== 'undefined'){ window.closeRailExpand = closeRailExpand; }
function renderCarousels(){
  var host = $('content');
  if (!host) return;
  railPools = {};
  railPoolList = [];
  var cnt = $('countLine');
  if (cnt) cnt.textContent = allItems.length
    ? allItems.length.toLocaleString('es-PE') + ' productos en ' + storeMeta.label
    : '';
  /* Lead section: sales first (biggest discount), or Destacados when zero sales */
  var sales = allItems.filter(function(p){ return saleTier(p) > 0; });
  sales.sort(saleSort);
  var html = '';
  if (sales.length){
    html += railHTML('Ofertas de ' + storeMeta.label, sales, 'ofertas');
  } else {
    var feat = allItems.slice().sort(function(a,b){ return b.price - a.price; });
    html += railHTML('Destacados de ' + storeMeta.label, feat, 'destacados');
  }
  /* Category carousels: one per PRODUCT TYPE (DANNY 2026-10-07).
     Never group by department inside a store page -- a Gymshark page shows
     Leggings/Tops/Shorts, not a "Gym Rat" department carousel. */
  var byType = {};
  for (var i = 0; i < allItems.length; i++){
    var tk = productTypeOf(allItems[i]);
    (byType[tk] = byType[tk] || []).push(allItems[i]);
  }
  for (var j = 0; j < PRODUCT_TYPES.length; j++){
    var t = PRODUCT_TYPES[j];
    var list = (byType[t.key] || []).slice().sort(saleSort);
    if (list.length) html += railHTML(t.label, list, 'type::' + t.key);
  }
  host.innerHTML = html;
  var btns = host.querySelectorAll('.rail-ver');
  for (var k = 0; k < btns.length; k++){
    (function(btn){
      var idx = parseInt(btn.getAttribute('data-idx'), 10);
      var title = btn.getAttribute('data-title');
      btn.addEventListener('click', function(){
        try { openRailExpand(railPoolList[idx] || [], title); }
        catch (e) {}
      });
    })(btns[k]);
  }
  /* sort dropdown only applies to grid view; hide it in carousel mode */
  var s = $('sort');
  if (s) s.style.display = 'none';
}
function render(){
  var host = $('content');
  if (!host) return;
  /* empty catalog: same state as before, regardless of view */
  if (!allItems.length){
    host.innerHTML = '<div class="state"><h2>Estamos actualizando el catálogo</h2>' +
      '<p>' + esc(storeMeta.label) + ' está cargando sus productos. Vuelve en unos minutos.</p>' +
      '<button class="btn" id="retryBtn" type="button">Reintentar</button></div>';
    bindRetry();
    var c0 = $('countLine');
    if (c0) c0.textContent = '';
    return;
  }
  var f0 = currentFilters();
  /* DEFAULT VIEW: carousel merchandising (no search, no dept chip) */
  if (!f0.q && !f0.dept && !f0.gender && !f0.cat){ renderCarousels(); return; }
  /* SEARCH / FILTER VIEW: flat grid as before */
  var s = $('sort');
  if (s) s.style.display = '';
  var list;
  try { list = filteredItems(); }
  catch (e){ return renderError('No pudimos ordenar los productos.', true); }
  var cnt = $('countLine');
  if (cnt) cnt.textContent = list.length
    ? list.length.toLocaleString('es-PE') + ' productos en ' + storeMeta.label
    : '';
  if (!list.length){
    var emptyMsg = '<h2>Sin resultados</h2><p>Ningún producto coincide con tu búsqueda en ' + esc(storeMeta.label) + '.</p>';
    host.innerHTML = '<div class="state">' + emptyMsg +
      '<button class="btn" id="retryBtn" type="button">Reintentar</button></div>';
    bindRetry();
    return;
  }
  var html = '<div class="grid">';
  var n = Math.min(visibleCount, list.length);
  for (var i = 0; i < n; i++){
    try { html += cardHTML(list[i]); }
    catch (e) { /* one bad card never kills the grid */ }
  }
  html += '</div>';
  if (list.length > n){
    html += '<div style="text-align:center;margin-top:22px"><button class="btn" id="moreBtn" type="button">Ver más productos</button></div>';
  }
  host.innerHTML = html;
  var more = $('moreBtn');
  if (more) more.addEventListener('click', function(){
    visibleCount += PAGE_SIZE;
    try { render(); } catch (e) {}
  });
}
function renderError(msg, allowRetry){
  var host = $('content');
  if (!host) return;
  host.innerHTML = '<div class="state"><h2>Algo salió mal</h2>' +
    '<p>' + esc(msg || 'No pudimos cargar la tienda.') + '</p>' +
    (allowRetry ? '<button class="btn" id="retryBtn" type="button">Reintentar</button>' : '') + '</div>';
  bindRetry();
}
function bindRetry(){
  var b = $('retryBtn');
  if (b) b.addEventListener('click', function(){ boot(true); });
}
function renderNoCatalog(){
  var host = $('content');
  if (!host) return;
  host.innerHTML = '<div class="state"><h2>Catálogo en preparación</h2>' +
    '<p>Estamos conectando el catálogo de ' + esc(storeMeta.label) + '. ' +
    'Compramos por encargo mientras terminamos la integración.</p>' +
    '<a class="btn" href="search.html">Buscar productos</a></div>';
}

/* ---------- rendering: store directory ---------- */
function renderDirectory(){
  var dirWrap = $('dirWrap'), storeWrap = $('storeWrap'), hero = $('hero');
  if (hero) hero.hidden = true;
  if (storeWrap) storeWrap.hidden = true;
  if (!dirWrap) return;
  dirWrap.hidden = false;
  document.title = 'Tiendas en Estados Unidos — Aria Shop';
  var keys = Object.keys(STORES).sort(function(a,b){
    return STORES[a].label.localeCompare(STORES[b].label, 'es');
  });
  var dc = $('dirCount');
  if (dc) dc.textContent = keys.length + ' tiendas';
  var html = '';
  for (var i = 0; i < keys.length; i++){
    try {
      var k = keys[i], s = STORES[k];
      html += '<a class="dir-card" href="tienda.html?tienda=' + esc(k) + '">' +
        '<div class="dir-band">' +
          (s.logo ? '<img src="' + esc(s.logo) + '" alt="' + esc(s.label) + '" loading="lazy" onerror="this.style.display=\'none\'">' : esc(s.label)) +
        '</div>' +
        '<div class="dir-body"><div class="dir-name">' + esc(s.label) + '</div>' +
        (s.tagline ? '<div class="dir-tag">' + esc(s.tagline) + '</div>' : '') +
        '</div></a>';
    } catch (e) {}
  }
  var grid = $('dirGrid');
  if (grid) grid.innerHTML = html;
}

/* ---------- boot ---------- */
var booted = false;
function paintHero(){
  var hero = $('hero');
  if (!hero || !storeMeta) return;
  hero.hidden = false;
  try { hero.style.setProperty('--store', storeMeta.color || '#0A1F44'); } catch (e) {}
  /* STORE BACKDROP (2026-10-07): store imagery from assets/stores/ for mall feel */
  try{
    var _hb = $('heroBg'), _hs = $('heroScrim');
    if (_hb && storeKey){
      _hb.src = 'assets/stores/' + storeKey + '.jpg';
      _hb.hidden = false;
      if (_hs) _hs.hidden = false;
      _hb.onerror = function(){ _hb.hidden = true; if(_hs) _hs.hidden = true; };
    }
  }catch(_e){}
  var nm = $('heroName'), tag = $('heroTag'), lw = $('heroLogo'), li = $('heroLogoImg');
  if (nm) nm.textContent = storeMeta.label;
  if (tag) tag.textContent = storeMeta.tagline || 'Compra en Estados Unidos, entregado en Perú.';
  if (lw && li && storeMeta.logo){
    li.src = storeMeta.logo;
    li.alt = storeMeta.label;
    li.onerror = function(){ lw.hidden = true; };
    lw.hidden = false;
  }
  document.title = storeMeta.label + ' — Aria Shop';
}
function boot(isRetry){
  if (booted && !isRetry) return;
  booted = true;
  var key = (qs('tienda') || '').toLowerCase().trim();
  if (!key || !STORES[key]){
    // No valid store: the directory IS the page. Never blank, never an error.
    renderDirectory();
    return;
  }
  storeKey = key;
  storeMeta = STORES[key];
  var sw = $('storeWrap'), dw = $('dirWrap');
  if (dw) dw.hidden = true;
  if (sw) sw.hidden = false;
  paintHero();
  loadFx();
  loadStore().then(function(res){
    allItems = res.items || [];
    visibleCount = PAGE_SIZE;
    try {
      if (res.empty === 'nocatalog' || res.empty === 'nodata'){
        renderNoCatalog();
        return;
      }
      if (res.empty === 'failed' && !allItems.length){
        renderError('No pudimos cargar ' + storeMeta.label + '. Revisa tu conexión e inténtalo de nuevo.', true);
        return;
      }
      try { buildFacets(); } catch (e) { facetMode = false; }
      renderDeptChips();
      render();
    } catch (e){ renderError('No pudimos mostrar la tienda.', true); }
  }, function(){
    renderError('No pudimos cargar ' + (storeMeta ? storeMeta.label : 'la tienda') + '. Revisa tu conexión e inténtalo de nuevo.', true);
  });
}
function bindUI(){
  var q = $('q'), s = $('sort'), t = null;
  if (q) q.addEventListener('input', function(){
    if (t) clearTimeout(t);
    t = setTimeout(function(){ visibleCount = PAGE_SIZE; try { render(); } catch (e) {} }, 180);
  });
  if (s) s.addEventListener('change', function(){ visibleCount = PAGE_SIZE; try { render(); } catch (e) {} });
  var rb = $('reBack');
  if (rb) rb.addEventListener('click', function(){ try { closeRailExpand(); } catch (e) {} });
  document.addEventListener('keydown', function(ev){
    if (ev && ev.key === 'Escape'){ try { closeRailExpand(); } catch (e) {} }
  });
}
window.addEventListener('error', function(ev){
  try {
    if (document.getElementById('fatalBanner')) return;
    var b = document.createElement('div');
    b.id = 'fatalBanner';
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#0A1F44;color:#fff;padding:10px 14px;font-size:13px;text-align:center';
    b.innerHTML = 'Algo salió mal en esta página. <a href="" style="color:#FFC72C;font-weight:800">Recargar</a> · <a href="/" style="color:#FFC72C;font-weight:800">Inicio</a>';
    document.body.appendChild(b);
  } catch (e) {}
});

try {
  bindUI();
  boot(false);
} catch (e) {
  try { renderDirectory(); } catch (e2) {}
}
})();
