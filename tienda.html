<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda — Aria Shop</title>
<!-- One on-sale definition (index.html saleDiscountPct), loaded before the page script. -->
<script src="sale-rule.js"></script>
<script src="/off-sale.js"></script>
<meta name="description" content="Compra en tiendas de Estados Unidos con entrega en Perú. Precio honesto, sin letra pequeña.">
<style>
/* Standalone Tienda template — one page for every store (?tienda=clave).
   Zero dependencies: no frameworks, no CDN. If this stylesheet failed to
   load, the page still renders as plain readable HTML — never blank. */
:root{
  --navy:#0A1F44; --blue:#2F5FEE; --blue-dark:#1E46C4; --sky:#EAF0FF;
  --paper:#FAFAF8; --green:#1C8A4B; --green-bg:#EAF7EF; --line:#E4E6EC;
  --amber:#B8860B; --yellow:#FFC72C; --red:#D92D20; --store:#0A1F44;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);color:var(--navy);-webkit-font-smoothing:antialiased}
/* ---- header ---- */
.site-header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1240px;margin:0 auto;padding:0 12px;height:64px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{text-decoration:none;display:flex;align-items:center;gap:8px}
.wordmark .w1{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-size:20px}
.wordmark .w2{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-size:20px}
.main-nav{display:none;align-items:center;gap:20px;font-size:13.5px}
.main-nav a{color:var(--navy);text-decoration:none;opacity:.75;white-space:nowrap}
.main-nav a:hover{opacity:1}
@media(min-width:1024px){.main-nav{display:flex}}
.header-meta{font-size:13px;color:#6b7280;white-space:nowrap}
/* ---- hero ---- */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--store) 0%,#0A1F44 70%);color:#fff;
  padding:36px 12px 30px}
.hero .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;}
.hero .hero-scrim{position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,20,40,.72) 0%,rgba(10,20,40,.88) 100%);}
.hero-inner{position:relative;z-index:1;max-width:1240px;margin:0 auto}
.hero-logo{background:#fff;border-radius:16px;display:inline-flex;align-items:center;
  padding:10px 18px;margin-bottom:14px;max-width:100%}
.hero-logo img{height:40px;max-width:220px;object-fit:contain;display:block}
.hero-logo[hidden]{display:none}
.hero-name{margin:0 0 6px;font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.02em}
.hero-tag{margin:0;color:rgba(255,255,255,.82);font-size:15px;max-width:640px}
.eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:#fff;background:rgba(255,255,255,.16);
  padding:6px 12px;border-radius:999px;margin-bottom:12px}
/* ---- page ---- */
.page{max-width:1240px;margin:0 auto;padding:20px 12px 64px}
@media(min-width:640px){.page{padding:28px 20px 72px}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.toolbar input[type="search"]{flex:1 1 220px;min-width:0;padding:11px 14px;font-size:14px;
  border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--navy)}
.toolbar select{padding:11px 12px;font-size:14px;border:1px solid var(--line);
  border-radius:12px;background:#fff;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:#fff;color:var(--navy);font-size:13px;
  font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.count-line{font-size:13.5px;color:#4b5563;margin:0 0 14px}
/* ---- grid & cards ---- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;text-decoration:none;color:inherit}
.card-img{position:relative;aspect-ratio:1/1;background:#f1f2f6;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;
  font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:2}
.card-body{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-brand{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6b7280}
.card-title{font-size:13.5px;font-weight:600;line-height:1.35;margin:0;color:var(--navy);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-prices{margin-top:auto;padding-top:8px}
.price-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price{font-size:19px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.price-old{font-size:13.5px;color:#9aa1b2;text-decoration:line-through;font-variant-numeric:tabular-nums}
.price-pen{font-size:12.5px;color:#4b5563;font-variant-numeric:tabular-nums}
/* ---- store directory ---- */
.dir-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.dir-grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1024px){.dir-grid{grid-template-columns:repeat(4,1fr)}}
.dir-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  text-decoration:none;color:inherit;display:flex;flex-direction:column}
.dir-band{height:64px;display:flex;align-items:center;justify-content:center;padding:10px;background:#fff;border-bottom:1px solid var(--line)}
.dir-band img{max-height:40px;max-width:80%;object-fit:contain}
.dir-body{padding:12px 14px}
.dir-name{font-weight:800;font-size:14px;color:var(--navy)}
.dir-tag{font-size:12.5px;color:#6b7280;margin-top:2px}
/* ---- states ---- */
.state{border:1px dashed var(--line);border-radius:16px;background:#fff;
  padding:48px 24px;text-align:center;color:#4b5563;font-size:15px}
.state h2{color:var(--navy);font-size:20px;margin:0 0 8px}
.state p{margin:0 0 18px}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;cursor:pointer;
  font-size:15px;font-weight:800;padding:12px 26px;border-radius:12px;text-decoration:none}
.btn:hover{background:var(--blue-dark)}
.skel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.skel-grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1024px){.skel-grid{grid-template-columns:repeat(4,1fr)}}
.skel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.skel .ph{aspect-ratio:1/1;background:linear-gradient(100deg,#eef0f4 40%,#f7f8fb 50%,#eef0f4 60%);
  background-size:200% 100%;animation:sh 1.4s infinite}
.skel .ln{height:12px;border-radius:6px;background:#eef0f4;margin:10px 12px}
.skel .ln.short{width:55%}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel .ph{animation:none}}
/* ---- footer ---- */
.site-footer{border-top:1px solid var(--line);background:#fff;margin-top:24px}
.footer-inner{max-width:1240px;margin:0 auto;padding:28px 12px;font-size:13px;color:#6b7280;
  display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.site-footer a{color:var(--blue);text-decoration:none}

/* ---- carousels (2026-10-07, Danny): sales-first merchandising ---- */
.rail-sec{margin:0 0 28px}
.rail-head{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.rail-title{font-size:19px;font-weight:800;color:var(--navy);margin:0;letter-spacing:-.01em}
.rail-count{font-size:11.5px;font-weight:700;color:#fff;background:var(--navy);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.rail-ver{margin-left:auto;flex-shrink:0;background:none;border:none;font-size:13px;font-weight:800;color:var(--blue);cursor:pointer;padding:6px 2px}
.rail-ver:hover{text-decoration:underline}
.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{height:6px}
.rail::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.rail .card{flex:0 0 164px;scroll-snap-align:start;min-width:0}
@media(min-width:640px){.rail .card{flex-basis:196px}}
/* ---- rail expand overlay (2026-10-07): full-screen "Ver todo" ---- */
.rail-expand{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;flex-direction:column}
.rail-expand[hidden]{display:none}
.re-head{flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:12px}
.re-back{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:none;background:var(--sky);display:grid;place-items:center;cursor:pointer}
.re-title{font-size:17px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.re-count{font-size:12px;font-weight:600;color:#6b7280}
.re-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;align-content:start}
@media(min-width:640px){.re-grid{grid-template-columns:repeat(3,1fr);max-width:1100px;margin:0 auto;width:100%}}
@media(min-width:1024px){.re-grid{grid-template-columns:repeat(4,1fr)}}

/* ---- SLICED STOREFRONT (2026-10-19, #413 + #409) ----
   A store launched in the thin format (STORES[k].slices) never downloads
   its catalogue: index.json paints the first screen, rail pages come 48
   cards at a time. Cards hold their shape from the first paint (square
   photo box via aspect-ratio, padding-top for Safari < 15; reserved text
   and price rows), photos load when about to be seen, soles lead. */
.sl .card{border-radius:14px}
/* THE OVERLAY'S CARDS ARE CARDS, NOT LINES (2026-10-19, #409 T2). The
   "Ver todo" grid is a fixed-height scroller (flex:1), and auto rows in a
   grid of definite height are squeezed to fit it: 48 cards became 16px
   slivers -- the customer's "million lines" -- and, all being on screen,
   fetched all 48 photos at once. Rows take their content's height, and a
   card's photo box never shrinks. */
.re-grid.sl{grid-auto-rows:max-content}
.sl .card-img{flex-shrink:0}
.sl .card-img{aspect-ratio:1/1;background:#F3F5F9}
@supports not (aspect-ratio:1/1){ .sl .card-img{height:0;padding-top:100%} }
.sl .card-img img{position:absolute;inset:0;top:0;left:0;width:100%;height:100%;object-fit:contain}
.sl .card-brand{min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .card-title{min-height:36px}
.sl .card-prices{min-height:44px;padding-top:6px}
.sl .pen{font-size:18px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.sl .usd{font-size:12px;color:#6b7280;font-variant-numeric:tabular-nums;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .usd s{color:#9aa1b2}
.sl .badge{background:var(--tag,#FFC72C);color:#111;border-radius:6px}
.sl .card.sk .ln{height:11px;border-radius:6px;background:#eef0f4;margin:4px 0}
.sl .card.sk .ln.short{width:55%}
.sl .card.sk .card-img{background:linear-gradient(100deg,#eef0f4 40%,#f7f8fb 50%,#eef0f4 60%);background-size:200% 100%;animation:sh 1.4s 4}
.sl .rail-title{color:var(--store)}
.sl .rail-count{background:var(--store)}
.sl .rail-ver{color:var(--store)}
.sl .chip.active{background:var(--store);border-color:var(--store)}
.sl .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.sl .chips::-webkit-scrollbar{display:none}
.sl .chip{flex:0 0 auto;white-space:nowrap}
.sl-more{text-align:center;margin:18px 0 6px}
/* Deals-first hero (#443 c.6470118615): one card above the aisles. */
.deals-hero{background:var(--store);border-radius:22px;padding:18px 16px 16px;margin:0 0 26px;color:#fff}
.deals-hero h2{font-size:30px;line-height:1.05;font-weight:900;letter-spacing:-.02em;margin:0}
.deals-hero p{font-size:13.5px;font-weight:600;opacity:.88;margin:6px 0 14px}
.deals-hero .dh-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.deals-hero .dh-grid{grid-template-columns:repeat(4,1fr)}.deals-hero h2{font-size:36px}}
.deals-hero .dh-item{position:relative;display:block;background:#fff;border-radius:14px;aspect-ratio:1/1;overflow:hidden}
.deals-hero .dh-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px}
.deals-hero .dh-badge{position:absolute;top:8px;left:8px;z-index:1;background:var(--tag,#FFC72C);color:#111;font-weight:900;font-size:15px;border-radius:8px;padding:3px 7px}
.deals-hero .dh-go{display:block;width:100%;margin-top:14px;background:#fff;color:var(--store);border:none;border-radius:999px;padding:13px 16px;font-weight:800;font-size:15px;cursor:pointer}
/* Sub-carousels (#443 c.6458236993): audience heading, then a rail per type. */
.sub-wrap{grid-column:1/-1;min-width:0}
.sub-aud{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin:6px 0 10px}
.sub-wrap .rail-title{font-size:17px}
.sl-more .btn{background:var(--store)}
.hero.themed{background:linear-gradient(135deg,var(--store) 0%,var(--store-end,#002B7A) 100%)}
.hero.themed .hero-scrim{background:linear-gradient(135deg,rgba(0,40,120,.78) 0%,rgba(0,20,70,.88) 100%)}
/* A black-and-white store (DSW, #443): the scrim is black, not Best Buy's navy. */
.hero.themed.mono{background:var(--store)}
.hero.themed.mono .hero-scrim{background:linear-gradient(135deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.86) 100%)}
.hero.themed.mono .hero-word{background:#fff;color:#000}
.store-mono .sl .badge{background:#000;color:#fff}
.hero-tagbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--tag,#FFC72C);z-index:1}
.hero-word{display:inline-block;background:#fff;color:var(--store);font-weight:900;font-size:22px;letter-spacing:-.01em;border-radius:12px;padding:8px 16px;margin-bottom:12px}
.hero-word[hidden]{display:none}
.trust{background:#fff;border:1px solid var(--line);border-left:5px solid var(--store);border-radius:16px;padding:16px;margin:0 0 28px}
.trust h2{margin:0 0 10px;font-size:16px;font-weight:800;color:var(--navy)}
.trust ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
@media(min-width:760px){.trust ul{grid-template-columns:repeat(3,1fr)}}
.trust li{font-size:13px;line-height:1.45;color:#374151}
.trust li b{display:block;color:var(--navy);font-size:13.5px;margin-bottom:2px}
.trust a{color:var(--store);font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<script src="/ref.js"></script>
<!-- META + TIKTOK PIXELS (#415): the IDs and the events live in assets/js/pixels.js. -->
<script>window.ariaTrack=window.ariaTrack||function(){(ariaTrack.q=ariaTrack.q||[]).push(arguments)};</script>
<script src="/assets/js/pixels.js" async></script>
<!-- CARDS THAT FEEL ALIVE on every carousel (#443): grow on hover / phone center-focus. -->
<script src="/assets/js/card-grow.js" defer></script>
<script src="/assets/js/card-photos.js" defer></script>
</head>

  <div class="header-inner">

<script>
/* Standalone Tienda template — one page for every store (?tienda=clave).
   Thin by design (#409 track T2): no storefront downloads its catalogue.
   The first screen is one small static file per store
   (assets/tienda/<key>/index.json); a chip, the search box, the sort
   menu and "Ver todo" ask /.netlify/functions/tienda for 48 cards at a
   time. Bulletproof by design:
   - Static HTML shell renders immediately (never blank).
   - Missing/invalid ?tienda renders the full store directory, not an error.
   - Every fetch has a timeout; total failure shows a retry panel.
   - One bad product can never kill the grid (per-card try/catch).
   - window.onerror shows a slim banner instead of a silent death. */
(function(){
'use strict';

/* ---------- embedded store registry ----------

function fetchJson(url){
  return new Promise(function(resolve, reject){
    var ctrl = null, timer = null;
    try { ctrl = new AbortController(); } catch (e) {}
    if (ctrl) timer = setTimeout(function(){ try { ctrl.abort(); } catch (e2) {} }, TIMEOUT_MS);
    var opts = ctrl ? { signal: ctrl.signal } : {};
    fetch(url, opts).then(function(res){
      if (timer) clearTimeout(timer);
      if (!res.ok) { reject(new Error('HTTP ' + res.status)); return; }
      res.json().then(resolve, reject);
    }, function(err){
      if (timer) clearTimeout(timer);
      reject(err);
    });
    if (!ctrl) setTimeout(function(){ reject(new Error('timeout')); }, TIMEOUT_MS);
  });
}

function slPriceHTML(p){

  }
  return '<div class="pen">' + (fxFailed ? 'US' + fmtUSD(f) : '&nbsp;') + '</div><div class="usd">' +

var fxFailed = false;

/* A PHOTO LOADS WHEN ITS CARD IS ABOUT TO BE SEEN -- search.html's

var PHOTO_IO = null;

var TRUST = {};  /* the only entry was Best Buy's; Best Buy is off sale (#457) */

/* Labelled sub-carousels: Mujer, then Zapatillas, Sandalias...; each

  if (r.lazy && !r.head.length) cards = SL_SKEL_CARD + SL_SKEL_CARD + SL_SKEL_CARD + SL_SKEL_CARD;

function slCountLine(){

/* THE DEALS-FIRST HERO (#443 c.6470118615): the deepest real markdowns,

function slRenderHome(){

    if (key !== slGrid.key) return;
    slGrid.busy = false;
    slGrid.page = j.page || slGrid.page + 1;
    slGrid.pages = j.pages || slGrid.page;
    var cnt = $('countLine');
    if (cnt) cnt.textContent = Number(j.total || 0).toLocaleString('es-PE') + (j.total === 1 ? ' producto' : ' productos') + ' en ' + storeMeta.label;
    if (slGrid.page === 1 && !(j.items || []).length){
      host.innerHTML = '<div class="state"><h2>Sin resultados</h2><p>Ningún producto de ' + esc(storeMeta.label) + ' coincide con tu búsqueda.</p></div>';
      return;
    }
    if (slGrid.page === 1) host.innerHTML = '<div class="grid" id="slGrid"></div>';
    var grid = $('slGrid');
    var html = '';
    for (var i = 0; i < (j.items || []).length; i++){ try { html += slCardHTML(j.items[i]); } catch (e) {} }
    grid.insertAdjacentHTML('beforeend', html);
    var old = $('slSearchMoreWrap');
    if (old) old.remove();
    if (slGrid.page < slGrid.pages){
      grid.insertAdjacentHTML('afterend', '<div class="sl-more" id="slSearchMoreWrap"><button class="btn" type="button" id="slSearchMoreBtn">Mostrar más</button></div>');
      $('slSearchMoreBtn').addEventListener('click', slGridMore);
    }
    watchPhotos(grid);
  }, function(){
    if (key !== slGrid.key) return;
    slGrid.busy = false;
    if (slGrid.page === 0){
      host.innerHTML = '<div class="state"><h2>No pudimos cargar estos productos</h2><p>Revisa tu conexión y vuelve a intentarlo.</p>' +
        '<button class="btn" id="slGridRetry" type="button">Reintentar</button></div>';
      var rb = $('slGridRetry');
      if (rb) rb.addEventListener('click', slApply);
    } else if (btn){ btn.disabled = false; btn.textContent = 'Reintentar'; }
  });
}
/* The store's backdrop photo waits for the first-screen product photos
   (or four seconds): on a 400 kbps link a 300KB interior shot used to
   arrive before a single product. The phone-sized copy is ~45KB
   (scripts/build-tienda-heroes.py). */
function slHeroLater(){
  var started = false;
  function go(){ if (started) return; started = true; try { loadHeroPhoto(); } catch (e) {} }
  setTimeout(go, 4000);
  try {
    var first = [].slice.call(document.querySelectorAll('#content .rail-sec:first-child img')).slice(0, 4);
    if (!first.length){ go(); return; }
    var left = first.length;
    var done = function(){ if (--left <= 0) go(); };
    first.forEach(function(im){
      if (im.complete && im.src) done();
      else { im.addEventListener('load', done); im.addEventListener('error', done); }
    });
  } catch (e) { go(); }
}
function bootSliced(){
  var sw = $('storeWrap');
  if (sw) sw.classList.add('sl');
  var s = $('sort');
  if (s) s.style.display = 'none';
  try { document.documentElement.style.setProperty('--store', storeMeta.color || '#0A1F44'); } catch (e) {}
  try { if (storeMeta.tag) document.documentElement.style.setProperty('--tag', storeMeta.tag); } catch (e) {}
  var q = $('q');
  if (q) q.placeholder = 'Busca en ' + storeMeta.label + '…';
  slSkeleton();
  /* The rate the home page and search already cached, then the live one. */
  fxVenta = cachedFx();
  fetchJson(FX_URL).then(function(j){
    var v = Number(j && (j.venta || j.Venta));
    if (Number.isFinite(v) && v > 0){ fxVenta = v; storeFx(v); }
    else if (!fxVenta) fxFailed = true;
    renderSlPrices();
  }, function(){ if (!fxVenta){ fxFailed = true; renderSlPrices(); } });
  fetchJson(BASE + sliceDir() + 'index.json').then(function(j){
    slIndex = j;
    if (!j || !j.count){ renderNoCatalog(); loadHeroPhoto(); return; }
    slChips();
    slRenderHome();
    slHeroLater();
  }, function(){
    renderError('No pudimos cargar ' + storeMeta.label + '. Revisa tu conexión e inténtalo de nuevo.', true);
  });
}

/* ---------- boot ---------- */
var booted = false;
/* STORE BACKDROP (2026-10-07): store imagery for the mall feel. A store
   that names its own photo (Best Buy's interior, #413) wears that one;
   when the file is absent the hero stays a clean brand band, never a
   stand-in. */
function loadHeroPhoto(){
  var _hb = $('heroBg'), _hs = $('heroScrim');
  if (!_hb || !storeKey || !storeMeta) return;
  var src = storeMeta.heroPhoto || (isThemed() ? '' : '/assets/tienda/hero/' + storeKey + '.jpg');
  if (!src) return;
  _hb.onerror = function(){ _hb.hidden = true; if (_hs) _hs.hidden = true; };
  _hb.onload = function(){ _hb.hidden = false; if (_hs) _hs.hidden = false; };
  try { _hb.setAttribute('fetchpriority', 'low'); } catch (e) {}
  _hb.src = src;
}
function paintHero(){
  var hero = $('hero');
  if (!hero || !storeMeta) return;
  hero.hidden = false;
  try { hero.style.setProperty('--store', storeMeta.color || '#0A1F44'); } catch (e) {}
  /* THEMED HERO (2026-10-19, #413): a store that names its own colours
     (Best Buy) wears them -- its blue, its yellow tag rule, its name as a
     wordmark until its logo file lands. */
  if (isThemed()){
    hero.classList.add('themed');
    if (storeMeta.heroEnd){ try { hero.style.setProperty('--store-end', storeMeta.heroEnd); } catch (e) {} }
    if (/^#(000|000000|fff|ffffff)$/i.test(String(storeMeta.color || ''))){ hero.classList.add('mono'); document.documentElement.classList.add('store-mono'); }
    var _tb = $('heroTagbar');
    if (_tb){ hero.style.setProperty('--tag', storeMeta.tag); _tb.hidden = false; }
    if (!storeMeta.logo){
      var _hw = $('heroWord');
      if (_hw){ _hw.textContent = storeMeta.label; _hw.hidden = false; }
      var _nm = $('heroName');
      if (_nm) _nm.className = 'hero-name sr-only';
    }
  }
  var nm = $('heroName'), tag = $('heroTag'), lw = $('heroLogo'), li = $('heroLogoImg');
  if (nm) nm.textContent = storeMeta.label;
  if (tag) tag.textContent = storeMeta.tagline || 'Compra en Estados Unidos, entregado en Perú.';
  if (lw && li && storeMeta.logo){
    li.src = storeMeta.logo;
    li.alt = storeMeta.label;
    li.onerror = function(){ lw.hidden = true; };
    lw.hidden = false;
  }
  document.title = storeMeta.label + ' — Aria Shop';
}
function boot(isRetry){
  if (booted && !isRetry) return;
  booted = true;
  var key = (qs('tienda') || '').toLowerCase().trim();
  if (!key || !STORES[key] || STORES[key].pendingCatalog){
    // No valid store (or one whose catalogue is still pending, DSW #443):
    // the directory IS the page. Never blank, never an error, never a dead end.
    renderDirectory();
    return;
  }
  storeKey = key;
  storeMeta = STORES[key];
  var sw = $('storeWrap'), dw = $('dirWrap');
  if (dw) dw.hidden = true;
  if (sw) sw.hidden = false;
  paintHero();
  /* Every store answers from its slices; the registry's `files` only tell the
     build which catalogues to read. */
  bootSliced();
}
function bindUI(){
  var q = $('q'), s = $('sort'), t = null;
  if (q) q.addEventListener('input', function(){
    if (t) clearTimeout(t);
    t = setTimeout(function(){ try { slApply(); } catch (e) {} }, 300);
  });
  if (s) s.addEventListener('change', function(){ try { slApply(); } catch (e) {} });
  /* The overlay's markup comes after this script, so #reBack does not
     exist yet when this runs (the back arrow never closed "Ver todo").
     One delegated listener answers it whenever it is there. */
  document.addEventListener('click', function(ev){
    var t = ev && ev.target;
    if (t && t.closest && t.closest('#reBack')){ try { slBack(); } catch (e) {} }
  });
  document.addEventListener('keydown', function(ev){
    if (ev && ev.key === 'Escape'){ try { slBack(); } catch (e) {} }
  });
}

window.addEventListener('error', function(ev){
  try {
    if (document.getElementById('fatalBanner')) return;
    var b = document.createElement('div');
    b.id = 'fatalBanner';
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#0A1F44;color:#fff;padding:10px 14px;font-size:13px;text-align:center';
    b.innerHTML = 'Algo salió mal en esta página. <a href="" style="color:#FFC72C;font-weight:800">Recargar</a> · <a href="/" style="color:#FFC72C;font-weight:800">Inicio</a>';
    document.body.appendChild(b);
  } catch (e) {}
});

try {
  bindUI();
  boot(false);
} catch (e) {
  try { renderDirectory(); } catch (e2) {}
}
})();
</script>

<!-- RAIL EXPAND OVERLAY (2026-10-07): full-screen "Ver todo" for carousels -->
<div id="railExpand" class="rail-expand" hidden role="dialog" aria-modal="true" aria-labelledby="reTitle">
  <div class="re-head">
    <button type="button" class="re-back" id="reBack" aria-label="Volver">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A1F44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div style="min-width:0">
      <div id="reTitle" class="re-title"></div>
      <div id="reCount" class="re-count"></div>
    </div>
  </div>
  <div id="reGrid" class="re-grid"></div>
</div>
<!-- Aria's orb on every page (#386): assets/js/aria-launcher.js -->
<script src="/assets/js/aria-launcher.js" defer></script>
</body>
