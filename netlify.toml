# Netlify configuration for ariashop.pe.
#
# NOTE: build command / publish directory / environment are configured in the
# Netlify UI and intentionally NOT duplicated here. This file only carries
# settings that must live in the repo. Adding a [build] section here would
# override the UI — do not add one without checking the UI first.

# REPO FILES GO ONLY TO THE FUNCTION THAT READS THEM (2026-10-18, #367).
# This list used to sit under [functions] itself, which copies it into
# EVERY function: with the October catalogues it reached 221MB per
# function -- against Lambda's 250MB unzipped ceiling, and a cold start
# that has to fetch and unpack all of it. orders-create (checkout's Pagar)
# carried 216MB of catalogues it never opens, and the rehearsal's Pagar
# died with a bare platform error. Only two functions read repo files.

# The MCP connector (netlify/functions/mcp.js) reads index.html, the JS
# bundle and the catalogue JSONs off disk at boot (scripts/lib/mcp/paths.mjs).
[functions."mcp"]
  included_files = ["index.html", "build/*.js", "*-catalog.json", "department-cache*.json"]

# price-index.json (~5MB): what checkout charges per product, built by
# scripts/build-price-index.mjs (orders-create.js reprices every line).
[functions."orders-create"]
  included_files = ["price-index.json"]

# Search (2026-10-19, #409): the slim index, the engine and the Spanish
# dictionary answer /api/search on the server; the phone never downloads
# them. search.html fetches 48 cards at a time. The auto-parts glossary
# (#416) gives the dictionary its car-part phrases ("pastillas de freno").
[functions."search"]
  included_files = ["assets/search/catalog-index.json", "assets/search/synonyms-es.json", "search-engine.js", "search-pipeline.js", "scripts/lib/es-en-parts-glossary.json"]

# /api/* is the public name for the functions the front end calls. The
# realtime token endpoint is the one that matters: the build spec curls
# /api/realtime-token, and until this redirect existed that path 404'd
# while the function itself was healthy under its .netlify name —
# which is how "the backend was never built" became the diagnosis.
[[redirects]]
  from = "/api/realtime-token"
  to = "/.netlify/functions/realtime-token"
  status = 200
  force = true

# The owned voice's door (#443 c.6416074857): a LiveKit token for one
# fresh room with Aria's agent in it. Off, unconfigured or broken, it
# answers fallback "realtime" and the page uses the Realtime voice.
[[redirects]]
  from = "/api/voice-token"
  to = "/.netlify/functions/voice-token"
  status = 200
  force = true

# The owned voice's memory (#443 rider 3): the worker's door only;
# every request carries a worker token (_voice-thread.js).
[[redirects]]
  from = "/api/voice-thread"
  to = "/.netlify/functions/voice-thread"
  status = 200
  force = true

# THE APP BUNDLE PHONES DOWNLOAD (2026-10-19, #417 night order 3).
# index.html, the tests and the MCP connector name the bundle's source,
# build/app-<hash>.js (596KB gzipped, comments and all). Browsers get the
# minified copy (241KB) that scripts/build-app-min.mjs writes beside it.
# force = true because the source file exists at the requested path.
# The first rule keeps /build/min/ itself from being rewritten again.
[[redirects]]
  from = "/build/min/*"
  to = "/build/min/:splat"
  status = 200

[[redirects]]
  from = "/build/*"
  to = "/build/min/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200
  force = true

# Aria Motos (2026-10-19, #409 track T5): motos.html's grid is static
# pages (assets/sections/motos/); this function answers its search box
# from one row per product. The phone never downloads the catalogue.
[functions."motos"]
  included_files = ["assets/sections/motos/_fn/items.json"]

# Brands (2026-10-19, #409 track T5): marca.html's first screen is a
# static head (assets/sections/marca/<key>.json) for every brand with 12+
# products; this function answers smaller brands, title-word keys and
# "Ver todo" from one row per product. The phone never downloads it.
[functions."brand"]
  included_files = ["assets/sections/marca/_fn/items.json"]

# Departments (2026-10-19, #409 track T5): departamento.html's first
# screen is static slices (assets/sections/departamento/<dept>/); this
# function answers "Ver todo", the store chips and the department search
# box from each department's full card list. The phone never downloads it.
[functions."department"]
  included_files = ["assets/sections/departamento/_fn/*.json"]

# Ofertas (2026-10-19, #409): ofertas.html paints its first 48 deals from
# static slices (assets/ofertas/slices/); this answers "Mostrar más" and
# the page's search box from the packed deal list. Built by
# scripts/build-ofertas-slices.mjs.
[functions."ofertas"]
  included_files = ["assets/ofertas/deals.json"]

# Storefronts (2026-10-19, #409 track T2): tienda.html paints every
# store's first screen from a static file (assets/tienda/<key>/index.json);
# this answers "Ver todo", the chips, the store's search box and the sort
# menu from each store's full card list. Built by
# scripts/build-store-slices.mjs. The phone never downloads it.
[functions."tienda"]
  included_files = ["assets/tienda/_fn/*.json"]

# hidden-docs/ (#443): internal briefs and the blank Amex template live in
# the repo for the build, not on the site. Forced so a published copy is
# never served; any path under it answers 404.
# price-index.json (#443 item 32): checkout's own price list, read only by
# orders-create (included_files above). It carries each product's dutiable
# base -- for Aria Perfumes that is the supplier's cost -- so it is never
# served to a browser. No page fetches it.
[[redirects]]
  from = "/price-index.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/hidden-docs/*"
  to = "/404"
  status = 404
  force = true

# voice-agent/ (#443 owned voice) is the worker LiveKit Cloud runs from
# its own image; it is source for that build, not part of the site.
[[redirects]]
  from = "/voice-agent/*"
  to = "/404"
  status = 404
  force = true
